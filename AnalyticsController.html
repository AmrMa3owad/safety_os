<script>
/*================================================================
 * SafetyOS | AnalyticsController — Dashboard & UI manager v1.0
 * ----------------------------------------------------------------
 * SRP: Renders all analytics visualizations. Manages draggable
 *      float panels, and radial dock.
 *      All date math delegates to TimezoneService — zero UTC hacks.
 *
 * Depends on: CoreBus, TimezoneService
 *================================================================*/
(function (global) {
    'use strict';

    var EB    = global.App.EventBus;
    var Store = global.App.Store;
    var Cache = global.App.LocalCache;
    var RPC   = global.App.RpcClient;
    var TZ    = global.App.TimezoneService;
    var E     = EB.E;

    var TPH_TARGET    = 12.5;
    var AHT_TARGET_MIN = 4.8;

    // ══════════════════════════════════════════════════════════════
    // Helpers
    // ══════════════════════════════════════════════════════════════

    function _isSolved(r)    { var s = String(r.Status || '').toLowerCase().trim(); return s === 'solved' || s === 'closed'; }
    function _getDuration(r) { var v = parseFloat(r.DurationMin); return (isNaN(v) || !isFinite(v) || v < 0) ? 0 : v; }
    function _tphSt(t)       { return t >= TPH_TARGET ? (t > TPH_TARGET ? 'exceeded' : 'reached') : 'under'; }
    function _ahtSt(a)       { if (a == null) return null; return a <= AHT_TARGET_MIN ? (a < AHT_TARGET_MIN ? 'exceeded' : 'reached') : 'under'; }

    // ══════════════════════════════════════════════════════════════
    // Main compute — all date operations via TimezoneService
    // ══════════════════════════════════════════════════════════════

    // ══════════════════════════════════════════════════════════════
    // GOD-MODE ANALYTICS ENGINE v3.0
    // Dynamic Shift Instance Algorithm
    // — No calendar dates. No fixed anchors. Pure human logic.
    // ══════════════════════════════════════════════════════════════

    var SHIFT_BREAK_GAP_MS  = 6 * 60 * 60 * 1000;  // 6-hour gap = new shift
    var DEAD_AIR_GAP_MS     = 90 * 60 * 1000;       // 90-min gap = off-duty (meeting/training)
    var SHIFT_DURATION_MS   = 9 * 60 * 60 * 1000;   // Standard 9-hour shift ceiling
    var BREAK_TOTAL_MIN     = 75;                    // 15+30+15+15 mins of allotted breaks

    /**
     * Splits a flat sorted array of ticket objects (with .d = Date) into
     * discrete Shift Instances using the 6-hour rest gap rule.
     * @param {Array} sortedRows  — [{r, d}] sorted chronologically
     * @returns {Array<Array>}    — array of shift instance arrays
     */
    function _buildShiftInstances(sortedRows) {
        var instances = [];
        var current   = [];
        sortedRows.forEach(function (x) {
            if (current.length === 0) {
                current.push(x);
            } else {
                var gap = x.d - current[current.length - 1].d;
                if (gap >= SHIFT_BREAK_GAP_MS) {
                    instances.push(current);
                    current = [x];
                } else {
                    current.push(x);
                }
            }
        });
        if (current.length > 0) instances.push(current);
        return instances;
    }

    /**
     * Calculates Active Handling Time for a shift instance.
     * Deducts any intra-shift gap > 90 minutes (off-duty excused time).
     * @param {Array}   rows     — shift instance [{r, d}]
     * @param {Date}    now
     * @param {boolean} shiftEnded — true if agent went dark > 6h after last ticket
     * @returns {{ grossMs, activeMs, offDutyMs, isOvertime }}
     */
    function _calcShiftTime(rows, now, shiftEnded) {
        if (!rows || rows.length === 0) {
            return { grossMs: 0, activeMs: 0, offDutyMs: 0, isOvertime: false };
        }

        var firstD    = rows[0].d;
        var lastD     = rows[rows.length - 1].d;

        // Sum all off-duty gaps (> 90 min) within this shift
        var offDutyMs = 0;
        for (var i = 1; i < rows.length; i++) {
            var gap = rows[i].d - rows[i - 1].d;
            if (gap > DEAD_AIR_GAP_MS) offDutyMs += gap;
        }

        // Gross elapsed: either from first to last ticket (ended/early leave)
        // or first ticket to now (active), capped at 9h unless overtime
        var shiftEndExpected = new Date(firstD.getTime() + SHIFT_DURATION_MS);
        var isOvertime       = !shiftEnded && now > shiftEndExpected;

        var grossMs;
        if (shiftEnded) {
            // Shift over: locked footprint = first to last ticket only
            grossMs = Math.max(0, lastD - firstD);
        } else if (isOvertime) {
            // Overtime: clock runs freely from first ticket to now
            grossMs = Math.max(0, now - firstD);
        } else {
            // Active shift: grows with now, ceiling at 9 hours
            grossMs = Math.min(now - firstD, SHIFT_DURATION_MS);
        }

        // Deduct confirmed off-duty time from gross
        var netMs = Math.max(0, grossMs - offDutyMs);

        // Deduct breaks using TP Egypt standard: 75 minutes fixed per 9-hour shift
        // (15 min + 30 min lunch + 15 min + 15 min = 75 min per TP operational standards)
        // CRITICAL: Break deduction is CAPPED at 75 minutes — it never exceeds real contracted break time.
        // Proportional for shorter shifts (early leave), but hard-capped for overtime.
        var shiftRatioElapsed = Math.min(1, grossMs / SHIFT_DURATION_MS); // 0.0 → 1.0, capped at 1
        var breakDeductMs = shiftRatioElapsed * (BREAK_TOTAL_MIN * 60 * 1000); // max 75 min
        var activeMs      = Math.max(0, netMs - breakDeductMs);

        return { grossMs: grossMs, activeMs: activeMs, offDutyMs: offDutyMs, isOvertime: isOvertime };
    }

    function computeDashboard(res) {
        if (!res || !res.rows || !Array.isArray(res.rows)) return;

        var tz = res.timezone || TZ.DEFAULT_TZ;
        TPH_TARGET     = (res.targets && res.targets.tph)    || TPH_TARGET;
        AHT_TARGET_MIN = (res.targets && res.targets.ahtMin) || AHT_TARGET_MIN;

        var now = new Date();

        // ── STEP 1: Parse & sort all ticket timestamps ──────────────────────────
        var allRows = res.rows.map(function (r) {
            return { r: r, d: TZ.getTicketDate(r) };
        }).filter(function (x) { return x.d !== null; });

        allRows.sort(function (a, b) { return a.d - b.d; });

        // ── STEP 2: Build Dynamic Shift Instances (6-hour rest gap) ─────────────
        var shiftInstances = _buildShiftInstances(allRows);

        // ── STEP 3: Identify the Active (most recent) shift ────────────────────
        var activeInstance = shiftInstances.length > 0
            ? shiftInstances[shiftInstances.length - 1]
            : [];

        var shiftStartObj  = activeInstance.length > 0 ? new Date(activeInstance[0].d) : null;
        var lastD          = activeInstance.length > 0 ? activeInstance[activeInstance.length - 1].d : null;
        var shiftEndObj    = shiftStartObj ? new Date(shiftStartObj.getTime() + SHIFT_DURATION_MS) : null;

        // Agent is considered "off shift" if no ticket in 6+ hours
        var shiftEnded = lastD && (now - lastD) >= SHIFT_BREAK_GAP_MS;

        // ── STEP 4: Micro-Cluster Time Calculus ─────────────────────────────────
        var timing = _calcShiftTime(activeInstance, now, shiftEnded);
        var isOvertime      = timing.isOvertime;
        var activeMs        = timing.activeMs;
        var grossElapsedMs  = timing.grossMs;

        // Absolute Effort Floor — active time can't be less than ticket execution time
        var shiftRows       = activeInstance.map(function (x) { return x.r; });
        var daySolved       = shiftRows.filter(_isSolved);
        var shiftTht        = daySolved.length;
        var shiftDurationMin = daySolved.reduce(function (a, r) { return a + _getDuration(r); }, 0);

        var ticketEffortMs  = Math.max(5 * 60000, shiftDurationMin * 60000);
        activeMs            = Math.max(ticketEffortMs, activeMs);

        // ── STEP 5: Derive KPIs ──────────────────────────────────────────────────
        var activeHours         = Math.max(0.01, activeMs / 3600000);
        var shiftRemainingMs    = (!shiftEnded && shiftEndObj) ? Math.max(0, shiftEndObj - now) : 0;
        var shiftRemainingHours = shiftRemainingMs / 3600000;
        var shiftTph            = shiftTht > 0 ? Math.round((shiftTht / activeHours) * 100) / 100 : 0;
        var shiftAht            = shiftTht > 0 ? Math.round((shiftDurationMin / shiftTht) * 10) / 10 : null;

        // ── STEP 6: Last 7 Shift Instances (not calendar days) ──────────────────
        var last7Shifts  = shiftInstances.slice(-8, -1); // previous 7 shifts (exclude active)
        var shiftSolveCounts = last7Shifts.map(function (inst) {
            return inst.filter(function (x) { return _isSolved(x.r); }).length;
        });

        // Week-level stats (all historical rows, not just 7 days)
        var weekSolved   = res.rows.filter(_isSolved);
        var weekTht      = weekSolved.length;
        var weekDurMin   = weekSolved.reduce(function (a, r) { return a + _getDuration(r); }, 0);
        var weekHours    = weekDurMin / 60;
        var weekTph      = weekHours  > 0 ? Math.round((weekTht / weekHours)  * 100) / 100 : 0;
        var weekAht      = weekTht    > 0 ? Math.round((weekDurMin / weekTht) * 10)  / 10 : null;

        // ── STEP 7: Fastest ticket (all-time, any shift) ────────────────────────
        var withDur = res.rows.filter(function (r) { return _isSolved(r) && _getDuration(r) > 0; });
        var fastest = withDur.length
            ? withDur.reduce(function (best, r) { var d = _getDuration(r); return d < best.d ? { d: d, r: r } : best; }, { d: Infinity, r: null })
            : null;

        // ── STEP 8: Hourly heatmap (relative to shift start) ───────────────────
        var hourBuckets = {};
        if (shiftStartObj) {
            for (var h = 0; h < 12; h++) {
                var hStart = new Date(shiftStartObj.getTime() + h * 3600000);
                var hEnd   = new Date(hStart.getTime() + 3600000);
                hourBuckets[h] = shiftRows.filter(function (r) {
                    var d = TZ.getTicketDate(r); return d && d >= hStart && d < hEnd && _isSolved(r);
                }).length;
            }
        }

        // ── STEP 9: Efficiency Score ────────────────────────────────────────────
        var effScore = null;
        if (shiftTph > 0 || shiftAht != null) {
            var tphRatio = TPH_TARGET    > 0 ? Math.min(1.5, shiftTph / TPH_TARGET)             : 0;
            var ahtRatio = (shiftAht != null && AHT_TARGET_MIN > 0) ? Math.min(1.5, AHT_TARGET_MIN / shiftAht) : 0;
            effScore = Math.round(((tphRatio * 0.6) + (ahtRatio * 0.4)) * 100);
        }

        // ── STEP 10: Shift-based Sparkline ──────────────────────────────────────
        // Chart the last 7 completed shift instances — not calendar dates.
        // This eliminates midnight resets for ALL staggered 24/7 shift patterns.
        var sparkShifts  = last7Shifts;
        var sparkCounts  = shiftSolveCounts;
        var bestShift = null, worstShift = null;
        sparkCounts.forEach(function (cnt, i) {
            var label = sparkShifts[i] && sparkShifts[i][0]
                ? TZ.toLocalTimeString(sparkShifts[i][0].d, tz)
                : ('S' + (i + 1));
            if (!bestShift  || cnt > bestShift.cnt)  bestShift  = { date: label, cnt: cnt };
            if (!worstShift || cnt < worstShift.cnt) worstShift = { date: label, cnt: cnt };
        });

        // Build day-keyed map for sparkline renderer compatibility
        var dayMap    = {};
        var sparkDays = [];
        sparkShifts.forEach(function (inst, i) {
            var label = inst[0]
                ? TZ.toLocalTimeString(inst[0].d, tz)
                : ('Shift ' + (i + 1));
            dayMap[label] = sparkCounts[i];
            sparkDays.push(label);
        });

        // ── STEP 11: Velocity (current shift vs previous shift) ─────────────────
        var prevInstance   = shiftInstances.length >= 2 ? shiftInstances[shiftInstances.length - 2] : [];
        var prevSolved     = prevInstance.filter(function (x) { return _isSolved(x.r); }).length;
        var todayCnt       = shiftTht;
        var yesterdayCnt   = prevSolved;
        var velDir         = todayCnt > yesterdayCnt ? 'up' : (todayCnt < yesterdayCnt ? 'down' : 'flat');

        // ── Render ─────────────────────────────────────────────────────────────
        getEl('dash-tph-target') && (getEl('dash-tph-target').textContent = TPH_TARGET);
        getEl('dash-aht-target') && (getEl('dash-aht-target').textContent = AHT_TARGET_MIN + ' min');

        // Shift label
        var shl = getEl('dashboard-shift-label');
        if (shl) {
            if (shiftStartObj) {
                var fmtH = function (d) {
                    var p = TZ.getPartsInTz(d, tz); var h = p.hour % 12 || 12; return h + (p.hour >= 12 ? 'pm' : 'am');
                };
                shl.innerHTML = '(' + fmtH(shiftStartObj) + '\u2013' + fmtH(shiftEndObj) + ')' +
                    (isOvertime ? ' \u00b7 <span class="overtime-badge">\u23f1 OVERTIME</span>' : '');
            } else { shl.textContent = '\u2014'; }
        }

        // Gamification
        var speedRatio = TPH_TARGET > 0 ? (shiftTph / TPH_TARGET) : 0;
        var body = document.body, speedCard = getEl('kpi-speed-card'), streakBadge = getEl('streak-badge');
        body.classList.remove('theme-flow', 'theme-fire');
        if (speedCard) speedCard.classList.remove('fire-glow');
        if (streakBadge) streakBadge.classList.remove('active');
        if (shiftTht > 5) {
            if (speedRatio >= 1.15) {
                body.classList.add('theme-fire'); if (speedCard) speedCard.classList.add('fire-glow');
                if (streakBadge) { streakBadge.classList.add('active'); streakBadge.innerText = 'ON FIRE 🔥'; }
            } else if (speedRatio >= 0.95) {
                body.classList.add('theme-flow');
                if (streakBadge) { streakBadge.classList.add('active'); streakBadge.innerText = 'IN FLOW 🌊'; }
            }
        }

        // Feedback
        var fb = getEl('dashboard-feedback-area');
        if (fb) {
            var fbHtml = '', stph = _tphSt(shiftTph), saht = _ahtSt(shiftAht), fClass = 'under';
            if (shiftTht === 0) {
                fbHtml = '<div class="dashboard-feedback reached"><p>🚀 <strong>Ready to start?</strong> Begin your shift strong!</p></div>';
            } else {
                var msg = '';
                if (stph === 'exceeded' && (saht === 'exceeded' || saht === 'reached')) {
                    fClass = 'exceeded';
                    var msgs = [
                        '🎉 <strong>Outstanding!</strong> Exceeding both TPH (' + shiftTph.toFixed(1) + ') and AHT (' + shiftAht + 'm).',
                        '⚡ <strong>Crushing it!</strong> TPH at ' + shiftTph.toFixed(1) + ' and AHT at ' + shiftAht + 'm.',
                        '🌟 <strong>Stellar!</strong> Both metrics above target.'
                    ];
                    msg = msgs[Math.floor(Math.random() * msgs.length)];
                } else if (stph === 'reached') {
                    fClass = 'reached'; msg = '✓ <strong>On target!</strong> TPH at ' + shiftTph.toFixed(1) + '.';
                } else {
                    var gap = TPH_TARGET - shiftTph;
                    var needed = shiftRemainingHours > 0 ? Math.ceil(gap * shiftRemainingHours) : 0;
                    if (isOvertime)   msg = '⏱ <strong>Overtime!</strong> ' + shiftTht + ' tickets handled.';
                    else if (needed <= 3) msg = '💪 <strong>Almost there!</strong> Just <strong>' + needed + ' more ticket' + (needed > 1 ? 's' : '') + '</strong> to target.';
                    else if (needed <= 10) msg = '🎯 <strong>You can do this!</strong> Need <strong>' + needed + ' more tickets</strong>.';
                    else msg = '📈 <strong>Keep pushing!</strong> Current TPH: ' + shiftTph.toFixed(1) + '.';
                }
                fbHtml = '<div class="dashboard-feedback ' + fClass + '"><p>' + msg + '</p></div>';
            }
            fb.innerHTML = fbHtml;
        }

        // Prediction
        var pred = getEl('prediction-container');
        if (pred) {
            var needed9h = Math.ceil(TPH_TARGET * 9) - shiftTht;
            var predHtml = '';
            if (needed9h <= 0) {
                predHtml = '<div class="prediction-card" style="border-color:var(--success)"><span>🎉 <strong>Target Hit!</strong> Daily goal reached with ' + shiftTht + ' tickets.</span></div>';
            } else if (shiftTph > 0) {
                var hoursToGo = needed9h / shiftTph;
                var finishTime = new Date(now.getTime() + hoursToGo * 3600000);
                var fp2 = TZ.getPartsInTz(finishTime, tz);
                var fh = fp2.hour % 12 || 12, fm = fp2.minute, ampm = fp2.hour >= 12 ? 'pm' : 'am';
                var ts = fh + ':' + (fm < 10 ? '0' + fm : fm) + ' ' + ampm;
                predHtml = '<div class="prediction-card"><span style="font-size:16px">🔮</span><div><div style="font-weight:700;color:var(--text)">Predicted Finish: ' + ts + '</div><div style="font-size:10px;opacity:.7">at current pace (' + shiftTph.toFixed(1) + ' TPH) \u00b7 ' + needed9h + ' tickets left</div></div></div>';
            } else {
                predHtml = '<div class="prediction-card"><span>🔮 <strong>Prediction:</strong> Start handling tickets to see when you\'ll finish!</span></div>';
            }
            pred.innerHTML = predHtml;
        }

        // KPI values
        _setKpi('shift-tht', shiftTht, null);
        _setKpi('shift-tph', shiftTph, _tphSt(shiftTph));
        _setKpi('shift-aht', shiftAht != null ? shiftAht + ' m' : '\u2013', _ahtSt(shiftAht));
        _setProgress('shift-tph-bar', TPH_TARGET, shiftTph, true);
        _setProgress('shift-aht-bar', AHT_TARGET_MIN, shiftAht, false);
        _setKpi('week-tht', weekTht, null);
        _setKpi('week-tph', weekTph, _tphSt(weekTph));
        _setKpi('week-aht', weekAht != null ? weekAht + ' m' : '\u2013', _ahtSt(weekAht));
        _setProgress('week-tph-bar', TPH_TARGET, weekTph, true);
        _setProgress('week-aht-bar', AHT_TARGET_MIN, weekAht, false);

        // Fastest ticket
        var fastEl = getEl('dashboard-fastest-area');
        if (fastEl) {
            if (fastest && fastest.r) {
                var link = String(fastest.r.BlissLink || '');
                var ld = link.length > 38 ? link.substring(0, 38) + '\u2026' : link;
                fastEl.innerHTML = '<div class="dashboard-fastest"><label>Fastest Handled Ticket</label><div class="val">' + fastest.d + ' min</div><div class="hint">' + (ld || '\u2014') + '</div></div>';
            } else {
                fastEl.innerHTML = '<div class="dashboard-fastest"><label>Fastest Handled Ticket</label><div class="val">\u2014</div><div class="hint">No solved tickets with duration yet</div></div>';
            }
        }

        _renderHeatmap(hourBuckets, shiftStartObj, tz, now);
        _renderDial(effScore);
        _renderSparkline(sparkDays, dayMap);
        _renderBestWorst(bestShift, worstShift);
        _renderVelocity(velDir, todayCnt, yesterdayCnt);
        _renderPaceBar(shiftTht, shiftTph, shiftRemainingHours, isOvertime);
    }

    function _setKpi(id, value, status) {
        var el = getEl(id); if (!el) return;
        el.textContent = typeof value === 'number' ? (value % 1 === 0 ? value : value.toFixed(2)) : value;
        el.className = 'value' + (status ? ' ' + status + '-target' : '');
    }

    function _setProgress(barId, target, value, isTph) {
        var bar = getEl(barId); if (!bar) return;
        if (value == null || (isTph && value === 0)) { bar.style.width = '0%'; bar.className = isTph ? 'fill-tph' : 'fill-aht'; return; }
        var pct = isTph ? Math.min(100, (value / target) * 100) : (value <= 0 ? 100 : Math.min(100, (target / value) * 100));
        bar.style.width = pct + '%';
        bar.className = isTph ? ('fill-tph' + (value >= target ? ' on-target' : '')) : ('fill-aht' + (value <= target ? ' on-target' : ' over'));
    }

    function _renderHeatmap(buckets, shiftStart, tz, now) {
        var el = getEl('dashboard-heatmap'); if (!el) return;
        // Guard: if no tickets have been logged yet, shiftStart is null — render empty state
        if (!shiftStart) { el.innerHTML = '<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:12px">Log your first ticket to see the heatmap.</div>'; return; }
        var durationMs = now - shiftStart;
        var displayHours = Math.min(12, Math.max(9, Math.ceil(durationMs / 3600000) + 1));
        var maxVal = Math.max.apply(null, Object.values(buckets).concat([1]));
        var nowP = TZ.getPartsInTz(now, tz); var nowH = nowP ? nowP.hour : -1;
        var html = '<div class="heatmap-grid">';
        for (var h = 0; h < displayHours; h++) {
            var hStart = new Date(shiftStart.getTime() + h * 3600000);
            var hp = TZ.getPartsInTz(hStart, tz);
            var label = hp ? ((hp.hour % 12 || 12) + (hp.hour >= 12 ? 'p' : 'a')) : 'H' + h;
            var cnt = buckets[h] || 0;
            var cls = 'heatmap-cell' + (cnt > 0 ? (cnt / maxVal >= 0.7 ? ' h-high' : (cnt / maxVal >= 0.35 ? ' h-mid' : ' h-low')) : '');
            if (hp && hp.hour === nowH) cls += ' h-current';
            html += '<div class="' + cls + '"><span class="hour-label">' + label + '</span>' + (cnt > 0 ? cnt : '\u00b7') + '</div>';
        }
        el.innerHTML = html + '</div>';
    }

    function _renderDial(score) {
        var el = getEl('dashboard-dial'); if (!el) return;
        if (score === null) { el.innerHTML = '<div class="efficiency-dial"><div class="dial-info"><div class="dial-label">Efficiency Score</div><div class="dial-desc" style="opacity:.5">Not enough data</div></div></div>'; return; }
        var clamp = Math.min(100, Math.max(0, score));
        var deg = Math.round((clamp / 100) * 360);
        var col = clamp >= 85 ? '#10B981' : (clamp >= 60 ? 'var(--accent)' : 'var(--warning)');
        el.innerHTML = '<div class="efficiency-dial"><div class="dial-ring" style="background:conic-gradient(' + col + ' ' + deg + 'deg,var(--glass-stroke) ' + deg + 'deg)"><div class="dial-inner">' + clamp + '</div></div><div class="dial-info"><div class="dial-label">Efficiency Score</div><div class="dial-desc">' + (clamp >= 85 ? '🚀 Excellent!' : (clamp >= 60 ? '✅ Good — keep it up!' : '📈 Room to improve')) + '</div></div></div>';
    }

    function _renderSparkline(days, dayMap) {
        var el = getEl('dashboard-sparkline'); if (!el) return;
        if (!days.length) { el.innerHTML = '<div style="color:var(--text-muted);font-size:11px">No 7-day history</div>'; return; }
        var vals = days.map(function (d) { return dayMap[d] || 0; });
        var max = Math.max.apply(null, vals.concat([1]));
        var todayKey = days[days.length - 1];
        var html = '<div class="sparkline-wrap">';
        vals.forEach(function (v, i) {
            var pct = Math.max(8, Math.round((v / max) * 100));
            html += '<div class="spark-bar' + (days[i] === todayKey ? ' today' : '') + '" style="height:' + pct + '%" title="' + days[i] + ': ' + v + ' tickets"></div>';
        });
        html += '</div><div class="sparkline-labels">';
        days.forEach(function (d) { html += '<div class="spark-label">' + d + '</div>'; });
        el.innerHTML = html + '</div>';
    }

    function _renderBestWorst(best, worst) {
        var el = getEl('dashboard-bestworst'); if (!el) return;
        if (!best) { el.innerHTML = ''; return; }
        el.innerHTML = '<div class="best-worst-grid">' +
            '<div class="bw-card bw-best"><div class="bw-label">🏆 Best Shift</div><div class="bw-val">' + best.cnt + ' tickets</div><div class="bw-sub">started ' + best.date + '</div></div>' +
            '<div class="bw-card bw-worst"><div class="bw-label">📉 Lightest Shift</div><div class="bw-val">' + worst.cnt + ' tickets</div><div class="bw-sub">started ' + worst.date + '</div></div></div>';
    }

    function _renderVelocity(dir, today, yesterday) {
        var el = getEl('dashboard-velocity'); if (!el) return;
        var arrow = dir === 'up' ? '↑' : (dir === 'down' ? '↓' : '→');
        var diff = Math.abs(today - yesterday);
        var label = dir === 'flat' ? 'Same pace as prev shift' : (diff + ' ticket' + (diff > 1 ? 's' : '') + ' ' + (dir === 'up' ? 'more' : 'less') + ' than prev shift');
        el.innerHTML = '<span class="velocity-badge ' + dir + '">' + arrow + ' ' + label + '</span>';
    }

    function _renderPaceBar(solved, tph, hoursLeft, isOvertime) {
        var el = getEl('dashboard-pace-bar'); if (!el) return;
        if (isOvertime) { el.innerHTML = '<div class="pace-bar-wrap"><div class="pace-bar-labels"><span>Overtime mode</span><strong>' + solved + ' tickets done</strong></div></div>'; return; }
        var target9h = Math.ceil(TPH_TARGET * 9);
        var pct = Math.min(100, Math.round((solved / target9h) * 100));
        var needed = Math.max(0, target9h - solved);
        el.innerHTML = '<div class="pace-bar-wrap"><div class="pace-bar-labels"><span>Progress to daily goal</span><strong>' + solved + ' / ' + target9h + ' tickets</strong></div><div class="pace-track"><div class="pace-fill" style="width:' + pct + '%"></div></div><div class="pace-bar-labels" style="margin-top:6px"><span>' + pct + '% complete</span><strong>' + (needed > 0 ? (needed + ' to go \u00b7 ' + hoursLeft.toFixed(1) + 'h left') : '🎉 Goal reached!') + '</strong></div></div>';
    }

    // ══════════════════════════════════════════════════════════════
    // Data fetch
    // ══════════════════════════════════════════════════════════════

    var _isRefreshing = false;
    async function refreshStats() {
        if (_isRefreshing) return;
        _isRefreshing = true;
        try {
            var res = await RPC.call('getAnalyticsDashboard');
            if (res && res.success !== false) {
                Cache.setJson('analyticsCache', res);
                computeDashboard(res);
            }
        } catch (err) {
            console.warn('[AnalyticsController] Dashboard fetch failed:', err);
        } finally { _isRefreshing = false; }
    }

    function loadAnalyticsHistory() {
        var cached = Cache.getJson('analyticsCache', null);
        if (cached) { try { computeDashboard(cached); } catch (_) {} }
        refreshStats();
    }

    // ══════════════════════════════════════════════════════════════
    // Shift Summary — all date comparison via TimezoneService
    // ══════════════════════════════════════════════════════════════


    // ══════════════════════════════════════════════════════════════
    // Draggable float panels
    // ══════════════════════════════════════════════════════════════

    var _fpZIndex = 900, _dragState = null;

    document.addEventListener('mousedown', function (e) {
        var header = e.target.closest('.fp-header, .chat-header');
        if (!header || e.target.closest('button, input, textarea, select')) return;
        var panel = header.closest('.float-panel');
        if (!panel || !panel.classList.contains('open')) return;
        e.preventDefault();
        var rect = panel.getBoundingClientRect();
        panel.style.width = rect.width + 'px'; panel.style.height = rect.height + 'px';
        panel.style.right = 'auto'; panel.style.bottom = 'auto';
        panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
        panel.style.zIndex = String(++_fpZIndex);
        _dragState = { panel: panel, x0: e.clientX, y0: e.clientY, l0: rect.left, t0: rect.top };
        document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function (e) {
        if (!_dragState) return;
        var d = _dragState;
        var nl = Math.max(0, Math.min(d.l0 + (e.clientX - d.x0), window.innerWidth  - d.panel.offsetWidth));
        var nt = Math.max(0, Math.min(d.t0 + (e.clientY - d.y0), window.innerHeight - 54));
        d.panel.style.left = nl + 'px'; d.panel.style.top = nt + 'px';
    });

    document.addEventListener('mouseup', function () { document.body.style.userSelect = ''; _dragState = null; });

    // ══════════════════════════════════════════════════════════════
    // Radial dock and panel management
    // ══════════════════════════════════════════════════════════════

    var _radialOpen = false;
    var _analyticsTimer = null;

    function toggleRadialDock() {
        _radialOpen = !_radialOpen;
        var dock = getEl('radial-dock'); if (dock) dock.classList.toggle('open', _radialOpen);
    }

    document.addEventListener('click', function (e) {
        var dock = getEl('radial-dock');
        if (_radialOpen && dock && !dock.contains(e.target)) { _radialOpen = false; dock.classList.remove('open'); }
    });

    function openPanel(name) {
        var panel = getEl('panel-' + name);
        var riBtn = document.querySelector('.ri[data-panel="' + name + '"]');
        if (!panel) return;
        if (panel.classList.contains('open')) { closePanel(name); return; }
        panel.classList.add('open');
        panel.style.zIndex = String(++_fpZIndex);
        if (riBtn) riBtn.classList.add('active');
        if (name === 'analytics') {
            loadAnalyticsHistory();
            if (!_analyticsTimer) _analyticsTimer = setInterval(refreshStats, 30000);
        }
    }

    function closePanel(name) {
        var panel = getEl('panel-' + name);
        var riBtn = document.querySelector('.ri[data-panel="' + name + '"]');
        if (panel) panel.classList.remove('open');
        if (riBtn) riBtn.classList.remove('active');
        if (name === 'analytics' && _analyticsTimer) { clearInterval(_analyticsTimer); _analyticsTimer = null; }
    }

    // ── Publish ────────────────────────────────────────────────────────────────
    global.App = global.App || {};
    global.App.AnalyticsController = {
        computeDashboard, refreshStats, loadAnalyticsHistory,
        openPanel, closePanel, toggleRadialDock
    };

    // Legacy shims
    global.computeDashboard     = computeDashboard;
    global.refreshStats         = refreshStats;
    global.loadAnalyticsHistory = loadAnalyticsHistory;
    global.openPanel            = openPanel;
    global.closePanel           = closePanel;
    global.toggleRadialDock     = toggleRadialDock;
    global.toggleDock           = toggleRadialDock;

})(window);
</script>
