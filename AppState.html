<script>
    /**
     * AppState — Global state management, storage keys, offline resilience.
     */
    var STORAGE_KEYS = {
        theme:      'zen_theme',
        cat:        'zen_cat',
        scen:       'zen_scen',
        bliss:      'liteos_bliss',
        scratch:    'liteos_scratch',
        scenCache:  'sios_scenarios_cache',
        tickQueue:  'sios_ticket_queue',
        tickHistory: 'liteos_ticket_history'
    };
    var COPY_BTN_RESET_MS = 1500;

    function getEl(id) { return document.getElementById(id); }
    function escapeHtml(s) {
        if (s == null || s === '') return '';
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    var storage = {}, filteredList = [], currentCat = '', currentScenIdx = 0;
    var highlightedIndex = 0;
    var _isOffline = false;

    /** gsr — Promise wrapper for google.script.run */
    function gsr(method) {
        var args = Array.prototype.slice.call(arguments, 1);
        return new Promise(function (resolve, reject) {
            var runner = google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(reject);
            runner[method].apply(runner, args);
        });
    }

    /** defer — Run non-critical work after page is interactive */
    function defer(fn) {
        if (typeof requestIdleCallback === 'function') requestIdleCallback(fn, { timeout: 2000 });
        else setTimeout(fn, 0);
    }

    // ── Offline resilience ────────────────────────────────────────────────────

    function _cacheScenarios(data) {
        try { localStorage.setItem(STORAGE_KEYS.scenCache, JSON.stringify(data)); } catch (_) {}
    }
    function _getCachedScenarios() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.scenCache) || 'null'); } catch (_) { return null; }
    }

    function _queueTicket(payload) {
        try {
            var q = JSON.parse(localStorage.getItem(STORAGE_KEYS.tickQueue) || '[]');
            payload._queuedAt = new Date().toISOString();
            q.push(payload);
            localStorage.setItem(STORAGE_KEYS.tickQueue, JSON.stringify(q));
            _updateOfflineUI();
        } catch (_) {}
    }
    function _getQueueCount() {
        try { return (JSON.parse(localStorage.getItem(STORAGE_KEYS.tickQueue) || '[]')).length; } catch (_) { return 0; }
    }

    function _updateOfflineUI() {
        var pill = document.getElementById('offline-pill');
        if (!pill) return;
        var q = _getQueueCount();
        if (_isOffline) {
            pill.style.display = 'flex';
            pill.className = 'offline-pill offline';
            pill.innerHTML = '<span class="op-dot"></span>Offline' + (q ? ' &bull; ' + q + ' queued' : '');
        } else if (q > 0) {
            pill.style.display = 'flex';
            pill.className = 'offline-pill syncing';
            pill.innerHTML = '<span class="op-dot"></span>' + q + ' ticket' + (q > 1 ? 's' : '') + ' syncing\u2026';
        } else {
            pill.style.display = 'none';
        }
    }

    function _setOffline(offline) {
        if (_isOffline === offline) return;
        _isOffline = offline;
        _updateOfflineUI();
    }

    async function _flushTicketQueue() {
        var queue = JSON.parse(localStorage.getItem(STORAGE_KEYS.tickQueue) || '[]');
        if (!queue.length) return;
        var remaining = [];
        for (var i = 0; i < queue.length; i++) {
            try {
                var entry = Object.assign({}, queue[i]);
                delete entry._queuedAt;
                await gsr('logTicket', entry);
            } catch (_) { remaining.push(queue[i]); }
        }
        var synced = queue.length - remaining.length;
        localStorage.setItem(STORAGE_KEYS.tickQueue, JSON.stringify(remaining));
        if (synced > 0) showToast(synced + ' queued ticket' + (synced > 1 ? 's' : '') + ' synced \u2713', 'success');
        _updateOfflineUI();
    }

    /** Ping every 3 min — reconnect + flush queue when Sheets comes back */
    function _startReconnectCheck() {
        async function _check() {
            try {
                await gsr('ping');
                if (_isOffline) { _setOffline(false); showToast('Connection restored!', 'success'); }
                await _flushTicketQueue();
            } catch (_) { _setOffline(true); }
        }
        setTimeout(_check, 15000);          // first check after 15s
        setInterval(_check, 3 * 60 * 1000); // then every 3 min
    }

</script>
