<script>
    /**
     * CardRenderer — Card content rendering, copy-to-clipboard, and edit toggle.
     */
    function render() {
        var d = filteredList[currentScenIdx]; if (!d) return;
        var blissEl = document.getElementById('bliss-link');
        var bliss = blissEl ? blissEl.value : '';

        var appendBlissPlain = function (txt) {
            var base = (txt || '').trim();
            if (!base || base === 'N/A') return base || 'N/A';
            if (!bliss) return base;
            if (base.includes(bliss)) return base;
            var sep = base.includes('\n') ? '' : '\n';
            return base + sep + bliss;
        };

        var srEl = document.getElementById('sr'), inEl = document.getElementById('in'), enEl = document.getElementById('en'), rnEl = document.getElementById('rn');
        var rnPlain = appendBlissPlain(d.resNote);
        var enPlain = appendBlissPlain(d.eaterNote);

        function _setPlain(el, text) {
            var safe = (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
            el.innerHTML = safe;
            el.dataset.plain = text || '';
        }

        var srContent = d.replyHtml || (d.reply || '').replace(/\n/g, '<br>');

        // Interactive Payment Timeframe Injection (Entire Sentence, Protected)
        srContent = srContent.replace(/You can expect to see this adjustment reflected on your payment method within the next ([^.!]+)([.!]?)/gi, function (m, tf, punc) {
            var cleanTf = tf.trim();
            if (cleanTf.indexOf('<span') !== -1) return m;

            var opt1 = 'You can expect to see this adjustment reflected on your payment method within the next ' + cleanTf + (punc || '.');
            var opt2 = 'You can expect to see this adjustment reflected on your payment method within 30 days' + (punc || '.');
            var opt3 = 'The refund will reflect in your account as a credit, You can use it in your next orders' + (punc || '.');

            var opts = [opt1, opt2, opt3];

            // ph-locked protects this block from being destroyed by the Paraphraser
            return '<span class="ph-swap ph-locked" data-options="' + encodeURIComponent(JSON.stringify(opts)) + '" style="color:var(--accent2); font-weight:500;">' + opt1 + '</span>';
        });

        srEl.innerHTML = srContent;
        srEl.dataset.originalHtml = srContent; // baseline for Paraphraser v4
        srEl.dataset.plain = d.reply || '';

        var internalNoteStr = d.internalNote || '';
        var internalNoteHtml = d.internalNoteHtml || d.internalNote || '';

        // Fraud reason auto-injection (Interactive)
        if (d.scenario && d.scenario.toLowerCase().includes('fraud')) {
            var fraudReasons = [
                "The eater has made more than 2 reports of any nature in the previous 24 hour period",
                "The eater has raised any other report on the same order",
                "The eater has reported the same food safety issue type in the previous 5 orders.",
                "The eater has received 3 or more safety refunds in the previous 5 orders",
                "The trip was more than 30 days ago",
                "The eater is a first time eater, but they have been tagged as ‘blocked appeasements’, and have at least one related account",
                "The eater is blocked from adjustments and appeasements and has a previous safety note or report"
            ];

            // Build the interactive span using the same data-options structure as the Paraphraser
            var fraudSpan = '<span class="ph-swap" data-options="' + encodeURIComponent(JSON.stringify(fraudReasons)) + '" style="color:var(--accent2); font-weight:bold;">Select Fraud Reason</span>';

            // Inject into empty parentheses () or ( )
            if (/\(\s*\)/.test(internalNoteHtml)) {
                internalNoteHtml = internalNoteHtml.replace(/\(\s*\)/, '(' + fraudSpan + ')');
            }
        }

        // We use innerHTML for Internal Note now so the interactive span renders properly
        var safeIn = internalNoteHtml.replace(/\n/g, '<br>');
        inEl.innerHTML = safeIn;
        inEl.dataset.plain = internalNoteStr;
        _setPlain(rnEl, rnPlain);
        _setPlain(enEl, enPlain);
        localStorage.setItem(STORAGE_KEYS.scen, d.scenario);
    }

    async function copy(id) {
        var area = document.getElementById(id);
        var btn = document.getElementById('btn-' + id);
        var card = document.getElementById('card-' + id);
        var originalText = (id === 'sr') ? "Copy SR" : "Copy";
        var plain = (area.innerText || (area.dataset && area.dataset.plain) || '').trim();
        var hasContent = plain && plain !== "N/A";

        if (!hasContent) {
            animateCursor('error'); card.classList.add('nudge');
            btn.innerText = "EMPTY!"; btn.classList.add('error');
            showToast("EMPTYYYY 😡", "error");
            setTimeout(function () { card.classList.remove('nudge'); btn.innerText = originalText; btn.classList.remove('error'); }, 1200);
            return;
        }

        var useRichCopy = (id === 'sr');
        var rawHtml = area.innerHTML || '';
        var htmlForClipboard = (id === 'sr' && rawHtml) ? '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + rawHtml + '</body></html>' : null;

        var copied = false;
        if (!useRichCopy) {
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(plain);
                    copied = true;
                }
            } catch (_) { }
        } else if (htmlForClipboard && navigator.clipboard && navigator.clipboard.write) {
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({
                        'text/html': new Blob([htmlForClipboard], { type: 'text/html' }),
                        'text/plain': new Blob([plain], { type: 'text/plain' })
                    })
                ]);
                copied = true;
            } catch (_) { }
        }
        if (!copied) {
            var tmp = document.createElement('div');
            tmp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;';
            tmp.innerHTML = (id === 'sr' && rawHtml) ? rawHtml : plain.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            tmp.contentEditable = 'true';
            document.body.appendChild(tmp);
            var sel = window.getSelection();
            var range = document.createRange();
            range.selectNodeContents(tmp);
            sel.removeAllRanges();
            sel.addRange(range);
            try { document.execCommand('copy'); copied = true; } catch (_) { }
            tmp.remove();
            if (!copied) {
                try { await navigator.clipboard.writeText(plain); } catch (_) { }
            }
        }
        animateCursor('success');
        btn.innerText = "COPIED!"; btn.classList.add('success'); card.classList.add('pulse');
        showToast(id.toUpperCase() + " SUCCESSFUL 👍", "success");
        setTimeout(function () { btn.innerText = originalText; btn.classList.remove('success'); card.classList.remove('pulse'); }, 1500);
    }


    /** ── Helper: reload storage from server then re-render ── */
    function _refreshStorage(callback) {
        google.script.run
            .withSuccessHandler(function (data) {
                if (data && Object.keys(data).length > 0) {
                    storage = data;
                    _cacheScenarios(data);   // keep cache fresh
                    _setOffline(false);
                    filterScenarios(false);
                }
                if (typeof callback === 'function') callback();
            })
            .withFailureHandler(function (err) {
                // 502 / network error — try falling back to cached scenarios
                var cached = _getCachedScenarios();
                if (cached && Object.keys(cached).length > 0) {
                    storage = cached;
                    filterScenarios(false);
                    _setOffline(true);
                    showToast('Sheets unavailable — showing cached data', 'error');
                } else {
                    _setOffline(true);
                    showToast('Sheets unavailable and no cache yet — try again shortly', 'error');
                }
                if (typeof callback === 'function') callback();
            })
            .getData();
    }

    /** ── CRUD action button container ── */
    function _getCrudBar(cardId) {
        return document.getElementById('crud-bar-' + cardId);
    }

    function _showCrudBar(cardId) {
        var existing = _getCrudBar(cardId);
        if (existing) return; // already shown

        var d = filteredList[currentScenIdx];
        if (!d) return;

        // Find the card-actions div inside the card header
        var card = document.getElementById('card-' + cardId);
        if (!card) return;
        var actions = card.querySelector('.card-actions');
        if (!actions) return;

        // Thin separator
        var sep = document.createElement('span');
        sep.style.cssText = 'display:inline-block;width:1px;height:14px;background:var(--border,rgba(255,255,255,0.15));margin:0 2px;vertical-align:middle;';

        // 💾 Update — styled exactly like existing toolbar buttons
        var btnUpdate = document.createElement('button');
        btnUpdate.className = 'btn-edit-toggle';
        btnUpdate.title = 'Save edits to the existing row in the sheet';
        btnUpdate.innerHTML = '💾';
        btnUpdate.style.cssText = 'color:var(--accent)!important;';
        btnUpdate.onclick = function () { _crudUpdate(cardId); };

        // ➕ Save as New
        var btnAdd = document.createElement('button');
        btnAdd.className = 'btn-edit-toggle';
        btnAdd.title = 'Save as a new scenario row in the sheet';
        btnAdd.innerHTML = '➕';
        btnAdd.onclick = function () { _crudAdd(cardId); };

        // 🗑️ Delete
        var btnDel = document.createElement('button');
        btnDel.className = 'btn-edit-toggle';
        btnDel.title = 'Delete this scenario from the sheet';
        btnDel.innerHTML = '🗑️';
        btnDel.style.cssText = 'color:#e74c3c!important;';
        btnDel.onclick = function () { _crudDelete(cardId); };

        // Wrap all three in a fragment with an id so we can remove them easily
        var bar = document.createElement('span');
        bar.id = 'crud-bar-' + cardId;
        bar.style.cssText = 'display:inline-flex;align-items:center;gap:2px;';
        bar.appendChild(sep);
        bar.appendChild(btnUpdate);
        bar.appendChild(btnAdd);
        bar.appendChild(btnDel);

        // Insert before the Copy button (last child) so CRUD sits right of ✎
        var copyBtn = actions.querySelector('.btn-copy');
        if (copyBtn) {
            actions.insertBefore(bar, copyBtn);
        } else {
            actions.appendChild(bar);
        }
    }

    function _hideCrudBar(cardId) {
        var bar = _getCrudBar(cardId);
        if (bar) bar.remove();
    }

    /** ── Read current text from the editable card area ── */
    function _getEditedText(cardId) {
        var area = document.getElementById(cardId);
        return area ? (area.innerText || area.dataset.plain || '').trim() : '';
    }

    /** ── Update existing row ── */
    function _crudUpdate(cardId) {
        var d = filteredList[currentScenIdx];
        if (!d) return;

        var payload = {
            sheetName: d.fromCat,
            rowIndex: d.rowIndex,
            scenario: d.scenario,
            reply: cardId === 'sr' ? _getEditedText('sr') : d.reply,
            internalNote: cardId === 'in' ? _getEditedText('in') : d.internalNote,
            eaterNote: cardId === 'en' ? _getEditedText('en') : d.eaterNote,
            resNote: cardId === 'rn' ? _getEditedText('rn') : d.resNote
        };

        showToast('Saving...', 'info');
        google.script.run
            .withSuccessHandler(function () {
                showToast('✅ Updated in sheet!', 'success');
                _hideCrudBar(cardId);
                toggleEdit(cardId, document.querySelector('.btn-edit-toggle.active'));
                _refreshStorage(null);
            })
            .withFailureHandler(function (err) {
                showToast('❌ Update failed: ' + (err && err.message ? err.message : err), 'error');
            })
            .updateScenario(payload);
    }

    /** ── Save as new row ── */
    function _crudAdd(cardId) {
        var d = filteredList[currentScenIdx];
        if (!d) return;

        var newName = prompt('Name for the new scenario:', d.scenario + ' (Copy)');
        if (!newName || !newName.trim()) { showToast('Cancelled — no name entered', 'info'); return; }

        var payload = {
            sheetName: d.fromCat,
            scenario: newName.trim(),
            reply: cardId === 'sr' ? _getEditedText('sr') : d.reply,
            internalNote: cardId === 'in' ? _getEditedText('in') : d.internalNote,
            eaterNote: cardId === 'en' ? _getEditedText('en') : d.eaterNote,
            resNote: cardId === 'rn' ? _getEditedText('rn') : d.resNote
        };

        showToast('Saving new row...', 'info');
        google.script.run
            .withSuccessHandler(function () {
                showToast('✅ New scenario saved!', 'success');
                _hideCrudBar(cardId);
                toggleEdit(cardId, document.querySelector('.btn-edit-toggle.active'));
                _refreshStorage(null);
            })
            .withFailureHandler(function (err) {
                showToast('❌ Save failed: ' + (err && err.message ? err.message : err), 'error');
            })
            .addScenario(payload);
    }

    /** ── Delete row ── */
    function _crudDelete(cardId) {
        var d = filteredList[currentScenIdx];
        if (!d) return;

        if (!confirm('Delete "' + d.scenario + '" from the sheet?\nThis cannot be undone.')) {
            showToast('Cancelled', 'info'); return;
        }

        var payload = { sheetName: d.fromCat, rowIndex: d.rowIndex };

        showToast('Deleting...', 'info');
        google.script.run
            .withSuccessHandler(function () {
                showToast('🗑️ Deleted from sheet', 'success');
                _hideCrudBar(cardId);
                // Remove from local storage and re-render immediately
                var cat = d.fromCat;
                if (storage[cat]) {
                    storage[cat] = storage[cat].filter(function (item) {
                        return item.rowIndex !== d.rowIndex;
                    });
                }
                filterScenarios(false);
                if (filteredList.length > 0) selectScenario(0); else render();
            })
            .withFailureHandler(function (err) {
                showToast('❌ Delete failed: ' + (err && err.message ? err.message : err), 'error');
            })
            .deleteScenario(payload);
    }

    function toggleEdit(id, btn) {
        var area = document.getElementById(id);
        var isEditing = area.classList.toggle('editable');
        area.contentEditable = isEditing;
        if (isEditing) {
            area.focus();
            if (btn) btn.classList.add('active');
            _showCrudBar(id); // ← Show CRUD buttons when edit opens
        } else {
            area.contentEditable = 'false';
            if (btn) btn.classList.remove('active');
            _hideCrudBar(id); // ← Hide CRUD buttons when edit closes
        }
    }
</script>
