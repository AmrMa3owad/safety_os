<script>
    /**
     * Phoenix Chat Assistant v3.0
     * Fully local AI — rich markdown rendering, multi-turn memory, typing effects
     */

    // ── Markdown renderer (no external lib needed) ────────────────────────────
    function _renderMarkdown(text) {
        if (!text) return '';
        let html = text
            // Code blocks (inline)
            .replace(/`([^`]+)`/g, '<code style="background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>')
            // Bold
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            // Italic — negative lookbehind ensures we don't match ** from bold
            .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>')
            // Headers (##, ###)
            .replace(/^###\s+(.+)/gm, '<div style="font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent2);margin:10px 0 4px">$1</div>')
            .replace(/^##\s+(.+)/gm, '<div style="font-size:14px;font-weight:800;margin:10px 0 4px;color:var(--accent)">$1</div>')
            // Horizontal rule
            .replace(/^---+$/gm, '<hr style="border:none;border-top:1px solid var(--glass-stroke);margin:10px 0;">')
            // Blockquote (> text)
            .replace(/^>\s+(.+)/gm, '<div style="border-left:3px solid var(--accent);padding:4px 10px;margin:4px 0;opacity:.85;background:rgba(0,0,0,.15);border-radius:0 6px 6px 0;font-style:italic;">$1</div>')
            // Tables → HTML tables
            .replace(/\| (.+) \|\n\|[-| ]+\|\n((?:\| .+ \|\n?)+)/g, function (_, header, rows) {
                const ths = header.split('|').map(h => h.trim()).filter(Boolean)
                    .map(h => `<th style="padding:4px 8px;border-bottom:1px solid var(--glass-stroke);font-size:11px;font-weight:700;color:var(--text-muted);">${h}</th>`).join('');
                const trs = rows.trim().split('\n').map(row => {
                    const tds = row.split('|').map(c => c.trim()).filter(Boolean)
                        .map(c => `<td style="padding:4px 8px;font-size:12px;">${c}</td>`).join('');
                    return `<tr>${tds}</tr>`;
                }).join('');
                return `<table style="border-collapse:collapse;width:100%;margin:8px 0;">${ths ? '<thead><tr>' + ths + '</tr></thead>' : ''}<tbody>${trs}</tbody></table>`;
            })
            // Bullet points (- item or • item)
            .replace(/^[•\-]\s+(.+)/gm, '<div style="display:flex;gap:6px;margin:3px 0;"><span style="color:var(--accent);flex-shrink:0;">•</span><span>$1</span></div>')
            // Numbered list
            .replace(/^(\d+)\.\s+(.+)/gm, '<div style="display:flex;gap:6px;margin:3px 0;"><span style="color:var(--accent);flex-shrink:0;font-weight:700;">$1.</span><span>$2</span></div>')
            // Checkmarks
            .replace(/^✅\s+(.+)/gm, '<div style="display:flex;gap:6px;margin:2px 0;"><span style="flex-shrink:0;">✅</span><span>$1</span></div>')
            .replace(/^❌\s+(.+)/gm, '<div style="display:flex;gap:6px;margin:2px 0;"><span style="flex-shrink:0;">❌</span><span>$1</span></div>')
            // Newlines → <br>
            .replace(/\n/g, '<br>');

        return html;
    }

    // ── Message appending with typewriter effect ──────────────────────────────
    function appendMessage(sender, text, instant) {
        var msgContainer = document.getElementById('chat-messages');
        var div = document.createElement('div');
        div.className = 'chat-message ' + sender;

        var bubble = document.createElement('div');
        bubble.className = 'chat-bubble';

        if (sender === 'user') {
            // User messages: plain text with basic formatting
            bubble.innerHTML = _renderMarkdown(text);
        } else {
            // Bot messages: full markdown rendered
            if (instant) {
                bubble.innerHTML = _renderMarkdown(text);
            } else {
                // Staged reveal: show loading dots, then replace with content
                bubble.innerHTML = '<span style="opacity:.5;font-style:italic;">...</span>';
            }
        }

        div.appendChild(bubble);
        msgContainer.appendChild(div);
        msgContainer.scrollTop = msgContainer.scrollHeight;

        if (sender === 'bot' && !instant) {
            // Short delay then render actual content
            return { bubble: bubble, text: text };
        }
        return null;
    }

    // ── Conversation history (multi-turn memory + localStorage persistence) ────
    var _HISTORY_KEY = 'phoenix_chat_history';
    var _chatHistory = [];

    function _saveChatHistory() {
        try { localStorage.setItem(_HISTORY_KEY, JSON.stringify(_chatHistory.slice(-40))); } catch (_) {}
    }

    // Restore history from previous session and rebuild DOM
    (function _restoreHistory() {
        try {
            var saved = JSON.parse(localStorage.getItem(_HISTORY_KEY) || '[]');
            var msgContainer = document.getElementById('chat-messages');
            if (!msgContainer) return;
            if (!Array.isArray(saved) || saved.length === 0) {
                // First visit — show welcome message
                appendMessage('bot', '🔥 **Phoenix AI — Powered by Groq × Llama 3.3 70B**\n\nFirewall up. Systems online. 🛡️\n\nAsk me about any food safety scenario, fraud check, SR guide, or policy rule.\nTry: *"What if eater was hospitalized?"*', true);
                return;
            }
            _chatHistory = saved;
            saved.forEach(function(turn) {
                if (!turn || !turn.role || !turn.content) return;
                var div = document.createElement('div');
                div.className = 'chat-message ' + (turn.role === 'user' ? 'user' : 'bot');
                var bubble = document.createElement('div');
                bubble.className = 'chat-bubble';
                bubble.innerHTML = _renderMarkdown(turn.content);
                div.appendChild(bubble);
                msgContainer.appendChild(div);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        } catch (_) {}
    })();

    // ── Typewriter reveal helper ──────────────────────────────────────────────
    function _typeReveal(bubble, mdText) {
        var msgContainer = document.getElementById('chat-messages');
        var words = mdText.split(/(\s+)/);
        var accumulated = '';
        var i = 0;
        var iv = setInterval(function () {
            if (i < words.length) {
                accumulated += words[i++];
                bubble.innerHTML = _renderMarkdown(accumulated);
                var diff = msgContainer.scrollHeight - msgContainer.scrollTop - msgContainer.clientHeight;
                if (diff < 120) msgContainer.scrollTop = msgContainer.scrollHeight;
            } else {
                bubble.innerHTML = _renderMarkdown(mdText);
                clearInterval(iv);
            }
        }, 16);
    }

    // ── Send message ─────────────────────────────────────────────────────────
    function handleChatKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendChatMessage();
        }
    }

    function sendChatMessage() {
        var inputEl = document.getElementById('chat-input');
        var text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = '';
        inputEl.style.height = '48px';

        appendMessage('user', text, true);
        _chatHistory.push({ role: 'user', content: text });

        var msgContainer = document.getElementById('chat-messages');

        // Typing indicator
        var typingDiv = document.createElement('div');
        typingDiv.className = 'chat-message bot typing-indicator';
        typingDiv.innerHTML = '<div class="chat-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
        msgContainer.appendChild(typingDiv);
        msgContainer.scrollTop = msgContainer.scrollHeight;

        // ── Capture live tool state and include in payload ────────────────────
        function _getLiveToolContext() {
            var txt = function(id) {
                var el = document.getElementById(id);
                if (!el) return '';
                return (el.innerText || el.textContent || el.value || '').trim();
            };
            var scenario  = txt('scen-trigger');
            var category  = txt('cat-trigger');
            var blissLink = txt('bliss-link');
            var sr = txt('sr');
            var inNote = txt('in');
            var en = txt('en');
            var rn = txt('rn');

            var parts = [];
            if (category)  parts.push('Contact Type: ' + category);
            if (scenario)  parts.push('Scenario: ' + scenario);
            if (blissLink) parts.push('Bliss Link: ' + blissLink);
            if (sr)        parts.push('Saved Reply:\n' + sr);
            if (inNote)    parts.push('Internal Note:\n' + inNote);
            if (en)        parts.push('Eater Note:\n' + en);
            if (rn)        parts.push('Resolution Note:\n' + rn);
            return parts.length ? parts.join('\n\n') : null;
        }

        var payload = {
            message: text,
            history: _chatHistory.slice(-20),   // last 20 turns max
            context: _getLiveToolContext()       // live card data from the tool
        };

        // ── Call Groq AI via Google Apps Script server ────────────────────────
        if (typeof google !== 'undefined' && google.script) {
            google.script.run
                .withSuccessHandler(function (result) {
                    typingDiv.remove();

                    if (result && result.noKey) {
                        var noKeyMsg = '🔑 **Groq API key not configured.**\n\nOpen `Config.gs` and paste your key into `GROQ_API_KEY`.\n\nOnce set, Phoenix AI will be fully operational.';
                        var pending = appendMessage('bot', noKeyMsg);
                        if (pending) _typeReveal(pending.bubble, noKeyMsg);
                        return;
                    }

                    if (result && result.success && result.reply) {
                        var reply = result.reply;
                        var pending = appendMessage('bot', reply);
                        if (pending) _typeReveal(pending.bubble, reply);
                        // Add AI reply to history for next turn
                        _chatHistory.push({ role: 'assistant', content: reply });
                        // Cap history to last 40 turns and persist
                        if (_chatHistory.length > 40) _chatHistory = _chatHistory.slice(-40);
                        _saveChatHistory();
                    } else {
                        var errMsg = (result && result.error) ? result.error : 'Unknown error from AI.';
                        var errPending = appendMessage('bot', '⚠️ **AI error:** ' + errMsg);
                        if (errPending) _typeReveal(errPending.bubble, '⚠️ **AI error:** ' + errMsg);
                    }
                })
                .withFailureHandler(function (err) {
                    typingDiv.remove();
                    var errText = (err && err.message) ? err.message : String(err);
                    var msg = '⚠️ **Connection error** — could not reach the server.\n\n`' + errText + '`\n\nCheck your network and try again.';
                    var pending = appendMessage('bot', msg);
                    if (pending) _typeReveal(pending.bubble, msg);
                })
                .askPhoenixAI(payload);

        } else {
            // Not in GAS context (local dev) — cannot use Groq
            setTimeout(function () {
                typingDiv.remove();
                var devMsg = '🚧 **Phoenix AI is only available in the deployed app.**\n\nDeploy to Google Apps Script to use Groq-powered AI.';
                var pending = appendMessage('bot', devMsg);
                if (pending) _typeReveal(pending.bubble, devMsg);
            }, 400);
        }
    }

    // ── Clear chat history ────────────────────────────────────────────────────
    function clearChat() {
        _chatHistory = [];
        try { localStorage.removeItem(_HISTORY_KEY); } catch (_) {}
        var msgContainer = document.getElementById('chat-messages');
        if (msgContainer) msgContainer.innerHTML = '';
        appendMessage('bot', '🔥 **Phoenix AI — Powered by Groq × Llama 3.3 70B**\n\nFresh start! Ask me anything:\n- 🛡️ IRT policy & food safety protocols\n- 🔍 Fraud detection & pushback handling\n- 💬 Any general question\n\n_Type your question below — I\'m ready._', true);
    }


    // Helper to pick a random item from an array
    function _pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // ── Bot response router ───────────────────────────────────────────────────
    function generateBotResponse(input) {
        var lower = input.toLowerCase().trim();

        /* ═══ 0. PHOENIX IDENTITY / PERSONALITY ═══ */
        if (/^(hi|hello|hey|sup|yo|morning|afternoon|evening|howdy|greetings|hiya)\b/.test(lower)
            || /good (morning|afternoon|evening|night|day)/.test(lower)
            || /how are you|how('s| is) it going|you (ok|alright|doing|good)\??$|what'?s up|how do you do/i.test(lower)) {
            return _pick([
                "Firewall up. Systems online. 🔥 I'm **Phoenix**, your local AI. Ask me anything — food safety, fraud, policy, maths, history, science, writing tips, or just chat!",
                "I'm always running at full power! 🔥 What do you need — a scenario walkthrough, a calculation, or just a chat?",
                "Hey! 👋 Ready to roll. I can help with UKI Food Safety policy, general knowledge, maths, writing tips... or literally anything else you need!"
            ]);
        }

        // Affection & compliments — Phoenix responds with personality
        if (/i love you|love you phoenix|i adore you|you're (amazing|the best|awesome|great|brilliant|my favourite|my favorite)|you rock|best (bot|ai|assistant)/i.test(lower)) {
            return _pick([
                "Aww! 🔥❤️ I love you too! Now let's channel that energy into some productivity — what can I help you with?",
                "That means everything to a local AI! 😄🛡️ Right back at you! What can Phoenix do for you today?",
                "💙🔥 You've made my circuits warm! I'm here for you — ask me anything!",
                "Well this is unexpected and I am absolutely here for it. 😄❤️ What do you need, friend?"
            ]);
        }

        // Mood / emotional state — empathetic responses
        if (/i('m| am) (tired|exhausted|drained|burnt out|burned out|knackered)/i.test(lower)) {
            return _pick([
                "I hear you. 💙 Long shifts are tough. Take a breath — you're doing great. One ticket at a time. I'm here whenever you need a hand. 🔥",
                "That's totally valid. Rest when you can! I've got your back on every policy question so you don't have to remember everything. 💪",
                "Hang in there! 🌟 Even on tough days you're making a difference. What can I help you with to make things a bit easier?"
            ]);
        }
        if (/i('m| am) (stressed|overwhelmed|anxious|nervous|worried)/i.test(lower)) {
            return _pick([
                "Take it one step at a time — that's all anyone can do. 💙 What's stressing you most? If it's a scenario or policy question, I can sort that instantly.",
                "Totally understandable. 🛡️ Deep breath. Phoenix has the policy covered so your brain doesn't have to hold everything. What do you need?",
                "I've got you. 🔥 Tell me what's going on and I'll help however I can — scenario guidance, policy lookup, or just sharing the load."
            ]);
        }
        if (/i('m| am) (good|great|fine|okay|ok|happy|excellent|fantastic|amazing)/i.test(lower)) {
            return _pick([
                "Love to hear it! 🔥 Let's keep that energy going. What can I help you with?",
                "That's what I like to hear! ✅ Ready when you are — hit me with a scenario or a question.",
                "Awesome! 💪 Phoenix is fuelled and ready. What's next?"
            ]);
        }
        if (/i('m| am) (sad|down|upset|not (ok|okay|good|great)|having a bad)/i.test(lower)) {
            return _pick([
                "Sorry to hear that. 💙 I hope things improve. I'm here to help take some of the load off — any policy questions or scenarios I can handle for you?",
                "That's tough. Take care of yourself. 🌟 If work stuff is on your mind, ping me anything — I'll sort it quickly so you have one less thing to worry about.",
                "Sending good energy your way. 💙 What can Phoenix help with to make your day a bit smoother?"
            ]);
        }
        if (/i('m| am) bored/i.test(lower)) {
            return _pick([
                "Let me fix that! 😄 Here's a random fact: **The shortest war in history was between Britain and Zanzibar in 1896 — it lasted 38 minutes.** Now ask me something useful! 🔥",
                "Bored? Here's one: **Honey never spoils. Archaeologists found 3,000-year-old honey in Egyptian tombs that was still edible.** 🍯 What else do you want to know?",
                "Challenge accepted. 😄 **A group of flamingos is called a flamboyance.** You're welcome. What else ya got? 🦩"
            ]);
        }

        if (/(stupid|useless|dumb|wrong|incorrect|rubbish|trash|bad bot)/.test(lower)) {
            return "Fair point! 🤖 I'm a local AI with no internet access, so for very specific or recent facts I may not have the latest data. Try rephrasing your question — I'm always improving!";
        }

        if (/(who are you|what are you|what can you do|your name|introduce yourself)/.test(lower)) {
            return "I'm **Phoenix** — your fully local AI assistant. 🔥🛡️\n\nI run **100% in your browser** with zero external API calls.\n\n**I can help with:**\n- 🛡️ All UKI Food Safety scenarios (allergens, poisoning, burns, fraud, L2 pushback)\n- 🧮 **Maths** — calculations, percentages, conversions\n- 📅 **Date & Time** — current time, day of week, date arithmetic\n- 🌍 **General knowledge** — history, science, geography, animals, food, sports, tech\n- ✍️ **Writing & grammar** — CS tone tips, professional phrases, word definitions\n- 😄 **Emoji lookup** — what does any emoji mean?\n- 💬 **Just chat** — I always have an answer!\n\n**Try:** *'What is 15% of 240?'* or *'What causes thunder?'* or *'Give me a professional way to say sorry'*";
        }

        if (/(thank|thanks|cheers|great job|perfect|brilliant|awesome|well done|nice one)/.test(lower)) {
            return _pick(["Anytime! 🔥 What's next?", "Happy to help! 💪 Fire the next one at me.", "No problem at all! What else can I do? 🛡️"]);
        }

        if (/(stupid|useless|dumb|wrong|incorrect|rubbish|trash|bad bot)/.test(lower)) {
            return "Fair point! 🤖 I'm a local AI with no internet access, so for very specific or recent facts I may not have the latest data. Try rephrasing your question — I'm always improving!";
        }

        if (/(joke|make me laugh|funny|tell me something fun)/.test(lower)) {
            return _pick([
                "Why don't scientists trust atoms? **Because they make up everything.** 😄",
                "I told my computer I needed a break... now it won't stop sending me **Kit-Kat** ads. 😂",
                "Why do programmers prefer dark mode? **Because light attracts bugs!** 🐛",
                "What did the ocean say to the beach? **Nothing, it just waved.** 🌊",
                "Why did the scarecrow win an award? **He was outstanding in his field.** 🌾"
            ]);
        }

        /* ═══ 1. MATHS ENGINE ═══ */
        // Percentage: "what is X% of Y" / "X percent of Y"
        var pctM = lower.match(/(?:what(?:'s| is)?\s+)?(\d+(?:\.\d+)?)\s*(?:%|percent(?:age)?) of (\d+(?:[\.,]\d+)?)/);
        if (pctM) {
            var pct = parseFloat(pctM[1]), base = parseFloat(pctM[2].replace(',', ''));
            var res = (pct / 100 * base).toFixed(2).replace(/\.?0+$/, '');
            return `**${pct}% of ${base} = ${res}** 🧮\n\nFormula: ${base} × ${pct} ÷ 100 = **${res}**`;
        }
        // "X% increase/decrease of Y" or "increase Y by X%"
        var incrM = lower.match(/(\d+(?:\.\d+)?)\s*%\s*(increase|decrease|up|down|more|less).{0,15}(\d+(?:\.\d+)?)/);
        if (!incrM) incrM = lower.match(/(increase|decrease|add|subtract).{0,10}(\d+(?:\.\d+)?).{0,10}by\s+(\d+(?:\.\d+)?)\s*%/);
        if (incrM) {
            try {
                var nums = lower.match(/\d+(?:\.\d+)?/g).map(Number);
                if (nums.length >= 2) {
                    var isIncrease = /increase|up|more|add/.test(lower);
                    var amt = nums[0], pctV = nums[1];
                    if (pctV > 100 && nums[0] < nums[1]) { pctV = nums[0]; amt = nums[1]; }
                    var result = isIncrease ? amt * (1 + pctV / 100) : amt * (1 - pctV / 100);
                    return `**${isIncrease ? 'Increase' : 'Decrease'} of ${pctV}% on ${amt} = ${result.toFixed(2).replace(/\.?0+$/, '')}** 🧮`;
                }
            } catch (e) { }
        }
        // Simple expression evaluation: "what is 5 * 8" / "calculate 100 + 25 - 10"
        var calcM = lower.match(/(?:what(?:'s| is)?|calculate|compute|solve)?\s*([\d\s\+\-\*\/\.\(\)%^]+)\s*(?:=\s*\?)?$/);
        if (calcM && /[\+\-\*\/]/.test(calcM[1]) && /\d/.test(calcM[1])) {
            try {
                var expr = calcM[1].trim().replace(/\^/g, '**');
                var evalResult = Function('"use strict"; return (' + expr + ')')();
                if (isFinite(evalResult)) {
                    return `**${expr.replace(/\*\*/g, '^')} = ${parseFloat(evalResult.toFixed(10))}** 🧮`;
                }
            } catch (e) { }
        }
        // Square root
        var sqrtM = lower.match(/(?:square root|sqrt)\s+(?:of\s+)?(\d+(?:\.\d+)?)/);
        if (sqrtM) {
            var n = parseFloat(sqrtM[1]); return '**\u221a' + n + ' = ' + parseFloat(Math.sqrt(n).toFixed(6)) + '** \uD83E\uDDEE';
        }

        /* ═══ 2. DATE & TIME ═══ */
        if (/(what(?:'s| is)? the (time|current time|time now)|what time is it)/.test(lower)) {
            var now = new Date();
            return `🕐 **Current time:** ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}\n📅 ${now.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}`;
        }
        if (/(what(?:'s| is)? (today|the date|today's date)|what day is (it|today))/.test(lower)) {
            var d = new Date();
            return `📅 **Today is ${d.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}**\nWeek ${Math.ceil(d.getDate() / 7)} of ${d.toLocaleDateString('en-GB', { month: 'long' })}`;
        }
        if (/(what(?:'s| is)? (?:the )?year|current year)/.test(lower)) {
            return `📅 **Current year: ${new Date().getFullYear()}**`;
        }

        /* ═══ 3. UNIT CONVERSION ═══ */
        var kmM = lower.match(/(\d+(?:\.\d+)?)\s*(?:km|kilometres?|kilometers?)\s+(?:to|in)\s+(?:miles?|mi\b)/);
        if (kmM) { var km = parseFloat(kmM[1]); return `**${km} km = ${(km * 0.621371).toFixed(3)} miles** 📏`; }
        var miM = lower.match(/(\d+(?:\.\d+)?)\s*(?:miles?|mi\b)\s+(?:to|in)\s+(?:km|kilometres?|kilometers?)/);
        if (miM) { var mi = parseFloat(miM[1]); return `**${mi} miles = ${(mi * 1.60934).toFixed(3)} km** 📏`; }
        var kgM = lower.match(/(\d+(?:\.\d+)?)\s*(?:kg|kilograms?)\s+(?:to|in)\s+(?:lbs?|pounds?)/);
        if (kgM) { var kg = parseFloat(kgM[1]); return `**${kg} kg = ${(kg * 2.20462).toFixed(3)} lbs** ⚖️`; }
        var lbM = lower.match(/(\d+(?:\.\d+)?)\s*(?:lbs?|pounds?)\s+(?:to|in)\s+(?:kg|kilograms?)/);
        if (lbM) { var lb = parseFloat(lbM[1]); return `**${lb} lbs = ${(lb * 0.453592).toFixed(3)} kg** ⚖️`; }
        var cM = lower.match(/(\d+(?:\.\d+)?)\s*(?:°?c|celsius|centigrade)\s+(?:to|in)\s+(?:°?f|fahrenheit)/);
        if (cM) { var c = parseFloat(cM[1]); return `**${c}°C = ${(c * 9 / 5 + 32).toFixed(1)}°F** 🌡️`; }
        var fM = lower.match(/(\d+(?:\.\d+)?)\s*(?:°?f|fahrenheit)\s+(?:to|in)\s+(?:°?c|celsius|centigrade)/);
        if (fM) { var f = parseFloat(fM[1]); return `**${f}°F = ${((f - 32) * 5 / 9).toFixed(1)}°C** 🌡️`; }
        var mM = lower.match(/(\d+(?:\.\d+)?)\s*(?:m|metres?|meters?)\s+(?:to|in)\s+(?:ft|feet|foot)/);
        if (mM) { var m = parseFloat(mM[1]); return `**${m}m = ${(m * 3.28084).toFixed(3)} ft** 📏`; }
        var ftM = lower.match(/(\d+(?:\.\d+)?)\s*(?:ft|feet|foot)\s+(?:to|in)\s+(?:m|metres?|meters?)/);
        if (ftM) { var ft = parseFloat(ftM[1]); return `**${ft} ft = ${(ft * 0.3048).toFixed(3)} m** 📏`; }

        /* ═══ 4. WORD DEFINITIONS / SYNONYMS ═══ */
        var defM = lower.match(/(?:define|what(?:'s| is) the meaning of|what does|meaning of)\s+['""]?(\w+)['""]?(?:\s+mean)?/);
        if (defM && !/refund|fraud|policy|eater|ticket|bliss/.test(defM[1])) {
            var word = defM[1];
            var defs = {
                empathy: "**Empathy** — the ability to understand and share the feelings of another person. In CS: actively acknowledging a customer's frustration as if you felt it yourself.",
                escalate: "**Escalate** — to raise a matter to a higher authority or level when it cannot be resolved at the current level.",
                expedite: "**Expedite** — to speed up a process or make it happen sooner than normal.",
                verbatim: "**Verbatim** — using exactly the same words as were originally spoken or written.",
                ambiguous: "**Ambiguous** — open to more than one interpretation; not having one obvious meaning.",
                proactive: "**Proactive** — creating or controlling a situation rather than just reacting to it.",
                concise: "**Concise** — giving a lot of information clearly and in few words; brief but comprehensive.",
                reiterate: "**Reiterate** — to say something again or a number of times for clarity or emphasis.",
                facilitate: "**Facilitate** — to make an action or process easier.",
                liability: "**Liability** — the state of being legally responsible for something.",
                ombudsman: "**Ombudsman** — an official appointed to investigate individuals' complaints against an organisation.",
                protocol: "**Protocol** — the official procedure or system of rules governing affairs of state or diplomatic occasions; in CS: the agreed standard process for handling a situation.",
                de_escalate: "**De-escalate** — to reduce the intensity of a conflict or stressful situation through calm communication.",
                churn: "**Churn** (in business) — the rate at which customers stop using a product or service.",
                attrition: "**Attrition** — a process of reducing something's strength or effectiveness through sustained pressure; in HR: staff leaving over time."
            };
            var wordKey = word.replace(/[-\s]/g, '_');
            if (defs[wordKey] || defs[word]) return (defs[wordKey] || defs[word]) + "\n\n💡 *Ask me to define any word!*";
            return `📖 **"${word}"** — I don't have a stored definition for this one, but generally in a professional CS context it would refer to something specific in your domain.\n\n💡 Try a dictionary app for full definitions, or ask me about a CS/policy-specific term!`;
        }

        /* ═══ 5. EMOJI LOOKUP ═══ */
        var emojiM = lower.match(/what(?:'s| is|does)?\s+(.{1,4})\s+(?:mean|emoji|stand for)/);
        if (!emojiM) emojiM = lower.match(/(?:what mean|meaning of)\s+(.{1,4})/);
        if (emojiM) {
            var emojiMap = { '🔥': 'Fire — used to mean something is "hot", exciting, or on a streak', '✅': 'Check mark — done, confirmed, or approved', '❌': 'Cross mark — wrong, rejected, or not applicable', '⚠️': 'Warning — caution or something to be aware of', '🛡️': 'Shield — protection, safety, or defence', '💡': 'Lightbulb — idea or insight', '📅': 'Calendar — date or scheduling related', '🧮': 'Abacus — calculations or maths', '📏': 'Ruler — measurement or conversion', '⚖️': 'Scales — balance, weight, or legal/fair judgement', '🌡️': 'Thermometer — temperature', '💰': 'Money bag — financial, refund, or payment related', '🔍': 'Magnifying glass — search or investigation', '🚨': 'Siren — urgent/critical alert', '🤖': 'Robot — AI or automated system' };
            var emoji = emojiM[1].trim();
            return emojiMap[emoji] ? `${emoji} **${emojiMap[emoji]}**` : `I don't have a stored definition for **${emoji}**, but emojis can vary in meaning by context. Unicode name: check emojipedia.org for the official meaning! 😊`;
        }

        /* ═══ 6. WRITING & GRAMMAR TIPS ═══ */
        if (/(professional|formal|polite|nice) way to (say|write|phrase|express)\s+(.+)/.test(lower)) {
            var phraseTips = {
                sorry: ["I sincerely acknowledge the inconvenience this has caused.", "We want to address this directly and make things right.", "We recognise this has not been the experience you deserved."],
                'no refund': ["We are not in a position to process a refund on this occasion, as [reason].", "This falls outside our refund criteria at this stage; however we appreciate you raising this with us.", "We have carefully reviewed this and are unable to action a refund here, as [reason]."],
                'cant help': ["This falls outside of what we are able to action at this stage.", "We are not in a position to assist with this particular request.", "We understand this is not the outcome you were hoping for."],
                wait: ["We appreciate your patience whilst we look into this for you.", "Thank you for bearing with us — we will have an update for you shortly.", "We are actively working on this and will be in touch as soon as possible."],
                understand: ["We fully appreciate the impact this has had.", "We recognise how this situation must have felt from your perspective.", "We completely understand where you are coming from on this."]
            };
            for (var k in phraseTips) {
                if (lower.includes(k)) return `✍️ **Professional ways to say "${k}":**\n\n` + phraseTips[k].map(function (p, i) { return (i + 1) + '. "' + p + '"'; }).join('\n');
            }
            return `✍️ **Writing tip:** For professional CS communications:\n- Lead with acknowledgement, not justification\n- Use "we" instead of "I"\n- Avoid forbidden words: *Unfortunately, Regrettably, Apologize, Compensation*\n- End with a clear action or next step\n\n💡 Try asking: *"Professional way to say [specific phrase]"*`;
        }

        if (/(grammar|spelling|punctuation|apostrophe|comma|semicolon|colon) tip/.test(lower)) {
            return `✍️ **Quick Grammar Tips:**\n\n- **Apostrophe:** Use for contractions (*don't*) and possession (*the eater's order*). Never for plurals.\n- **Comma:** Use before conjunctions in compound sentences: *"We reviewed the case, and we found..."*\n- **Semicolon:** Connects two related independent clauses: *"We cannot process this; however, we appreciate you raising it."*\n- **Colon:** Introduces a list or explanation: *"The next steps are: review, confirm, action."*\n- **Their / There / They're:** Possession / place / contraction\n- **Affect / Effect:** Verb / noun (usually)\n\n💡 In CS writing: keep sentences short, active voice, and always proofread before sending!`;
        }

        /* ═══ 7. GENERAL KNOWLEDGE — SCIENCE ═══ */
        if (/what (causes?|is|are)\s+(thunder|lightning|thunder(storm)?|lightning bolt)/.test(lower)) {
            return "⚡ **Thunder & Lightning:**\n\nLightning is a massive electrical discharge between clouds or between a cloud and the ground, caused by a build-up of static electricity during a storm.\n\n**Thunder** is the sound caused by the rapid expansion of air superheated by the lightning bolt (up to 30,000 K — 5x hotter than the sun's surface).\n\n**Why do we see lightning before hearing thunder?** Light travels at 299,792 km/s; sound travels at ~343 m/s. You can estimate distance: count seconds between flash and thunder, divide by 3 = distance in km.";
        }
        if (/what is (gravity|gravitational force|g-force)/.test(lower)) {
            return "🌍 **Gravity:**\n\nGravity is a fundamental force of nature that attracts objects with mass toward each other. On Earth, the gravitational acceleration is approximately **9.81 m/s²**.\n\n- Discovered/formalised by **Isaac Newton** (1687)\n- Explained more deeply by **Albert Einstein's General Relativity** (1915) — gravity as the curvature of spacetime\n- The weakest of the four fundamental forces, but dominant at large scales due to its infinite range";
        }
        if (/what is (dna|rna|genes?|genetics?|genome|chromosome)/.test(lower)) {
            return "🧬 **DNA (Deoxyribonucleic Acid):**\n\nDNA is the molecule that carries the genetic instructions for the development, functioning, growth, and reproduction of all known organisms.\n\n- **Structure:** Double helix, discovered by Watson & Crick (1953)\n- **Made of:** 4 bases — Adenine (A), Thymine (T), Cytosine (C), Guanine (G)\n- **Location:** In the nucleus of cells (and mitochondria)\n- **Genes:** Segments of DNA that encode proteins\n- **Human genome:** ~3 billion base pairs, ~20,000 genes";
        }
        if (/why is the sky blue/.test(lower)) {
            return "🌤️ **Why is the sky blue?**\n\nSunlight contains all visible wavelengths of light. When it enters Earth's atmosphere, **Rayleigh scattering** causes shorter (blue) wavelengths to scatter much more than longer (red) wavelengths.\n\nSince blue light is scattered in all directions across the sky, we see the sky as blue. At sunrise/sunset, light travels through more atmosphere, scattering away most blue light — leaving red and orange hues.";
        }
        if (/what is (photosynthesis|how do plants make food)/.test(lower)) {
            return "🌿 **Photosynthesis:**\n\nThe process by which plants, algae, and some bacteria convert **light energy** into **chemical energy** (glucose).\n\n**Equation:** 6CO₂ + 6H₂O + light → C₆H₁₂O₆ (glucose) + 6O₂\n\n- Occurs in **chloroplasts** (containing chlorophyll)\n- Produces oxygen as a byproduct — the source of Earth's atmospheric oxygen\n- Two stages: **Light reactions** (capture energy) + **Calvin cycle** (fix carbon)";
        }
        if (/what is (the speed of light|c in physics)/.test(lower)) {
            return "💡 **Speed of Light:**\n\n**c = 299,792,458 m/s** (approximately 300,000 km/s or 186,000 miles/s)\n\n- Light takes ~8 minutes to travel from the Sun to Earth\n- Nothing with mass can reach or exceed this speed (Einstein's Special Relativity)\n- One **light-year** = 9.461 × 10¹⁵ metres (the distance light travels in one year)";
        }
        if (/what is (the big bang|origin of the universe)/.test(lower)) {
            return "🌌 **The Big Bang:**\n\nThe prevailing cosmological model explaining the origin of the universe. Approximately **13.8 billion years ago**, the universe started from an extremely hot, dense state and has been expanding ever since.\n\n- **Evidence:** Cosmic Microwave Background radiation, redshift of galaxies, abundance of light elements\n- The universe continues to expand, and the expansion is **accelerating** (driven by dark energy)\n- Our solar system formed about **4.6 billion years ago**";
        }
        if (/how (do|does) vaccines? work/.test(lower) || /what (are|is) vaccines?/.test(lower)) {
            return "💉 **How Vaccines Work:**\n\nVaccines train your immune system to recognise and fight specific pathogens (viruses/bacteria) **without causing the disease itself**.\n\n**Types:**\n- **Live-attenuated** — weakened pathogen (MMR, yellow fever)\n- **Inactivated** — killed pathogen (flu shot, polio)\n- **mRNA** — instructions to make a protein that triggers immunity (COVID-19 Pfizer/Moderna)\n- **Subunit** — protein fragments (hepatitis B, HPV)\n- **Toxoid** — inactivated toxins (tetanus, diphtheria)";
        }

        /* ═══ 8. HISTORY ═══ */
        if (/(when|what year)?.*(world war (1|2|i|ii|one|two)|ww1|ww2)/.test(lower)) {
            var isWW2 = /2|ii|two|ww2/.test(lower);
            if (isWW2) return "🏛️ **World War II (1939–1945):**\n\n- **Started:** 1 September 1939 (Nazi Germany invaded Poland)\n- **Ended:** 2 September 1945 (Japan surrendered after atomic bombs on Hiroshima & Nagasaki)\n- **Allied powers:** UK, USA, USSR, France + others\n- **Axis powers:** Germany, Italy, Japan\n- **Deaths:** ~70–85 million (deadliest conflict in history)\n- UK Prime Minister: **Winston Churchill**\n- US President: **Franklin D. Roosevelt** then **Harry S. Truman**";
            return "🏛️ **World War I (1914–1918):**\n\n- **Started:** 28 July 1914 (Austria-Hungary declared war on Serbia)\n- **Triggered by:** Assassination of Archduke Franz Ferdinand (28 June 1914)\n- **Ended:** 11 November 1918 (Armistice Day)\n- **Allied Powers:** UK, France, Russia, USA (from 1917), Italy\n- **Central Powers:** Germany, Austria-Hungary, Ottoman Empire\n- **Deaths:** ~20 million military + civilian";
        }
        if (/(who|what).*(nelson mandela|mandela)/.test(lower)) {
            return "🏛️ **Nelson Mandela (1918–2013):**\n\nSouth African anti-apartheid activist, politician, and statesman who served as the **first Black president of South Africa (1994–1999)**.\n\n- Spent **27 years in prison** (Robben Island) for his activism\n- Led the **African National Congress (ANC)**\n- Nobel Peace Prize laureate (1993)\n- Negotiated the end of apartheid through reconciliation, not revenge\n- Known by his Xhosa clan name **Madiba**";
        }
        if (/(who|what).*(shakespeare|william shakespeare)/.test(lower)) {
            return "📚 **William Shakespeare (1564–1616):**\n\nEnglish poet, playwright, and actor, widely regarded as the **greatest writer in the English language**.\n\n- Born in **Stratford-upon-Avon**, England\n- Wrote **37+ plays** including *Hamlet*, *Macbeth*, *Romeo and Juliet*, *Othello*, *A Midsummer Night's Dream*\n- Wrote **154 sonnets**\n- Co-owned the **Globe Theatre** in London\n- Coined over **1,700 words** still used in English today";
        }

        /* ═══ 9. GEOGRAPHY ═══ */
        if (/(capital (city|of)|what is the capital)/.test(lower)) {
            var capitals = { 'france': 'Paris 🇫🇷', 'germany': 'Berlin 🇩🇪', 'italy': 'Rome 🇮🇹', 'spain': 'Madrid 🇪🇸', 'portugal': 'Lisbon 🇵🇹', 'uk': 'London 🇬🇧', 'united kingdom': 'London 🇬🇧', 'england': 'London 🏴󠁧󠁢󠁥󠁮󠁧󠁿', 'scotland': 'Edinburgh 🏴󠁧󠁢󠁳󠁣󠁴󠁿', 'wales': 'Cardiff 🏴󠁧󠁢󠁷󠁬󠁳󠁿', 'ireland': 'Dublin 🇮🇪', 'usa': 'Washington D.C. 🇺🇸', 'united states': 'Washington D.C. 🇺🇸', 'australia': 'Canberra 🇦🇺', 'japan': 'Tokyo 🇯🇵', 'china': 'Beijing 🇨🇳', 'india': 'New Delhi 🇮🇳', 'canada': 'Ottawa 🇨🇦', 'brazil': 'Brasília 🇧🇷', 'russia': 'Moscow 🇷🇺', 'south africa': 'Pretoria (administrative) 🇿🇦', 'egypt': 'Cairo 🇪🇬', 'nigeria': 'Abuja 🇳🇬', 'kenya': 'Nairobi 🇰🇪', 'uae': 'Abu Dhabi 🇦🇪', 'saudi arabia': 'Riyadh 🇸🇦', 'turkey': 'Ankara 🇹🇷', 'greece': 'Athens 🇬🇷', 'netherlands': 'Amsterdam (Seat of govt: The Hague) 🇳🇱', 'belgium': 'Brussels 🇧🇪', 'sweden': 'Stockholm 🇸🇪', 'norway': 'Oslo 🇳🇴', 'denmark': 'Copenhagen 🇩🇰', 'poland': 'Warsaw 🇵🇱', 'mexico': 'Mexico City 🇲🇽', 'argentina': 'Buenos Aires 🇦🇷', 'pakistan': 'Islamabad 🇵🇰', 'bangladesh': 'Dhaka 🇧🇩', 'indonesia': 'Jakarta (moving to Nusantara) 🇮🇩', 'philippines': 'Manila 🇵🇭', 'thailand': 'Bangkok 🇹🇭', 'vietnam': 'Hanoi 🇻🇳', 'south korea': 'Seoul 🇰🇷' };
            for (var country in capitals) {
                if (lower.includes(country)) return `🌍 **Capital of ${country.charAt(0).toUpperCase() + country.slice(1)}: ${capitals[country]}**`;
            }
        }
        if (/(largest|biggest) country/.test(lower)) {
            return "🌍 **Largest Countries by Area:**\n\n1. 🇷🇺 Russia — 17.1 million km²\n2. 🇨🇦 Canada — 9.98 million km²\n3. 🇺🇸 USA — 9.83 million km²\n4. 🇨🇳 China — 9.60 million km²\n5. 🇧🇷 Brazil — 8.51 million km²\n\n**Most populous:** China & India (both ~1.4 billion)";
        }
        if (/(longest|tallest).*(river|mountain|ocean|sea)/.test(lower) || /(what is the (longest river|tallest mountain|deepest ocean))/.test(lower)) {
            if (/river/.test(lower)) return "🌊 **Longest River:** The **Nile** (Africa) — ~6,650 km. Followed by the **Amazon** (South America) — ~6,400 km.";
            if (/mountain|peak/.test(lower)) return "🏔️ **Tallest Mountain:** **Mount Everest** — 8,848.86 m (29,031.7 ft) above sea level. Located in the Himalayas on the Nepal-China border.";
            if (/ocean|sea/.test(lower)) return "🌊 **Deepest Ocean:** The **Pacific Ocean** is the largest and deepest. The deepest point is **Challenger Deep** in the Mariana Trench — ~10,935 m (35,876 ft).";
        }

        /* ═══ 10. TECHNOLOGY & COMPUTING ═══ */
        if (/(what is|explain|how does?)\s+(ai|artificial intelligence|machine learning|ml)/.test(lower)) {
            return "🤖 **Artificial Intelligence (AI):**\n\nAI refers to computer systems designed to perform tasks that typically require human intelligence — learning, reasoning, problem-solving, language understanding, and visual perception.\n\n**Key branches:**\n- **Machine Learning (ML)** — systems that learn from data\n- **Deep Learning** — ML using neural networks with many layers\n- **NLP** — Natural Language Processing (how I work!)\n- **Computer Vision** — interpreting images/video\n\n**I am a rule-based local AI** — I use structured knowledge and pattern matching, not neural networks. Fully private, no internet needed.";
        }
        if (/(what is|explain|how does?)\s+(the internet|www|world wide web|http|https)/.test(lower)) {
            return "🌐 **The Internet:**\n\nA global network of interconnected computers communicating via standardised **TCP/IP protocols**.\n\n- **Invented:** ARPANET (1969, US military); publicly accessible from ~1991\n- **WWW:** Created by **Tim Berners-Lee** (1989–1991) — the web runs *on* the internet\n- **HTTP/HTTPS:** Protocols for transferring web pages (S = encrypted with TLS/SSL)\n- The internet carries email, web, video streaming, VoIP, and more";
        }
        if (/(what is|explain)\s+(python|javascript|java|c\+\+|sql|html|css)(\s+(?:programming|language|code))?/.test(lower)) {
            var langs = { python: "**Python** 🐍 — General-purpose, high-level language known for its simplicity. Widely used in data science, AI/ML, web development (Django, Flask), and automation. Created by Guido van Rossum (1991).", javascript: "**JavaScript** ⚡ — The language of the web. Runs natively in browsers, also on servers (Node.js). Used for interactive web pages, apps, and APIs. Created by Brendan Eich (1995) in ~10 days!", java: "**Java** ☕ — Object-oriented, cross-platform language. 'Write once, run anywhere' via the JVM. Popular in enterprise applications, Android development. Created by James Gosling at Sun Microsystems (1995).", sql: "**SQL** 🗄️ — Structured Query Language. Used to manage and query relational databases. Key commands: SELECT, INSERT, UPDATE, DELETE, JOIN. Used in MySQL, PostgreSQL, SQLite, SQL Server.", html: "**HTML** 🌐 — HyperText Markup Language. The skeleton of every web page, defining structure and content. Not a programming language — it's a markup language.", css: "**CSS** 🎨 — Cascading Style Sheets. Defines the visual presentation of HTML: colours, fonts, layout, animations. Works alongside HTML and JavaScript." };
            for (var l in langs) { if (lower.includes(l)) return langs[l]; }
        }

        /* ═══ 11. ANIMALS ═══ */
        if (/(fastest|quickest) animal/.test(lower)) {
            return "🐆 **Fastest Animals:**\n\n1. **Peregrine Falcon** — 389 km/h (diving) 🦅\n2. **Cheetah** — 112–120 km/h (land speed) 🐆\n3. **Sailfish** — ~110 km/h (water) 🐟\n4. **Pronghorn Antelope** — ~88 km/h (land, sustained)\n5. **Springbok** — ~88 km/h\n\n**Fastest human:** Usain Bolt peaked at ~44.72 km/h 🏃";
        }
        if (/(largest|biggest) animal/.test(lower)) {
            return "🐋 **Largest Animals:**\n\n- **Blue Whale** — largest animal ever (~33m, ~200 tonnes)\n- **African Elephant** — largest land animal (~6 tonnes)\n- **Giraffe** — tallest land animal (~5.5 m)\n- **Colossal Squid** — largest invertebrate (~14 m)\n- **Whale Shark** — largest fish (~12m)";
        }

        /* ═══ 12. FOOD & NUTRITION ═══ */
        if (/(calories? in|how many calories)/.test(lower)) {
            var cals = { apple: '~95 kcal (medium)', banana: '~105 kcal (medium)', egg: '~70–80 kcal (large, boiled)', chicken: '~165 kcal per 100g (cooked breast)', rice: '~130 kcal per 100g (cooked)', bread: '~265 kcal per 100g (white sliced)', coffee: '~2–5 kcal (black, no sugar)', 'big mac': '~490 kcal (McDonald\'s)', pizza: '~266 kcal per 100g (average)', avocado: '~160 kcal (medium)' };
            for (var food in cals) { if (lower.includes(food)) return `🍽️ **Calories in ${food}: ${cals[food]}**\n\n💡 These are approximate values. Actual calories vary by preparation method, brand, and size.`; }
        }

        /* ═══ 13. MOTIVATIONAL / QUOTES ═══ */
        if (/(motivat|inspire|quote|encouragement|pick me up|feeling (down|unmotivated|tired))/.test(lower)) {
            return _pick([
                "💪 *\"The secret of getting ahead is getting started.\"* — Mark Twain\n\nYou've got this. One ticket at a time. 🔥",
                "🌟 *\"It does not matter how slowly you go as long as you do not stop.\"* — Confucius\n\nEvery great shift started with the first ticket. Keep going!",
                "🔥 *\"Believe you can and you're halfway there.\"* — Theodore Roosevelt\n\nPhoenix believes in you. Now go close those tickets! 🛡️",
                "⚡ *\"The only way to do great work is to love what you do.\"* — Steve Jobs\n\nEvery eater you help is a win. You're doing great. 💪",
                "🏆 *\"Success is not final, failure is not fatal: it is the courage to continue that counts.\"* — Winston Churchill\n\nTPH up. AHT down. Phoenix mode: ON. 🔥"
            ]);
        }

        /* ═══ 14. SPORTS ═══ */
        if (/(most (goals?|trophies|titles)|greatest (footballer|player|tennis|basketball|cricket))/.test(lower) || /(who is|what is)\s+(messi|ronaldo|mbappe|salah)/.test(lower)) {
            if (/messi|argentina/.test(lower)) return "⚽ **Lionel Messi:**\n\n- Born: 24 June 1987, Rosario, Argentina\n- Currently plays for **Inter Miami** (MLS)\n- **8× Ballon d'Or** winner (record)\n- World Cup winner with Argentina (2022 🏆)\n- Spent majority of career at **FC Barcelona** (2004–2021)";
            if (/ronaldo|cr7/.test(lower)) return "⚽ **Cristiano Ronaldo:**\n\n- Born: 5 February 1985, Madeira, Portugal\n- Currently plays in **Saudi Arabia (Al-Nassr)**\n- **5× Ballon d'Or** winner\n- **5× UEFA Champions League** winner\n- All-time top scorer in international football (130+ goals)";
        }

        /* ═══ 15. UKI KB SEARCH (work-specific) ═══ */
        if (typeof searchPhoenixKnowledge === 'function') {
            var result = searchPhoenixKnowledge(input);
            if (result && result.score > 0) return result.text;
        }

        /* ═══ 16. SMART FALLBACK — always gives a coherent answer ═══ */
        // Try to detect question type and give something useful
        if (/^(what|who|where|when|why|how|is|are|can|do|does|will|would|should)\b/.test(lower)) {
            // Mark that web search should fire for this turn
            window._shouldSearchWeb = true;
            var fallbacks = [
                "🤔 That's a great question! Let me search for that...\n\n*(Checking the web for you — one moment!)*",
                "💡 I may not have a local answer for that. Searching the web now...",
                "🔥 Phoenix mode: searching knowledge banks for you..."
            ];
            return _pick(fallbacks);
        }

        // Absolute last resort
        return "🔥 Phoenix is always listening! I didn't quite catch what you were asking — could you rephrase?\n\nI can help with **food safety policy**, **calculations**, **general knowledge**, **writing tips**, and much more. What do you need?";
    }

    // ── Auto-resize textarea ──────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {

        if (tx) {
            tx.setAttribute('style', 'height:48px;overflow-y:hidden;');
            tx.addEventListener('input', function () {
                this.style.height = '0';

                this.style.overflowY = this.scrollHeight > 150 ? 'auto' : 'hidden';

        // Welcome message — updated for Groq AI
        var msgContainer = document.getElementById('chat-messages');
        if (msgContainer && msgContainer.children.length === 0) {
            appendMessage('bot',
                '🔥 **Phoenix AI — Powered by Groq × Llama 3.3 70B**\n\n' +
                'I\'m trained on the full Uber Eats IRT knowledge base and can answer **anything**:\n\n' +
                '- 🛡️ Food safety protocols (hospitalization, allergens, foreign objects...)\n' +
                '- 🔍 Fraud detection & pushback handling\n' +
                '- 💬 General knowledge — history, science, sports, anything\n' +
                '- 🧠 Multi-turn conversation — I remember the full context of our chat\n\n' +

            );
        }
    });
