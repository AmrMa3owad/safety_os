    // ═══════════════════════════════════════════════════════════════════════════
    // ██  CONVERSATION MEMORY  ██
    // ═══════════════════════════════════════════════════════════════════════════
    const _ctx = {
        lastTopicTags: [],
        turnCount: 0,
        askedFollowUp: false
    };

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  INTENT DETECTION  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function _detectIntent(q) {
        const l = q.toLowerCase().trim();
        // Conversational / small talk — must be checked BEFORE kb-specific patterns
        if (/^(hi|hello|hey|sup|yo|howdy|greetings|hiya|yo|morning|afternoon|evening)\b/i.test(l)) return 'greeting';
        if (/^(good\s*(morning|afternoon|evening|night|day))\b/i.test(l)) return 'greeting';
        if (/how are you|how('s| is) it going|how('s| is) your|you alright|you ok|how do you do|what('s| is) up|how'?s life|you doing|are you good|are you ok/i.test(l)) return 'greeting';
        if (/i('m| am) (good|fine|great|ok|okay|tired|bored|stressed|happy|sad|angry|frustrated|exhausted|excited)/i.test(l)) return 'smalltalk';
        if (/^(nice|cool|great|awesome|wow|amazing|brilliant|perfect|excellent|wonderful|sweet|got it|okay|ok|sure|understood|noted|thanks|thank you|cheers|appreciate)/i.test(l)) return 'thanks';
        if (/(thank|thanks|cheers|appreciate|well done|good job|nice one|perfect|brilliant)/i.test(l)) return 'thanks';
        if (/(who are you|what are you|what can you do|help me|commands|what do you know|what do you cover|your capabilities)/i.test(l)) return 'identity';
        if (/(stupid|useless|dumb|you suck|basic|rubbish|trash|bad bot|not helpful)/i.test(l)) return 'insult';
        if (/(joke|funny|make me laugh|something fun|random fact)/i.test(l)) return 'smalltalk';
        if (/(what is|what are|explain|define|what does|what's the|meaning of)/i.test(l)) return 'definition';
        if (/(how do|how to|how can|steps to|what steps|what should i)/i.test(l)) return 'procedural';
        if (/(when (should|do|must|is)|should i|do i need to|is it required)/i.test(l)) return 'conditional';
        if (/(can i|am i allowed|is it ok|is it allowed|permission)/i.test(l)) return 'permission';
        return 'search';
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  ENTITY EXTRACTION  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function _extractEntities(q) {
        const l = q.toLowerCase();
        const entities = { severity: null, market: null, scen: null };
        if (/hospital|ambulance|emerge/.test(l)) entities.severity = 'critical';
        if (/uk|united kingdom|england|ireland|irl|scotland|wales/.test(l)) entities.market = 'uki';
        if (/fraud|fake|abuse/.test(l)) entities.scen = 'fraud';
        if (/allerg|intoleran/.test(l)) entities.scen = 'allergy';
        if (/poison|ill|sick|nausea|vomit|diarr/.test(l)) entities.scen = 'poisoning';
        if (/undercooked|raw|not cooked/.test(l)) entities.scen = 'undercooked';
        if (/foreign|glass|metal|plastic|hair|bug|insect|bone/.test(l)) entities.scen = 'foreign_object';
        return entities;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  SCORING ENGINE  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function _scoreEntry(entry, words, queryLower) {
        let score = 0;

        // Tag matching (high weight)
        for (const tag of entry.tags) {
            if (queryLower.includes(tag)) {
                score += 12 + (tag.length > 4 ? 6 : 0); // bonus for longer tags
            }
        }

        // Question phrase matching (very high weight) — require at least 2 word matches
        for (const q of entry.questions) {
            const qWords = q.toLowerCase().split(/\s+/);
            const meaningfulQWords = qWords.filter(w => w.length > 3 && !['what', 'does', 'when', 'have', 'should', 'with', 'that', 'this', 'from', 'they', 'their', 'were', 'been'].includes(w));
            if (meaningfulQWords.length === 0) continue;
            let qMatches = 0;
            for (const w of meaningfulQWords) {
                if (queryLower.includes(w)) qMatches++;
            }
            // Require at least 2 matching words to avoid partial hits
            if (qMatches >= 2) {
                const ratio = qMatches / meaningfulQWords.length;
                score += Math.round(ratio * 30);
            }
        }

        // Word-level matches in tags (medium weight) — EXACT word boundary matching only
        // Using \b prevents 'donald' matching 'mcdonald', 'love' matching 'gloves', etc.
        const stopWords = new Set(['what', 'how', 'when', 'the', 'is', 'are', 'was', 'do', 'can', 'be', 'it', 'my', 'put', 'to', 'for', 'i', 'a', 'an', 'in', 'on', 'with', 'of', 'that', 'this', 'if', 'and', 'or', 'but', 'not', 'they', 'we', 'get', 'got', 'from', 'as', 'by', 'at', 'you', 'your', 'who', 'has', 'have', 'had', 'did', 'does']);
        // Non-work conversational words that must never score
        const conversationalWords = new Set(['love', 'hate', 'feel', 'feeling', 'nice', 'wow', 'great', 'cool', 'awesome', 'yeah', 'okay', 'sure', 'like', 'much', 'very', 'really', 'just', 'only', 'also', 'still', 'even', 'already', 'yet', 'some', 'any', 'all', 'most', 'many', 'more', 'every', 'each', 'both', 'few', 'same', 'new', 'old', 'good', 'bad', 'big', 'small', 'long', 'high', 'low', 'right', 'left', 'last', 'first', 'next', 'way', 'day', 'time', 'year', 'week', 'month']);
        for (const word of words) {
            if (stopWords.has(word) || conversationalWords.has(word) || word.length < 4) continue;
            const wordRegex = new RegExp('\\b' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
            for (const tag of entry.tags) {
                if (wordRegex.test(tag)) {
                    score += 4;
                }
            }
        }

        // Priority bonus
        score += entry.priority || 0;

        // Context continuity bonus — ONLY apply if the current query is work-domain-relevant.
        // Without this guard, a non-work question ("who is donald trump") asked after a work
        // question ("eater wants to speak to supervisor") inherits the previous topic's score boost.
        const CONTEXT_DOMAIN_WORDS = ['eater', 'order', 'food', 'refund', 'ticket', 'bliss', 'allerg',
            'poison', 'hospital', 'injur', 'sick', 'burn', 'fraud', 'chef', 'restaur', 'deliver', 'driver',
            'courier', 'missing', 'wrong', 'item', 'cancel', 'complaint', 'policy', 'escalat', 'resolv',
            'contact', 'gregg', 'mcdonald', 'kfc', 'undercook', 'foreign', 'object', 'glass', 'metal',
            'hair', 'adjustment', 'fare', 'safety', 'hygien', 'report', 'appeas', 'compensat', 'voucher'];
        const queryHasDomainWord = CONTEXT_DOMAIN_WORDS.some(function (kw) {
            return queryLower.includes(kw);
        });
        if (queryHasDomainWord && _ctx.lastTopicTags.length > 0) {
            const overlap = entry.tags.filter(t => _ctx.lastTopicTags.includes(t));
            if (overlap.length > 0) score += overlap.length * 3;
        }

        return score;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  FALLBACK: RAW KB FULL-TEXT SEARCH  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function _fallbackSearch(queryLower, words) {
        const rawContent = typeof FULL_KB_TEXT !== 'undefined' ? FULL_KB_TEXT : '';
        if (!rawContent) return null;

        // ── Domain relevance guard ─────────────────────────────────────────────
        // The query must contain at least one food-safety / work-domain keyword
        // before we even attempt a full-text search. This stops "how is the president
        // of america", random greetings, and general trivia from firing KB results.
        const DOMAIN_KEYWORDS = [
            'eater', 'order', 'food', 'refund', 'ticket', 'bliss', 'allerg', 'poison',
            'hospital', 'injur', 'sick', 'burn', 'fraud', 'chef', 'restaur', 'deliver',
            'driver', 'courier', 'missing', 'wrong', 'item', 'cancel', 'complaint',
            'policy', 'escalat', 'resolv', 'contact', 'gregg', 'mcdonald', 'kfc',
            'allergen', 'undercook', 'foreign', 'object', 'glass', 'metal', 'hair',
            'refund', 'adjustment', 'fare', 'safety', 'hygien', 'report', 'l2', 'l3',
            'iit', 'solved', 'awaiting', 'open', 'note', 'bliss', 'internal',
            'appeas', 'compensat', 'voucher', 'credit', 'payment'
        ];
        const hasDomainWord = DOMAIN_KEYWORDS.some(function (kw) {
            return queryLower.includes(kw);
        });
        if (!hasDomainWord) return null;

        // ── Filter to meaningful query words ────────────────────────────────────
        // Minimum 4 chars, not in stop list
        const STOP = new Set(['what', 'how', 'when', 'where', 'why', 'who', 'the', 'is', 'are', 'was', 'do',
            'can', 'be', 'it', 'my', 'to', 'for', 'i', 'a', 'an', 'in', 'on', 'with', 'of', 'that', 'this',
            'if', 'and', 'or', 'but', 'not', 'they', 'we', 'get', 'got', 'from', 'as', 'by', 'at', 'you',
            'your', 'has', 'have', 'had', 'did', 'does', 'will', 'would', 'should', 'could', 'please']);
        const meaningfulWords = words.filter(function (w) {
            return w.length >= 4 && !STOP.has(w);
        });

        // Need at least 2 meaningful words to even try
        if (meaningfulWords.length < 2) return null;

        // ── Clean and chunk the KB text ─────────────────────────────────────────
        const cleaned = rawContent
            .replace(/\n\s*\n/g, '\n')
            .replace(/([a-z])\n([a-z])/g, '$1 $2')
            .replace(/\n/g, ' ')
            .replace(/\s{2,}/g, ' ');

        const sentences = cleaned.match(/[^.!?]+[.!?]?/g) || [];

        let best = null, bestScore = 0;
        const chunks = [];
        for (let i = 0; i < sentences.length; i += 2) {
            chunks.push(sentences.slice(i, i + 3).join(' ').trim());
        }

        for (const chunk of chunks) {
            if (chunk.length < 40) continue;
            const cl = chunk.toLowerCase();
            let score = 0;
            let distinctMatches = 0;
            for (const w of meaningfulWords) {
                if (cl.includes(w)) { score += 2; distinctMatches++; }
            }
            if (score > bestScore) { bestScore = score; best = chunk; }
        }

        // Require score ≥ 12 (6+ word hits) AND at least 3 distinct word matches
        // This prevents 2-word coincidental matches from firing
        const MIN_FALLBACK_SCORE = 12;
        const MIN_DISTINCT_HITS = 3;

        if (bestScore >= MIN_FALLBACK_SCORE && best) {
            // Re-check distinct hits for the winning chunk
            const cl = best.toLowerCase();
            let hits = meaningfulWords.filter(function (w) { return cl.includes(w); }).length;
            if (hits >= MIN_DISTINCT_HITS) {
                return '📄 **Found in Knowledge Base:**\n\n' + best.slice(0, 600) + '...';
            }
        }
        return null;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  RESPONSE GENERATOR  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function _gentle_fallback(intent, entities) {
        const scenarioHints = {
            fraud: "Try asking: *'how to do a fraud check'* or *'eater has too many refunds'*",
            allergy: "Try: *'eater has allergy no injury'* or *'allergen detected before eating'*",
            poisoning: "Try: *'eater got food poisoning'* or *'eater is sick after eating'*",
            undercooked: "Try: *'undercooked meat'* or *'raw chicken delivered'*",
            foreign_object: "Try: *'foreign object in food'* or *'eater found glass in food'*"
        };
        const hint = entities.scen && scenarioHints[entities.scen]
            ? `\n\n💡 ${scenarioHints[entities.scen]}`
            : '\n\n💡 Try keywords like: *fraud check, hospitalization, 10-day policy, allergen, undercooked, foreign object, l2 pushback, greggs, missing item*';

        return `⚠️ **Phoenix couldn't find an exact match in the UKI Food Safety KB.**${hint}\n\nOr ask me things like:\n- *"What do I do if the eater was hospitalized?"*\n- *"How to handle Greggs UK food poisoning?"*\n- *"When should I refund the delivery fee?"*`;
    }

    // ═══════════════════════════════════════════════════════════════════════════
    // ██  MAIN PUBLIC API  ██
    // ═══════════════════════════════════════════════════════════════════════════
    function searchPhoenixKnowledge(queryRaw) {
        const queryLower = queryRaw.toLowerCase().replace(/[^\w\s]/g, ' ').replace(/\s+/g, ' ').trim();
        const intent = _detectIntent(queryRaw);
        const entities = _extractEntities(queryRaw);
        _ctx.turnCount++;

        // ── Conversational guard: never send small talk to KB scoring ──
        // If intent is greeting or smalltalk, return score=0 immediately
        // so generateBotResponse() handles it with personality.
        if (intent === 'greeting' || intent === 'smalltalk') {
            return { score: 0, text: '' };
        }

        // Intent shortcuts — instant responses for identity, thanks, insult
        // (greeting/smalltalk returned above by the conversational guard)
        if (intent === 'identity') {
            return { score: 999, text: `I'm **Phoenix** — your fully local AI assistant for **UKI EMEA Food Safety support**. 🔥\n\nI run entirely in your browser with **zero external APIs**. I have knowledge of:\n- All UKI Food Safety scenarios (allergens, poisoning, burns, foreign objects, undercooked meat)\n- Fraud detection protocols\n- L2 pushback handling\n- Soft skills & formatting rules\n- Refund logic, ticket taxonomy, and saved reply guide\n\nJust describe a scenario or ask a policy question!` };
        }
        if (intent === 'thanks') {
            return { score: 999, text: _pick(['Anytime! 🔥 Fire the next one at me.', 'Happy to help! 💪 What else?', 'Got it. Next question?']) };
        }
        if (intent === 'insult') {
            return { score: 999, text: "I'm limited by the policies loaded into my local KB. If I missed something, try rephrasing — I respond best to specific keywords like *'food poisoning'*, *'allergen'*, or *'fraud check'*. 🤖⚡" };
        }

        // Tokenize query for scoring
        const words = queryLower.split(' ').filter(w => w.length > 2);

        // Score all KB entries
        const scored = PHOENIX_KB.map(entry => ({
            entry,
            score: _scoreEntry(entry, words, queryLower)
        })).sort((a, b) => b.score - a.score);

        const top = scored[0];
        const MIN_SCORE = 20; // Raised from 8 — priority bonus alone (max 10) must not fire a KB hit

        if (top && top.score >= MIN_SCORE) {
            // Update conversation context
            _ctx.lastTopicTags = top.entry.tags.slice(0, 5);
            _ctx.askedFollowUp = false;

            let response = top.entry.answer;

            // If there are 2 close matches, add a related tip
            if (scored[1] && scored[1].score >= MIN_SCORE && scored[1].score >= top.score * 0.7) {
                const related = scored[1].entry.tags[0];
                response += `\n\n---\n💡 *Related: You might also want to check "${related}" — just ask!*`;
            }

            return { score: top.score, text: response };
        }

        // Fallback to raw KB text search
        const rawResult = _fallbackSearch(queryLower, words);
        if (rawResult) {
            return { score: 5, text: rawResult };
        }

        // Gentle fallback with hints
        return { score: 0, text: _gentle_fallback(intent, entities) };
    }

    function _pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }
</script>
