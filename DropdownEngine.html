<script>
    /**
     * DropdownEngine — Category/scenario dropdown filtering and selection.
     */
    function filterCategoriesLocal() {
        var term = document.getElementById('cat-trigger').value.toLowerCase();
        var list = document.getElementById('cat-scroll');
        var items = Object.keys(storage).filter(function (k) { return k.toLowerCase().includes(term); });

        document.getElementById('cat-list').classList.add('active');
        list.innerHTML = '';

        if (items.length === 0) {
            list.innerHTML = '<div class="dropdown-item" style="opacity:0.5; pointer-events:none;">No categories found...</div>';
        } else {
            items.forEach(function (k, idx) {
                var item = document.createElement('div');
                item.className = 'dropdown-item';
                item.innerText = k;
                item.onmouseenter = function () { highlightedIndex = idx; updateVisualSelection(list); };
                item.onclick = function (e) { e.stopPropagation(); selectCategory(k); };
                list.appendChild(item);
            });
        }
        highlightedIndex = 0;
        updateVisualSelection(list);
    }

    function filterScenariosLocal() {
        var term = document.getElementById('scen-trigger').value.toLowerCase();
        var list = document.getElementById('scen-scroll');
        document.getElementById('scen-list').classList.add('active');

        var catData = storage[currentCat] || [];
        filteredList = catData.filter(function (item) { return item.scenario.toLowerCase().includes(term); }).map(function (m) { return Object.assign({}, m, { fromCat: currentCat }); });
        list.innerHTML = '';

        if (filteredList.length === 0) {
            list.innerHTML = '<div class="dropdown-item" style="opacity:0.5; pointer-events:none;">No scenarios found...</div>';
        } else {
            filteredList.forEach(function (item, i) {
                var div = document.createElement('div');
                div.className = 'dropdown-item';
                div.innerText = item.scenario;
                div.onmouseenter = function () { highlightedIndex = i; updateVisualSelection(list); };
                div.onclick = function (e) { e.stopPropagation(); selectScenario(i); };
                list.appendChild(div);
            });
        }
        highlightedIndex = 0;
        updateVisualSelection(list);
    }

    function handleTileKey(e, type) {
        if (e.key === 'Enter' || e.key === 'ArrowDown') {
            e.preventDefault();
            var listId = type === 'cat' ? 'cat-list' : 'scen-list';
            var list = document.getElementById(listId);
            if (!list.classList.contains('active')) {
                list.classList.add('active');
                if (type === 'cat') filterCategoriesLocal(); else filterScenariosLocal();
            }
        }
    }

    function selectCategory(cat, isInitial) {
        if (isInitial === undefined) isInitial = false;
        currentCat = cat;
        var catTrigger = getEl('cat-trigger');
        if (catTrigger) catTrigger.value = cat;
        localStorage.setItem(STORAGE_KEYS.cat, cat);
        var catList = getEl('cat-list');
        if (catList) catList.classList.remove('active');
        filterScenarios(isInitial);
        if (filteredList.length > 0) selectScenario(0);
    }

    function selectScenario(idx) {
        var d = filteredList[idx];
        if (!d) return;
        if (d.fromCat && d.fromCat !== currentCat) {
            currentCat = d.fromCat;
            var catTrigger = getEl('cat-trigger');
            if (catTrigger) catTrigger.value = currentCat;
            localStorage.setItem(STORAGE_KEYS.cat, currentCat);
        }
        currentScenIdx = idx;
        var scenTrigger = getEl('scen-trigger');
        if (scenTrigger) scenTrigger.value = d.scenario;
        var scenList = getEl('scen-list');
        if (scenList) scenList.classList.remove('active');
        var activeEdits = document.querySelectorAll('.btn-edit-toggle.active');
        for (var i = 0; i < activeEdits.length; i++) activeEdits[i].click();
        var searchEl = getEl('search');
        if (searchEl) searchEl.value = '';
        render();
    }

    function filterScenarios(isInitial) {
        if (isInitial === undefined) isInitial = false;
        var term = document.getElementById('search').value.toLowerCase();
        var list = document.getElementById('scen-scroll');

        if (term.length > 0) {
            var currentCatMatches = [];
            var otherCatMatches = [];

            Object.keys(storage).forEach(function (catName) {
                var matches = (storage[catName] || [])
                    .filter(function (item) { return item.scenario.toLowerCase().includes(term); })
                    .map(function (m) { var o = {}; for (var k in m) o[k] = m[k]; o.fromCat = catName; return o; });

                if (catName === currentCat) currentCatMatches = matches;
                else otherCatMatches = otherCatMatches.concat(matches);
            });

            filteredList = currentCatMatches.concat(otherCatMatches);
            if (!isInitial) document.getElementById('scen-list').classList.add('active');
        } else {
            filteredList = (storage[currentCat] || []).map(function (m) { var o = {}; for (var k in m) o[k] = m[k]; o.fromCat = currentCat; return o; });
        }

        list.innerHTML = '';

        if (filteredList.length === 0) {
            list.innerHTML = '<div class="dropdown-item" style="opacity:0.5; pointer-events:none;">No results found...</div>';
        } else {
            filteredList.forEach(function (item, i) {
                var div = document.createElement('div');
                div.className = 'dropdown-item';
                var isPriority = item.fromCat === currentCat;
                var catTag = '<small style="opacity:' + (isPriority ? '0.8' : '0.4') + '; float:right; color:' + (isPriority ? 'var(--accent)' : 'inherit') + '">' + escapeHtml(item.fromCat) + '</small>';
                div.innerHTML = '<span>' + escapeHtml(item.scenario) + '</span>' + catTag;
                div.onmouseenter = function () { highlightedIndex = i; updateVisualSelection(list); };
                div.onclick = function (e) { e.stopPropagation(); selectScenario(i); };
                list.appendChild(div);
            });
        }

        highlightedIndex = 0;
        updateVisualSelection(list);

        if (isInitial) {
            var lastScen = localStorage.getItem(STORAGE_KEYS.scen);
            var found = filteredList.findIndex(function (x) { return x.scenario === lastScen; });
            selectScenario(found !== -1 ? found : 0);
        }

        handleSecretCommands(term);
    }

    function updateVisualSelection(container) {
        var items = container.querySelectorAll('.dropdown-item');
        items.forEach(function (item, idx) {
            if (idx === highlightedIndex) {
                item.style.background = 'var(--accent)';
                item.style.color = 'var(--btn-text, #fff)';
                // Scroll within the dropdown container ONLY — never the whole page
                var itemTop = item.offsetTop;
                var itemBot = itemTop + item.offsetHeight;
                var contTop = container.scrollTop;
                var contBot = contTop + container.clientHeight;
                if (itemTop < contTop) {
                    container.scrollTop = itemTop;
                } else if (itemBot > contBot) {
                    container.scrollTop = itemBot - container.clientHeight;
                }
            } else {
                item.style.background = 'transparent';
                item.style.color = 'var(--text)';
            }
        });
    }

    function toggleDropdown(id, ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        var target = getEl(id);
        if (!target) return;

        var wasActive = target.classList.contains('active');

        // Close all other dropdowns
        var lists = document.querySelectorAll('.dropdown-list');
        for (var i = 0; i < lists.length; i++) lists[i].classList.remove('active');

        if (!wasActive) {
            target.classList.add('active');

            // If it's a theme or tone list, we don't need to do any filtering or focus
            if (id === 'theme-list' || id === 'tone-list') {
                highlightedIndex = 0;
                if (typeof updateAnyVisualSelection === 'function') {
                    updateAnyVisualSelection(target.querySelectorAll('.theme-menu-item'), true);
                }
                return;
            }

            var triggerInput = id === 'cat-list' ? getEl('cat-trigger') : getEl('scen-trigger');
            if (triggerInput) {
                triggerInput.value = '';
                triggerInput.focus();
                if (id === 'cat-list') filterCategoriesLocal(); else filterScenariosLocal();
            }
            highlightedIndex = 0;
            updateVisualSelection(target.querySelector('.dropdown-scroll-area') || target);
        }
    }
</script>
