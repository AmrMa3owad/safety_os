                        return txt.replace(w[0], typeof repl === 'function'
                            ? repl
                            : function (match) { return _wrapWord(match, repl); }
                        );
                    });
                });

                return out;
            }).join(' ');
        }).join('\n');

        /* 4. Post-processing cleanup */
        result = result
            .replace(/\s+\u2014\s+/g, ', ')           // em-dash  ( — ) → comma
            .replace(/\s+-\s+/g, ', ')               // hyphen  ( - ) → comma
            .replace(/\.\s*\./g, '.')                // double period
            .replace(/,\s*,/g, ',')                  // double comma
            .replace(/,\s*\./g, '.')                 // comma then period
            .replace(/[^\S\n]{2,}/g, ' ')            // collapse multiple spaces
            .replace(/[ \t]+\./g, '.')               // space before period
            .replace(/[ \t]+,/g, ',');               // space before comma

        /* 5. Opener variator */
        var opPat = /^(Thank you for|Thanks for|We appreciate you|Got your|We.ve received|Noted [—,.]|Message received)[^\n.!?]*[.!?]?/i;
        var opM = result.match(opPat);
        if (opM && opM[0].trim().split(/\s+/).length >= 3) {
            var o_match = opM[0];
            var o_opts = [o_match].concat(_OPENERS[tone]).sort(function () { return 0.5 - Math.random() });
            var o_chosen = o_opts[0] === o_match ? o_opts[1] : o_opts[0];
            if (!o_chosen) o_chosen = o_match;
            var o_span = '<span class="ph-swap" data-options="' + encodeURIComponent(JSON.stringify(o_opts)) + '">' + o_chosen + '</span>';
            result = result.replace(opPat, o_span);
        }

        /* 6. Closer variator */
        var clPat = /(Please do not hesitate|Feel free to|Should you have|Let us know if|Reach out anytime|Happy to (?:help|assist)|We remain here|We are always|Thank you for your understanding|We appreciate(?:your| you taking)|We hope this)[^\n]*$/i;
        var clM = result.match(clPat);
        if (clM && clM[0].trim().split(/\s+/).length >= 4) {
            var c_match = clM[0];
            var c_opts = [c_match].concat(_CLOSERS[tone]).sort(function () { return 0.5 - Math.random() });
            var c_chosen = c_opts[0] === c_match ? c_opts[1] : c_opts[0];
            if (!c_chosen) c_chosen = c_match;
            var c_span = '<span class="ph-swap" data-options="' + encodeURIComponent(JSON.stringify(c_opts)) + '">' + c_chosen + '</span>';
            result = result.replace(clPat, c_span);
        }

        /* 7. Capitalisation */
        result = result.replace(/([.!?]\s+(?:<[^>]+>\s*)*)([a-z])/g, function (m, p, l) { return p + l.toUpperCase(); });
        result = result.replace(/(^|\n|<br>)(?:\s*<[^>]+>)*\s*([a-z])/g, function (m, p1, l) {
            // Capitalize the first letter found at the start of a block, skipping any HTML tags.
            // Using a simple split to avoid complex capture groups destroying the replacement.
            var idx = m.lastIndexOf(l);
            return m.substring(0, idx) + l.toUpperCase();
        });

        /* 8. Restore links and protected blocks */
        var finalHtml = result
            .replace(/\n/g, '<br>')
            .replace(/\[\[PB(\d+)\]\]/g, function (m, n) { return protectedBlocks[parseInt(n)] || m; });

        srEl.innerHTML = finalHtml;
        showToast('✨ ' + toneLabel + ' tone applied', 'success');
        animateCursor('success');
    }

    function undoParaphrase() {
        var srEl = document.getElementById('sr');
        if (!srEl || !_lastSrHtml) return showToast('Nothing to undo!', 'error');
        srEl.innerHTML = _lastSrHtml;
        _lastSrHtml = null;
        showToast('Undone', 'success');
    }

    /* ══════════════════════════════════════════════════════════════
       DEEPL HIGHLIGHT LOGIC
       ══════════════════════════════════════════════════════════════ */
    let _activeSwapEl = null;

    document.addEventListener('click', function (e) {
        // Close menu if clicking outside
        var menu = document.getElementById('ph-menu');
        if (menu && !e.target.closest('#ph-menu') && !e.target.closest('.ph-swap')) {
            menu.remove();
            if (_activeSwapEl) _activeSwapEl.classList.remove('active');
            _activeSwapEl = null;
        }

        // Handle clicking a highlight
        var swapTarget = e.target.closest('.ph-swap');
        if (swapTarget) {
            e.preventDefault();

            // Clean up existing
            if (menu) menu.remove();
            if (_activeSwapEl) _activeSwapEl.classList.remove('active');

            _activeSwapEl = swapTarget;
            _activeSwapEl.classList.add('active');

            try {
                var optsStr = decodeURIComponent(_activeSwapEl.getAttribute('data-options'));
                var opts = JSON.parse(optsStr);

                // Build menu
                menu = document.createElement('div');
                menu.id = 'ph-menu';
                menu.className = 'synonym-menu';
                highlightedIndex = 0; // Initialize for keyboard navigation

                opts.forEach(function (opt, idx) {
                    var item = document.createElement('div');
                    item.className = 'synonym-item';
                    item.innerText = opt;
                    item.onmouseenter = function () {
                        highlightedIndex = idx;
                        if (typeof updateAnyVisualSelection === 'function') {
                            updateAnyVisualSelection(menu.querySelectorAll('.synonym-item'), true);
                        }
                    };
                    item.onclick = function (ev) {
                        ev.stopPropagation();
                        // Update span text while preserving the element's class + data-options
                        _activeSwapEl.childNodes.forEach(function (n) {
                            if (n.nodeType === Node.TEXT_NODE) n.remove();
                        });
                        _activeSwapEl.insertBefore(document.createTextNode(opt), _activeSwapEl.firstChild);

                        // Resort options to bring chosen one to front
                        var newOpts = [opt].concat(opts.filter(function (o) { return o !== opt; }));
                        _activeSwapEl.setAttribute('data-options', encodeURIComponent(JSON.stringify(newOpts)));

                        // Cleanup
                        menu.remove();
                        _activeSwapEl.classList.remove('active');
                        _activeSwapEl = null;

                        // Fire input on the actual parent card (was incorrectly hardcoded to 'sr')
                        var parentCard = ev.target.closest
                            ? (document.querySelector('#sr,#in,#en,#rn') || document.getElementById('sr'))
                            : document.getElementById('sr');
                        // Find the card that contains this swap target more precisely
                        var cards = ['sr','in','en','rn'];
                        for (var ci = 0; ci < cards.length; ci++) {
                            var cel = document.getElementById(cards[ci]);
                            if (cel && typeof cel.contains === 'function' && cel.contains(swapTarget)) {
                                parentCard = cel; break;
                            }
                        }
                        if (parentCard) parentCard.dispatchEvent(new Event('input', { bubbles: true }));
                    };
                    menu.appendChild(item);
                });

                // Append to body and position using absolute + scroll offsets.
                // (position:fixed breaks when any ancestor has a CSS transform/filter)
                document.body.appendChild(menu);
                if (typeof updateAnyVisualSelection === 'function') {
                    updateAnyVisualSelection(menu.querySelectorAll('.synonym-item'), true);
                }
                var rect = swapTarget.getBoundingClientRect();
                var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
                var scrollLeft = window.scrollX || document.documentElement.scrollLeft || 0;

                menu.style.position = 'absolute';
                menu.style.zIndex = '99999';

                // Measure menu size after append
                var menuH = menu.offsetHeight || 180;
                var menuW = menu.offsetWidth || 180;
                var spaceBelow = window.innerHeight - rect.bottom;

                // Vertical: prefer below the word, flip above if it clips the bottom
                if (spaceBelow >= menuH + 8 || spaceBelow >= window.innerHeight / 2) {
                    menu.style.top = (rect.bottom + scrollTop + 8) + 'px';
                    menu.style.bottom = 'auto';
                } else {
                    menu.style.top = (rect.top + scrollTop - menuH - 8) + 'px';
                    menu.style.bottom = 'auto';
                }

                // Horizontal: clamp so menu doesn't overflow the right edge
                var left = rect.left + scrollLeft;
                left = Math.max(8 + scrollLeft, Math.min(left, scrollLeft + window.innerWidth - menuW - 12));
                menu.style.left = left + 'px';

            } catch (err) {
                console.error("Failed to parse paraphrase options", err);
            }
        }
    });

    // Reposition synonym menu on scroll so it stays anchored to its word
    document.addEventListener('scroll', function () {
        var menu = document.getElementById('ph-menu');
        if (!menu || !_activeSwapEl) return;
        requestAnimationFrame(function () {
            var rect = _activeSwapEl.getBoundingClientRect();
            var scrollTop = window.scrollY || document.documentElement.scrollTop || 0;
            var scrollLeft = window.scrollX || document.documentElement.scrollLeft || 0;
            var menuH = menu.offsetHeight || 180;
            var menuW = menu.offsetWidth || 180;
            var spaceBelow = window.innerHeight - rect.bottom;
            if (spaceBelow >= menuH + 8 || spaceBelow >= window.innerHeight / 2) {
                menu.style.top = (rect.bottom + scrollTop + 8) + 'px';
            } else {
                menu.style.top = (rect.top + scrollTop - menuH - 8) + 'px';
            }
            var left = rect.left + scrollLeft;
            left = Math.max(8 + scrollLeft, Math.min(left, scrollLeft + window.innerWidth - menuW - 12));
            menu.style.left = left + 'px';
        });
    }, true);

</script>
