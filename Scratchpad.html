<script>
    /**
     * Scratchpad — Keep-style notes engine
     * Saves to localStorage, handles masonry layout, pinning, colors, and inline editing.
     */

    var _notes = [];
    var _selectedNoteColor = 'default';
    var _editingNoteId = null;

    // The 5 colors that match the create area exactly
    var NOTE_COLORS = [
        { key: 'default', label: 'Default' },
        { key: 'red', label: 'Urgent' },
        { key: 'yellow', label: 'Warning' },
        { key: 'green', label: 'Resolved' },
        { key: 'blue', label: 'Info' }
    ];

    document.addEventListener('DOMContentLoaded', function () {
        loadNotes();
        setupNoteInputs();
    });

    // ----------------------------------------------------
    // INITIALIZATION & LOADING
    // ----------------------------------------------------
    function loadNotes() {
        try {
            var saved = localStorage.getItem('liteos_scratch_notes');
            _notes = saved ? JSON.parse(saved) : [];
            if (!saved) migrateOldTextarea();
        } catch (e) {
            console.error('Failed to load notes', e);
            _notes = [];
        }
        renderNotes();
    }

    function saveNotes() {
        try {
            localStorage.setItem('liteos_scratch_notes', JSON.stringify(_notes));
        } catch (e) {
            showToast('Error saving notes!', 'error');
        }
    }

    // ----------------------------------------------------
    // CREATION UI
    // ----------------------------------------------------
    function setupNoteInputs() {
        var bodyInput = document.getElementById('new-note-body');
        if (bodyInput) {
            bodyInput.addEventListener('input', function () {
                this.style.height = 'auto';
                this.style.height = this.scrollHeight + 'px';
            });
            bodyInput.addEventListener('keydown', function (e) {
                if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); saveNewNote(); }
            });
        }
    }

    function selectNoteColor(color, btnEl) {
        _selectedNoteColor = color;
        document.querySelectorAll('.scratch-create-actions .color-btn').forEach(function (b) {
            b.classList.remove('active');
        });
        if (btnEl) btnEl.classList.add('active');
    }

    // ----------------------------------------------------
    // CRUD
    // ----------------------------------------------------
    function saveNewNote() {
        var titleEl = document.getElementById('new-note-title');
        var bodyEl = document.getElementById('new-note-body');
        var title = titleEl.value.trim();
        var body = bodyEl.value.trim();
        if (!title && !body) return;

        var newNote = {
            id: 'note_' + Date.now(),
            title: title,
            body: body,
            color: _selectedNoteColor,
            pinned: false,
            timestamp: new Date().toISOString()
        };
        _notes.unshift(newNote);
        saveNotes();
        renderNotes(newNote.id);

        titleEl.value = '';
        bodyEl.value = '';
        bodyEl.style.height = '48px';
        var defaultBtn = document.querySelector('.color-btn[data-color="default"]');
        selectNoteColor('default', defaultBtn);
        showToast('Note added', 'success');
    }

    function deleteNote(id) {
        if (_editingNoteId === id) _editingNoteId = null;
        _notes = _notes.filter(function (n) { return n.id !== id; });
        saveNotes();
        renderNotes();
    }

    function togglePinNote(id) {
        var note = _notes.find(function (n) { return n.id === id; });
        if (note) { note.pinned = !note.pinned; saveNotes(); renderNotes(); }
    }

    function toggleNoteEdit(id) {
        // Save any in-progress edit before switching
        if (_editingNoteId && _editingNoteId !== id) saveNoteEdit(_editingNoteId);
        _editingNoteId = (_editingNoteId === id) ? null : id;
        renderNotes();
        // Focus body textarea after edit opens
        if (_editingNoteId === id) {
            setTimeout(function () {
                var bodyEl = document.getElementById('edit-body-' + id);
                if (bodyEl) bodyEl.focus();
            }, 30);
        }
    }

    function saveNoteEdit(id) {
        var note = _notes.find(function (n) { return n.id === id; });
        if (!note) return;
        // Read values from the live DOM elements
        var titleEl = document.getElementById('edit-title-' + id);
        var bodyEl = document.getElementById('edit-body-' + id);
        if (titleEl) note.title = titleEl.value.trim();
        if (bodyEl) note.body = bodyEl.value.trim();
        _editingNoteId = null;
        saveNotes();
        renderNotes();
        showToast('Note updated ✓', 'success');
    }

    function changeNoteColor(id, color) {
        var note = _notes.find(function (n) { return n.id === id; });
        if (!note) return;
        note.color = color;
        saveNotes();
        // Apply in-place on the card without full re-render
        var card = document.querySelector('.note-card[data-id="' + id + '"]');
        if (card) {
            card.setAttribute('data-color', color);
            card.querySelectorAll('.edit-color-btn').forEach(function (s) {
                s.classList.toggle('active', s.getAttribute('data-color') === color);
            });
        }
    }

    // ----------------------------------------------------
    // RENDERING
    // ----------------------------------------------------
    function renderNotes(newNoteId) {
        var pinnedGrid = document.getElementById('pinned-grid');
        var notesGrid = document.getElementById('notes-grid');
        var pinnedSection = document.getElementById('pinned-notes-section');
        var othersLabel = document.getElementById('others-label');
        var emptyState = document.getElementById('scratch-empty');

        pinnedGrid.innerHTML = '';
        notesGrid.innerHTML = '';

        var pinned = _notes.filter(function (n) { return n.pinned; });
        var unpinned = _notes.filter(function (n) { return !n.pinned; });

        if (_notes.length === 0) {
            emptyState.style.display = 'flex';
            pinnedSection.style.display = 'none';
            othersLabel.style.display = 'none';
        } else {
            emptyState.style.display = 'none';
            pinnedSection.style.display = pinned.length > 0 ? 'block' : 'none';
            othersLabel.style.display = pinned.length > 0 ? 'block' : 'none';
        }

        pinned.forEach(function (n) {
            pinnedGrid.appendChild(createNoteElement(n, n.id === newNoteId));
        });
        unpinned.forEach(function (n) {
            notesGrid.appendChild(createNoteElement(n, n.id === newNoteId));
        });
    }

    function createNoteElement(note, isNew) {
        var isEditing = (_editingNoteId === note.id);
        var div = document.createElement('div');
        div.className = 'note-card' + (isNew ? ' pulse' : '') + (isEditing ? ' note-editing' : '');
        div.setAttribute('data-color', note.color);
        div.setAttribute('data-id', note.id);
        if (isNew) setTimeout(function () { div.classList.remove('pulse'); }, 1100);

        var dateStr = new Date(note.timestamp).toLocaleDateString(undefined, {
            month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        if (isEditing) {
            // ── EDIT MODE: build HTML with empty value attrs, set via JS below ──
            var swatchesHtml = NOTE_COLORS.map(function (c) {
                var active = note.color === c.key ? ' active' : '';
                return '<button class="edit-color-btn' + active + '" data-color="' + c.key + '" '
                    + 'onclick="changeNoteColor(\'' + note.id + '\',\'' + c.key + '\')" '
                    + 'title="' + c.label + '"></button>';
            }).join('');

            div.innerHTML =
                '<div class="note-edit-wrap">'
                + '<input id="edit-title-' + note.id + '" class="note-edit-title" type="text" placeholder="Title (optional)">'
                + '<textarea id="edit-body-' + note.id + '" class="note-edit-body" placeholder="Note..." rows="4"></textarea>'
                + '<div class="note-color-row">' + swatchesHtml + '</div>'
                + '<div class="note-edit-btns">'
                + '<button class="note-save-btn" onclick="saveNoteEdit(\'' + note.id + '\')">💾 Save</button>'
                + '<button class="note-cancel-btn" onclick="toggleNoteEdit(\'' + note.id + '\')">✕ Cancel</button>'
                + '</div>'
                + '</div>'
                + '<div class="note-actions">'
                + '<div class="note-action-btn ' + (note.pinned ? 'pinned' : '') + '" onclick="togglePinNote(\'' + note.id + '\')" title="Pin">' + (note.pinned ? '★' : '☆') + '</div>'
                + '<div class="note-action-btn note-action-edit active-edit" onclick="toggleNoteEdit(\'' + note.id + '\')" title="Close edit">✎</div>'
                + '<div class="note-action-btn" onclick="deleteNote(\'' + note.id + '\')" title="Delete">✕</div>'
                + '</div>';

            // Set input/textarea VALUES via JS to avoid any HTML-escaping issues
            var titleInput = div.querySelector('#edit-title-' + note.id);
            var bodyInput = div.querySelector('#edit-body-' + note.id);
            if (titleInput) titleInput.value = note.title || '';
            if (bodyInput) bodyInput.value = note.body || '';

        } else {
            // ── VIEW MODE ──
            var safeTitle = escapeHtml(note.title || '');
            var safeBody = escapeHtml(note.body || '');

            div.innerHTML =
                '<div class="note-content-wrap">'
                + (safeTitle ? '<div class="note-title">' + safeTitle + '</div>' : '')
                + (safeBody ? '<div class="note-body">' + safeBody + '</div>' : '')
                + '</div>'
                + '<div class="note-date">' + dateStr + '</div>'
                + '<div class="note-actions">'
                + '<div class="note-action-btn ' + (note.pinned ? 'pinned' : '') + '" onclick="togglePinNote(\'' + note.id + '\')" title="Pin">' + (note.pinned ? '★' : '☆') + '</div>'
                + '<div class="note-action-btn" onclick="toggleNoteEdit(\'' + note.id + '\')" title="Edit">✎</div>'
                + '<div class="note-action-btn" onclick="deleteNote(\'' + note.id + '\')" title="Delete">✕</div>'
                + '</div>';
        }

        return div;
    }

    // ----------------------------------------------------
    // MIGRATION UTIL
    // ----------------------------------------------------
    function migrateOldTextarea() {
        var old = localStorage.getItem('liteos_scratchpad');
        if (old && old.trim()) {
            _notes.push({
                id: 'note_migrated', title: 'Recovered Note', body: old,
                color: 'default', pinned: true, timestamp: new Date().toISOString()
            });
            localStorage.removeItem('liteos_scratchpad');
        }
    }
</script>
