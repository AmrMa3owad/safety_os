        color: var(--btn-text, #fff);
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* ─── Markdown inside bot bubbles ─────────────────────────────── */
    .chat-message.bot .chat-bubble strong {
        color: var(--accent2);
        font-weight: 700;
    }

    .chat-message.bot .chat-bubble table {
        font-size: 12px;
        border-collapse: collapse;
        width: 100%;
        margin: 8px 0;
        background: var(--glass2);
        border-radius: 8px;
        overflow: hidden;
    }

    .chat-message.bot .chat-bubble table td,
    .chat-message.bot .chat-bubble table th {
        padding: 5px 8px;
        border: 1px solid var(--glass-stroke);
    }

    .chat-message.bot .chat-bubble table th {
        background: var(--surface2);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
    }

    .chat-message.bot .chat-bubble hr {
        border: none;
        border-top: 1px solid var(--glass-stroke);
        margin: 10px 0;
    }

    .chat-message.bot .chat-bubble code {
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
    }

    .phoenix-status-dot {
        width: 8px;
        height: 8px;
        background: #10B981;
        border-radius: 50%;
        box-shadow: 0 0 6px #10B981;
        animation: phoenix-pulse 2s infinite;
        flex-shrink: 0;
    }

    @keyframes phoenix-pulse {

        0%,
        100% {
            box-shadow: 0 0 4px #10B981, 0 0 0 0 rgba(16, 185, 129, 0.4);
        }

        50% {
            box-shadow: 0 0 8px #10B981, 0 0 0 6px rgba(16, 185, 129, 0);
        }
    }

    .chat-input-area {
        display: flex;
        padding: 12px;
        background: var(--surface2);
        border-top: 1px solid var(--glass-border);
        gap: 8px;
        align-items: flex-end;
    }

    .chat-input {
        flex: 1;
        background: var(--surface);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 10px 14px;
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        resize: none;
        min-height: 40px;
        max-height: 120px;
        line-height: 1.4;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
    }

    .chat-send-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        color: var(--accent2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        transition: 0.2s;
        flex-shrink: 0;
    }

    .chat-send-btn:hover {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Typing indicator */
    .typing-indicator .chat-bubble {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 14px;
    }

    .typing-indicator .dot {
        width: 6px;
        height: 6px;
        background: var(--text-muted);
        border-radius: 50%;
        animation: chat-bounce 1.4s infinite ease-in-out both;
    }

    .typing-indicator .dot:nth-child(1) {
        animation-delay: -0.32s;
    }

    .typing-indicator .dot:nth-child(2) {
        animation-delay: -0.16s;
    }

    @keyframes chat-bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
        }

        40% {
            transform: scale(1);
        }
    }

    /* =====================================================
       FOOTER
       ===================================================== */
    .app-footer {
        margin-top: clamp(24px, 3vw, 40px);
        padding: clamp(12px, 2vw, 20px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--glass-border);
        opacity: .6;
        font-size: clamp(10px, 1.2vw, 12px);
        font-weight: 700;
        color: var(--text-muted);
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */
    @media (max-width: 1100px) {

        .in-box,
        .side-stack {
            grid-column: span 6;
        }

        #panel-analytics,
        #panel-assistant { width: calc(100vw - 120px); right: 100px; }
        #panel-scratch { left: 20px; width: calc(100vw - 40px); }
        #panel-calculator { right: 100px; bottom: 100px; }
    }

    @media (max-width: 600px) {
        .automation-tile {
            flex-direction: column;
            height: auto;
            min-height: 48px;
        }

        .ticket-controls {
            margin-left: 0;
        }

        .dashboard-kpis {
            grid-template-columns: repeat(2, 1fr);
        }

        .heatmap-grid {
            grid-template-columns: repeat(5, 1fr);
        }

        .best-worst-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (min-width: 1800px) {
        .app-viewport {
            max-width: 1600px;
        }
    }

    /* ── Scroll Navigation Buttons ── */
    #scroll-nav {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 9000;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .scroll-nav-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--glass-stroke);
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 16px var(--accent-glow), 0 2px 8px rgba(0, 0, 0, 0.3);
        transition: opacity 0.25s ease, transform 0.18s ease, box-shadow 0.18s ease;
        padding: 0;
        outline: none;
    }

    .scroll-nav-btn:hover {
        transform: scale(1.15);
        box-shadow: 0 6px 24px var(--accent-glow), 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .scroll-nav-btn:active {
        transform: scale(0.95);
    }

    .scroll-nav-btn svg {
        flex-shrink: 0;
    }

    /* ── Advanced Color Studio Theme Picker ─────────────────── */
    .theme-palette-panel {
        display: none;
        position: fixed;
        top: 56px;
        right: 16px;
        z-index: 99000;
        width: 280px;
        background: var(--surface);
        border: 1px solid var(--glass-stroke);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--glass-stroke),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        overflow: hidden;
        animation: tpSlideIn 0.22s cubic-bezier(.34, 1.36, .64, 1) both;
    }

    .theme-palette-panel.tp-open {
        display: block;
    }

    @keyframes tpSlideIn {
        from {
            opacity: 0;
            transform: translateY(-12px) scale(0.96);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .tp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 0;
    }

    .tp-title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.3px;
        color: var(--text);
    }

    .tp-close {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
        transition: background 0.15s, color 0.15s;
    }

    .tp-close:hover {
        background: var(--glass2);
        color: var(--text);
    }

    /* ── Color Wheel ── */
    .tp-wheel-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        margin: 14px auto 0;
        cursor: crosshair;
    }

    #tp-wheel {
        display: block;
        border-radius: 50%;
        cursor: crosshair;
    }

    #tp-wheel-cursor {
        position: absolute;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.4);
        pointer-events: none;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        transition: box-shadow 0.15s;
    }

    /* ── Brightness strip ── */
    .tp-strip-wrap {
        padding: 10px 18px 0;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .tp-strip-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        width: 62px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .tp-strip-track {
        flex: 1;
        height: 10px;
        border-radius: 99px;
        position: relative;
        cursor: ew-resize;
        background: linear-gradient(to right, #000, currentColor, #fff);
        border: 1px solid var(--glass-stroke);
    }

    .tp-strip-thumb {
        position: absolute;
        top: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid rgba(0, 0, 0, 0.35);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        transform: translate(-50%, -50%);
        pointer-events: none;
        left: 50%;
        transition: left 0.05s linear;
    }

    /* ── Mode toggle ── */
    .tp-mode-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px 0;
    }

    .tp-mode-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        width: 62px;
        flex-shrink: 0;
