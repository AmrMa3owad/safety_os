<style>
    /* =====================================================
       SafetyOS v5.0 — Full Glassmorphism Design System
       ===================================================== */

    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    /* ── Color scheme (affects native scrollbars) ── */
    html {
        font-size: clamp(12px, 1vw + 12px, 18px);
        color-scheme: light;
    }

    [data-theme='dark'] {
        color-scheme: dark;
    }

    html,
    body {
        background: var(--bg);
    }

    :root {
        --bg: #F0F4F9;
        --surface: #FFFFFF;
        --surface2: #EAF0F8;
        --glass: rgba(255, 255, 255, 0.60);
        --glass2: rgba(255, 255, 255, 0.30);
        --glass-border: rgba(255, 255, 255, 0.90);
        --glass-stroke: rgba(0, 0, 0, 0.07);
        --glass-blur: 24px;
        --text: #0F172A;
        --text-muted: #64748B;
        --accent: #6C3FF4;
        --accent2: #00C9FF;
        --accent-glow: rgba(108, 63, 244, 0.25);
        --accent2-glow: rgba(0, 201, 255, 0.25);
        --success: #10B981;
        --warning: #F59E0B;
        --error: #EF4444;
        --scroll: #CBD5E1;
        --shine: rgba(255, 255, 255, 0.12);
        --r: 108;
        --g: 63;
        --b: 244;
    }

    [data-theme='dark'] {
        --bg: #06060f;
        --surface: #0c0c1e;
        --surface2: #111128;
        --glass: rgba(255, 255, 255, 0.04);
        --glass2: rgba(255, 255, 255, 0.02);
        --glass-border: rgba(255, 255, 255, 0.10);
        --glass-stroke: rgba(255, 255, 255, 0.08);
        --text: #F0F4FF;
        --text-muted: #8892A4;
        --accent: #7C5CFC;
        --accent2: #00D4FF;
        --accent-glow: rgba(124, 92, 252, 0.30);
        --accent2-glow: rgba(0, 212, 255, 0.20);
        --success: #10B981;
        --warning: #F59E0B;
        --error: #EF4444;
        --scroll: #1E1E3A;
        --shine: rgba(255, 255, 255, 0.06);
        --r: 124;
        --g: 92;
        --b: 252;
    }

    /* ── Reset ── */
    *,
    *::before,
    *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        cursor: none !important;
    }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        transition: background 0.6s ease, color 0.4s ease;
        min-height: 100vh;
    }

    /* Deep cosmic background */
    [data-theme='dark'] body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
            radial-gradient(ellipse 80% 60% at 20% 0%, rgba(var(--r, 124), var(--g, 92), var(--b, 252), 0.12) 0%, transparent 60%),
            radial-gradient(ellipse 60% 50% at 80% 100%, rgba(var(--r, 0), var(--g, 212), var(--b, 255), 0.08) 0%, transparent 60%),
            var(--bg);
        pointer-events: none;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }

    ::-webkit-scrollbar-track {
        background: var(--bg);
    }

    [data-theme='dark'] ::-webkit-scrollbar-track {
        background: #06060f;
    }

    ::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 160, 0.25);
        border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    [data-theme='dark'] ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
    }

    [data-theme='dark'] ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
    }

    /* =====================================================
       CURSOR — Glass Prism Arrow
       ===================================================== */

    /* Hide native cursor everywhere so the custom one is the only one visible */
    *,
    *::before,
    *::after {
        cursor: none !important;
    }

    /* Re-enable native cursor inside editable card boxes — hides our custom cursor there
       so the native blinking text caret + I-beam work correctly without overlap */
    .card-content.editable,
    .card-content.editable * {
        cursor: text !important;
    }

    /* ── Custom cursor hidden during card editing ── */
    #custom-cursor.cur-editing { opacity: 0 !important; }

    /* ════════════════════════════════════════════════════
       ✦  GLASSMORPHISM CURSOR  –  Ultimate Edition  ✦
       ════════════════════════════════════════════════════ */

    /* ── Container: always at mouse hotspot (tip = 0,0) ── */
    #custom-cursor {
        position: fixed;
        top: 0; left: 0;
        width: 26px;
        height: 30px;
        pointer-events: none;
        z-index: 2147483647;
        will-change: transform;
        filter: drop-shadow(0 4px 12px var(--accent-glow))
                drop-shadow(0 1px 4px rgba(0,0,0,0.5));
        transition: filter 0.25s ease;
    }

    /* ── DEFAULT ARROW: frosted prism — adapts to theme accent ── */
    #custom-cursor .cur-arrow {
        position: absolute;
        inset: 0;
        clip-path: polygon(0 0, 55% 100%, 40% 62%, 100% 38%);
        background: linear-gradient(145deg,
            rgba(255, 255, 255, 0.80) 0%,
            rgba(var(--r), var(--g), var(--b), 0.55) 25%,
            rgba(var(--r), var(--g), var(--b), 0.40) 55%,
            rgba(var(--r), var(--g), var(--b), 0.25) 80%,
            rgba(255, 255, 255, 0.10) 100%);
        /* NOTE: No backdrop-filter — fixed+backdrop-filter forces full page recomposite on scroll */
        border-radius: 3px;
        transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1),
                    filter 0.18s ease;
    }
    /* Light mode: slightly less transparent for contrast on bright backgrounds */
    :root:not([data-theme='dark']) #custom-cursor .cur-arrow {
        background: linear-gradient(145deg,
            rgba(255, 255, 255, 0.95) 0%,
            rgba(var(--r), var(--g), var(--b), 0.70) 25%,
            rgba(var(--r), var(--g), var(--b), 0.55) 55%,
            rgba(var(--r), var(--g), var(--b), 0.35) 80%,
            rgba(255, 255, 255, 0.20) 100%);
    }

    /* Iridescent prismatic edge stroke — static conic gradient (no continuous filter animation) */
    #custom-cursor::before {
        content: '';
        position: absolute;
        inset: 0;
        clip-path: polygon(0 0, 55% 100%, 40% 62%, 100% 38%);
        background: conic-gradient(from 135deg,
            var(--accent2), var(--accent), #00d4ff, var(--success), var(--accent2));
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        padding: 1.5px;
        border-radius: 3px;
        opacity: 0.85;
        /* ⚠︎ prism-shift removed: filter:hue-rotate on position:fixed triggers GPU recomposite on scroll */
    }

    /* Inner glass light streak (reflection) */
    #custom-cursor::after {
        content: '';
        position: absolute;
        /* Tiny bright streak near the tip */
        top: 1px; left: 1px;
        width: 7px;
        height: 3px;
        background: rgba(255,255,255,0.75);
        clip-path: polygon(0 0, 100% 30%, 80% 100%, 0 70%);
        border-radius: 2px;
        filter: blur(0.5px);
        opacity: 0.65;
        pointer-events: none;
    }

    /* ── CLICK — compress ── */
    #custom-cursor.cur-click { filter:
        drop-shadow(0 2px 6px rgba(var(--r), var(--g), var(--b), 0.5))
        drop-shadow(0 0 2px rgba(0,0,0,0.6));
    }
    #custom-cursor.cur-click .cur-arrow {
        transform: scale(0.84);
        filter: brightness(1.2);
    }
    #custom-cursor.cur-click::before { animation: none; }

    /* ── HOVER — glow halo behind arrow ── */
    #custom-cursor.cur-hover {
        filter: drop-shadow(0 0 14px rgba(var(--r), var(--g), var(--b), 0.7))
                drop-shadow(0 0 28px var(--accent2-glow));
    }
    #custom-cursor.cur-hover .cur-arrow {
        transform: scale(1.12);
        background: linear-gradient(145deg,
            rgba(255, 255, 255, 0.95) 0%,
            rgba(var(--r), var(--g), var(--b), 0.75) 25%,
            rgba(var(--r), var(--g), var(--b), 0.60) 55%,
            rgba(var(--r), var(--g), var(--b), 0.45) 80%,
            rgba(255, 255, 255, 0.25) 100%);
    }

    /* ── SUCCESS — emerald glass ── */
    #custom-cursor.cur-success {
        filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.8))
                drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }
    #custom-cursor.cur-success .cur-arrow {
        background: linear-gradient(145deg,
            rgba(255,255,255,0.8)       0%,
            rgba(100,240,180,0.7)      30%,
            rgba(16, 185, 129, 0.65)   65%,
            rgba(6,   78,  59, 0.4)   100%);
        filter: brightness(1.2) saturate(1.4);
        animation: success-pulse 0.5s ease-out;
    }
    @keyframes success-pulse {
        0%   { transform: scale(0.9); filter: brightness(2);   }
        60%  { transform: scale(1.12);                         }
        100% { transform: scale(1);   filter: brightness(1.2); }
    }

    /* ── ERROR — ruby glass + shiver ── */
    #custom-cursor.cur-error {
        filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.85))
                drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }
    #custom-cursor.cur-error .cur-arrow {
        background: linear-gradient(145deg,
            rgba(255,200,200,0.85) 0%,
            rgba(239, 68, 68,0.75) 40%,
            rgba(160,  20, 20,0.6) 80%,
            rgba(255,100,100,0.2) 100%);
        filter: brightness(1.2) saturate(1.6);
        animation: cursor-shiver 0.35s ease forwards;
    }

    @keyframes cursor-shiver {
        0%   { transform: translateX(-3px); }
        25%  { transform: translateX(3px); }
        50%  { transform: translateX(-2px); }
        75%  { transform: translateX(2px); }
        100% { transform: translateX(0); }
    }

    /* ════ LINK STATE — triple glass rings — theme-adaptive ════ */
    #custom-cursor.cur-link .cur-arrow {
        clip-path: none;
        top: -14px; right: auto; bottom: auto; left: -14px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(var(--r), var(--g), var(--b), 0.08);
        border: 1.5px solid rgba(var(--r), var(--g), var(--b), 0.55);
        box-shadow:
            0 0 0 0.5px rgba(255,255,255,0.2) inset,
            0 0 12px rgba(var(--r), var(--g), var(--b), 0.5),
            0 0 30px var(--accent2-glow);
        transform: none;
        animation: link-ring-breathe 1.2s ease-in-out infinite;
    }

    @keyframes link-ring-breathe {
        0%, 100% { transform: scale(1);    opacity: 1;   }
        50%       { transform: scale(1.12); opacity: 0.8; }
    }

    /* Outer diffuse chromatic ring */
    #custom-cursor.cur-link::before {
        display: block;
        content: '';
        position: absolute;
        top: -22px; right: auto; bottom: auto; left: -22px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: transparent;
        border: 1px solid rgba(var(--r), var(--g), var(--b), 0.2);
        box-shadow: 0 0 20px rgba(var(--r), var(--g), var(--b), 0.15);
        animation: link-outer-spin 3s linear infinite;
        clip-path: none;
        backdrop-filter: none;
        mask: none;
        padding: 0;
    }

    @keyframes link-outer-spin {
        from { transform: rotate(0deg); border-color: rgba(var(--r),var(--g),var(--b),0.2); }
        33%  { border-color: var(--accent2-glow); }
        66%  { border-color: rgba(var(--r),var(--g),var(--b),0.15); }
        to   { transform: rotate(360deg); border-color: rgba(var(--r),var(--g),var(--b),0.2); }
    }

    /* Chromatic center dot */
    #custom-cursor.cur-link::after {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: radial-gradient(circle,
            rgba(255,255,255,0.95) 0%,
            var(--accent)          50%,
            var(--accent2)        100%);
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px var(--accent), 0 0 16px var(--accent2-glow);
        animation: cur-dot-pulse 0.9s ease-in-out infinite;
    }

    @keyframes cur-dot-pulse {
        0%, 100% { transform: translate(-50%,-50%) scale(1);   opacity: 1;   }
        50%       { transform: translate(-50%,-50%) scale(1.8); opacity: 0.6; }
    }

    /* ════ TEXT STATE — glass serif I-beam — theme-adaptive ════ */
    #custom-cursor.cur-text .cur-arrow {
        clip-path: none;
        top: -13px; right: auto; bottom: auto; left: -1px;
        width: 2px; height: 26px;
        border-radius: 1px;
        background: linear-gradient(180deg,
            rgba(255,255,255,0.6)   0%,
            var(--accent)          30%,
            var(--accent2)         70%,
            rgba(255,255,255,0.4) 100%);
        transform: none;
        box-shadow:
            0 0 6px var(--accent),
            0 0 14px var(--accent2-glow);
        filter: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        animation: ibeam-blink 1.1s ease-in-out infinite;
    }

    /* Top serif */
    #custom-cursor.cur-text::before {
        display: block;
        content: '';
        position: absolute;
        top: -13px; left: -5px;
        width: 12px; height: 2px;
        background: linear-gradient(90deg,
            transparent, rgba(255,255,255,0.5), var(--accent), rgba(255,255,255,0.5), transparent);
        border-radius: 1px;
        box-shadow: 0 0 6px var(--accent);
        clip-path: none; mask: none; padding: 0; backdrop-filter: none;
    }
    /* Bottom serif */
    #custom-cursor.cur-text::after {
        content: '';
        position: absolute;
        top: 13px; left: -5px;
        width: 12px; height: 2px;
        background: linear-gradient(90deg,
            transparent, rgba(255,255,255,0.5), var(--accent2), rgba(255,255,255,0.5), transparent);
        border-radius: 1px;
        box-shadow: 0 0 6px var(--accent2-glow);
    }

    @keyframes ibeam-blink {
        0%, 45%, 100% { opacity: 1; }
        55%, 90%      { opacity: 0.55; }
    }

    /* ════ SCROLL STATE — subtle glow only (no positioned ring that can freeze during scrollbar drag) ════ */
    #custom-cursor.cur-scroll {
        filter: drop-shadow(0 0 10px rgba(var(--r), var(--g), var(--b), 0.6))
                drop-shadow(0 0 20px var(--accent2-glow));
    }
    /* Keep arrow shape — just brighter */
    #custom-cursor.cur-scroll .cur-arrow {
        filter: brightness(1.3) saturate(1.2);
        transform: scale(1.08);
    }
    /* Hide the ::before prism stroke in scroll state so it doesn't interfere */
    #custom-cursor.cur-scroll::before { display: none; }
    /* No ::after needed either */
    #custom-cursor.cur-scroll::after  { display: none; }


    /* ════ MIDDLE-CLICK STATE — glass sphere (no backdrop-filter) ════ */
    #custom-cursor.cur-middle { width: 40px; height: 40px; }

    #custom-cursor.cur-middle .cur-arrow {
        clip-path: none;
        inset: 0;
        width: 40px; height: 40px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%,
            rgba(255,255,255,0.6) 0%,
            rgba(var(--r), var(--g), var(--b), 0.35) 40%,
            rgba(var(--r), var(--g), var(--b), 0.20) 70%,
            transparent                              100%);
        border: 1.5px solid rgba(255,255,255,0.25);
        box-shadow:
            0 0 16px rgba(var(--r), var(--g), var(--b), 0.45),
            0 0 32px var(--accent2-glow),
            inset 0 0 12px rgba(255,255,255,0.12);
        transform: none;
        animation: cur-middle-pulse 0.9s ease-in-out infinite;
    }

    #custom-cursor.cur-middle::before { display: none; }
    #custom-cursor.cur-middle::after  { display: none; }

    @keyframes cur-middle-pulse {
        0%, 100% { opacity: 1;   box-shadow: 0 0 16px rgba(124,92,252,0.45), inset 0 0 8px rgba(255,255,255,0.1);  }
        50%       { opacity: 0.7; box-shadow: 0 0 28px rgba(124,92,252,0.65), inset 0 0 16px rgba(255,255,255,0.2); }
    }


    /* =====================================================
       AURA — Neural Field (3 layered gradients)
       ===================================================== */

    .aura-layer {
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        transform: translate(-50%, -50%);
        will-change: transform;
        /* mix-blend-mode intentionally omitted: screen is invisible on light backgrounds */
    }

    #aura-1 {
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(var(--r, 124), var(--g, 92), var(--b, 252), 0.14) 0%, transparent 70%);
        filter: blur(60px);
    }

    #aura-2 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(var(--r, 0), var(--g, 212), var(--b, 255), 0.10) 0%, transparent 70%);
        filter: blur(40px);
    }

    #aura-3 {
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, rgba(var(--r, 124), var(--g, 92), var(--b, 252), 0.08) 0%, transparent 70%);
        filter: blur(20px);
    }

    /* Light mode: slightly stronger, no screen blend so it stays visible */
    [data-theme='light'] #aura-1 {
        background: radial-gradient(circle, rgba(var(--r, 108), var(--g, 63), var(--b, 244), 0.09) 0%, transparent 70%);
    }

    [data-theme='light'] #aura-2 {
        background: radial-gradient(circle, rgba(var(--r, 0), var(--g, 180), var(--b, 230), 0.07) 0%, transparent 70%);
    }

    [data-theme='light'] #aura-3 {
        background: radial-gradient(circle, rgba(var(--r, 108), var(--g, 63), var(--b, 244), 0.05) 0%, transparent 70%);
    }

    /* =====================================================
       LOADER
       ===================================================== */

    #black-hole-loader {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.8s ease;
    }

    .event-horizon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        box-shadow: 0 0 40px var(--accent-glow), inset 0 0 40px var(--accent-glow);
        animation: warp 1.8s ease-in-out infinite;
        position: relative;
    }

    .event-horizon::after {
        content: '';
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        border: 1px solid var(--accent2);
        opacity: 0.5;
        animation: warp 1.2s ease-in-out infinite reverse;
    }

    @keyframes warp {

        0%,
        100% {
            transform: scale(1);
            opacity: 0.8;
        }

        50% {
            transform: scale(1.12);
            opacity: 1;
        }
    }

    /* ── Toast ── */
    #toast {
        position: fixed;
        bottom: 40px;
        right: 40px;
        color: #fff;
        padding: 14px 28px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 800;
        z-index: 9999;
        transform: translateY(120px);
        opacity: 0;
        transition: .45s cubic-bezier(.4, 0, .2, 1);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(10px);
    }

    #toast.active {
        transform: translateY(0);
        opacity: 1;
    }

    #toast.success-toast {
        background: linear-gradient(135deg, #10B981, #059669);
    }

    #toast.error-toast {
        background: linear-gradient(135deg, #EF4444, #DC2626);
    }

    /* =====================================================
       APP LAYOUT
       ===================================================== */

    .app-viewport {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: min(1440px, 95vw);
        margin: 0 auto;
        padding: clamp(16px, 2.5vw, 40px) clamp(12px, 2vw, 24px);
        display: flex;
        flex-direction: column;
        gap: clamp(16px, 2vw, 32px);
    }

    /* =====================================================
       HEADER
       ===================================================== */

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: clamp(8px, 1vw, 16px);
        background: var(--glass);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: clamp(20px, 2vw, 32px);
        padding: clamp(10px, 1.2vw, 16px) clamp(16px, 2vw, 28px);
        box-shadow:
            inset 0 1px 0 var(--shine),
            0 8px 32px rgba(0, 0, 0, 0.12);
        position: relative;
        z-index: 1000;
        /* Removed overflow: hidden so dropdown doesn't clip */
    }

    header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        opacity: 0.6;
    }

    .logo {
        font-size: clamp(1.25rem, 2vw + .5rem, 1.75rem);
        font-weight: 800;
        letter-spacing: -2px;
    }

    .logo span {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 12px var(--accent-glow));
    }

    /* ── Bliss Tile ── */
    .automation-tile {
        background: var(--glass2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: clamp(8px, 1vw, 10px) clamp(12px, 1.5vw, 20px);
        border-radius: 100px;
        border: 1px solid var(--glass-border);
        display: flex;
        align-items: center;
        gap: clamp(8px, 1vw, 12px);
        transition: border-color .3s, box-shadow .3s;
        height: clamp(48px, 5vw, 60px);
        min-width: min(100%, 320px);
    }

    .automation-tile:hover {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .automation-tile label {
        font-size: clamp(.6rem, 1vw, .7rem);
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        white-space: nowrap;
    }

    .automation-tile input {
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-size: clamp(.75rem, 1vw, .875rem);
        font-weight: 600;
        flex: 1;
        height: 100%;
    }

    /* ── Ticket Controls ── */
    .ticket-controls {
        display: flex;
        gap: clamp(4px, .5vw, 8px);
        align-items: center;
        margin-left: clamp(8px, 1vw, 12px);
    }

    .ticket-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--glass-stroke);
        margin-left: 8px;
        transition: all .4s;
        animation: pulse-indicator 2s infinite;
    }

    .ticket-indicator.active {
        background: var(--accent2);
        box-shadow: 0 0 10px var(--accent2-glow);
    }

    @keyframes pulse-indicator {

        0%,
        100% {
            opacity: 1;
        }

        50% {
            opacity: .5;
        }
    }

    .ticket-btn {
        padding: clamp(6px, .8vw, 10px) clamp(12px, 1.2vw, 18px);
        border-radius: 20px;
        border: none;
        font-size: clamp(.6rem, .9vw, .7rem);
        font-weight: 700;
        transition: all .25s cubic-bezier(.4, 0, .2, 1);
        text-transform: uppercase;
        letter-spacing: 1px;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(8px);
    }

    .ticket-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, .2), transparent);
        opacity: 0;
        transition: opacity .2s;
    }

    .ticket-btn:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.04);
    }

    .ticket-btn:hover:not(:disabled)::before {
        opacity: 1;
    }

    .ticket-btn:active:not(:disabled) {
        transform: scale(.97);
    }

    .ticket-btn.solved {
        background: linear-gradient(135deg, #10B981, #059669);
        color: var(--btn-text, #fff);
        box-shadow: 0 4px 16px rgba(16, 185, 129, .4);
    }

    .ticket-btn.awaiting {
        background: linear-gradient(135deg, #F59E0B, #D97706);
        color: var(--btn-text, #fff);
        box-shadow: 0 4px 16px rgba(245, 158, 11, .4);
    }

    .ticket-btn.open {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        box-shadow: 0 4px 16px var(--accent-glow);
    }

    .ticket-btn:disabled {
        opacity: .4;
        transform: none;
        box-shadow: none;
    }

    .ticket-btn.pulse-active {
        animation: ticket-pulse 1.5s ease-in-out infinite;
    }

    @keyframes ticket-pulse {

        0%,
        100% {
            box-shadow: 0 4px 16px rgba(124, 92, 252, .3);
        }

        50% {
            box-shadow: 0 4px 24px rgba(124, 92, 252, .7);
        }
    }

    /* ── Theme Picker ── */
    .theme-picker-wrap {
        position: relative;
        cursor: pointer;
        z-index: 1000;
    }

    .theme-btn {
        background: var(--glass2);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: clamp(8px, 1vw, 10px) clamp(16px, 1.5vw, 24px);
        border-radius: 100px;
        border: 1px solid var(--glass-border);
        font-weight: 700;
        font-size: clamp(.75rem, 1vw, .85rem);
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all .3s cubic-bezier(.4, 0, .2, 1);
        box-shadow: 0 4px 16px rgba(0, 0, 0, .05);
    }

    .theme-picker-wrap:hover .theme-btn {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
        transform: translateY(-2px);
    }

    .theme-dropdown {
        position: absolute;
        top: calc(100% + 12px);
        left: auto !important;
        /* Reset left: 0 inherited from .dropdown-list */
        right: -50px !important;
        /* Shifted left slightly */
        width: 240px;
        padding: 8px;
        z-index: 10000;
    }

    @media (max-width: 600px) {
        .theme-dropdown {
            right: auto;
            left: 0;
        }
    }

    .theme-menu-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
    }

    .theme-menu-item:hover {
        background: rgba(255, 255, 255, 0.06);
    }

    [data-theme='light'] .theme-menu-item:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    .theme-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* =====================================================
       CONTROLS (dropdown tiles)
       ===================================================== */

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: stretch;
        position: relative;
        z-index: 999;
    }

    .input-tile {
        flex: 1;
        min-width: min(100%, 200px);
        background: var(--glass);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        padding: clamp(10px, 1.2vw, 14px) clamp(16px, 1.5vw, 24px);
        border-radius: clamp(16px, 2vw, 24px);
        transition: all .3s cubic-bezier(.4, 0, .2, 1);
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        box-shadow: inset 0 1px 0 var(--shine), 0 4px 16px rgba(0, 0, 0, .08);
    }

    .input-tile:hover {
        border-color: var(--accent);
        transform: translateY(-3px);
        box-shadow: inset 0 1px 0 var(--shine), 0 12px 32px var(--accent-glow);
    }

    .input-tile label {
        font-size: 10px;
        font-weight: 800;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 2px;
        display: block;
        pointer-events: none;
    }

    .input-tile input.search-input {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        outline: none;
        padding: 0;
        margin-top: 2px;
    }

    .search-input {
        width: 100%;
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        outline: none;
    }

    /* Dropdowns */
    .dropdown-list {
        position: absolute;
        top: calc(100% + 10px);
        left: 0;
        right: 0;
        background: var(--surface);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        z-index: 1000;
        display: none;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .4), inset 0 1px 0 var(--shine);
        overflow: hidden;
    }

    .dropdown-list.active {
        display: block;
        animation: slideUp .2s ease-out;
    }

    .dropdown-scroll-area {
        max-height: 280px;
        overflow-y: auto;
        padding: 8px;
    }

    .dropdown-item {
        padding: 11px 14px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        border-radius: 12px;
        transition: .2s;
    }

    .dropdown-item:hover {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
    }

    /* =====================================================
       MAIN CARDS GRID
       ===================================================== */

    .apex-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: clamp(12px, 1.5vw, 24px);
        position: relative;
        z-index: 1;
    }

    .card {
        background: var(--glass);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        border-radius: clamp(20px, 2.5vw, 36px);
        padding: clamp(20px, 2vw, 32px);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 1px 0 var(--shine), 0 8px 32px rgba(0, 0, 0, .10);
        transition: box-shadow .3s, border-color .3s;
    }

    .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    }

    .card:hover {
        box-shadow: inset 0 1px 0 var(--shine), 0 16px 48px rgba(0, 0, 0, .18), 0 0 0 1px var(--accent-glow);
    }

    .sr-box {
        grid-column: span 6;
        min-height: clamp(280px, 35vw, 420px);
        border-left: 3px solid transparent;
        border-image: none;
        box-shadow: inset 0 1px 0 var(--shine), 0 8px 32px rgba(0, 0, 0, .10),
            inset 3px 0 0 var(--accent);
    }

    .in-box {
        grid-column: span 3;
        min-height: clamp(220px, 28vw, 350px);
    }

    .side-stack {
        grid-column: span 3;
        display: grid;
        gap: clamp(12px, 1.5vw, 24px);
    }

    .mini-card {
        min-height: clamp(120px, 15vw, 163px);
    }

    .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .card-actions {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .tag {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 3px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    textarea,
    .card-content {
        width: 100%;
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        resize: none;
        outline: none;
        line-height: 1.8;
        font-size: clamp(.875rem, 1.2vw, 1rem);
        font-family: inherit;
    }

    .sr-box .card-content {
        font-size: clamp(1rem, 1.4vw, 1.1875rem);
    }

    .card-content.editable {
        background: rgba(124, 92, 252, .06);
        border-radius: 12px;
        padding: 10px;
        cursor: text !important;
        border: 1px solid var(--accent-glow);
    }

    .card-content:empty::before {
        content: attr(data-placeholder);
        color: var(--text-muted);
        opacity: .5;
    }

    .card-content a {
        color: var(--accent2);
        text-decoration: underline;
    }

    .card-content a:hover {
        opacity: .8;
    }

    /* ── DeepL Paraphraser Interactive Elements ── */
    .ph-split-view {
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
        width: 100%;
        overflow: hidden;
        /* Prevent breaking the card layout */
    }

    .ph-original-pane {
        flex: 0 1 auto;
        opacity: 0.5;
        font-size: 0.85em;
        line-height: 1.4;
        padding-bottom: 8px;
        border-bottom: 1px dashed var(--glass-border);
        overflow-y: auto;
        max-height: 35%;
        /* Restrict how much space the original text takes */
    }

    .ph-original-pane strong {
        color: var(--accent2);
        font-size: 0.9em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        display: block;
    }

    .ph-edit-pane {
        flex: 1 1 auto;
        overflow-y: auto;
        font-size: 0.95em;
        line-height: 1.5;
    }

    .ph-swap {
        background: rgba(var(--r, 124), var(--g, 92), var(--b, 252), 0.15);
        border-bottom: 2px solid var(--accent);
        border-radius: 4px;
        cursor: pointer;
        padding: 0 2px;
        transition: all 0.2s ease;
        position: relative;
    }

    .ph-swap:hover {
        background: rgba(var(--r, 124), var(--g, 92), var(--b, 252), 0.3);
        box-shadow: 0 2px 8px var(--accent-glow);
    }

    .ph-swap.active {
        background: var(--accent);
        color: var(--btn-text, #fff);
    }

    .synonym-menu {
        position: absolute;
        background: var(--surface);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 var(--shine);
        z-index: 10000;
        min-width: 180px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        animation: slideUp 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .synonym-item {
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        transition: 0.2s;
    }

    .synonym-item:hover {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
    }

    /* Buttons */
    .btn-copy {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        border: none;
        padding: 10px 22px;
        border-radius: 14px;
        font-size: 11px;
        font-weight: 800;
        transition: .3s;
        letter-spacing: .5px;
        box-shadow: 0 4px 16px var(--accent-glow);
        position: relative;
        overflow: hidden;
    }

    .btn-copy::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 255, 255, .2), transparent);
        opacity: 0;
        transition: opacity .2s;
    }

    .btn-copy:hover::before {
        opacity: 1;
    }

    .btn-copy:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px var(--accent-glow);
    }

    .btn-copy.success {
        background: linear-gradient(135deg, #10B981, #059669) !important;
    }

    .btn-copy.error {
        background: linear-gradient(135deg, #EF4444, #DC2626) !important;
    }

    .btn-edit-toggle {
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        color: var(--text-muted);
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: .2s;
        backdrop-filter: blur(8px);
    }

    .btn-edit-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .btn-edit-toggle.active {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        border-color: transparent;
    }

    /* =====================================================
       RADIAL SPEED DIAL + FLOATING PANELS
       ===================================================== */

    /* ── Radial Dock Container ── */
    #radial-dock {
        position: fixed;
        bottom: 24px;
        left: 24px;
        width: 60px;
        height: 60px;
        z-index: 1000;
    }

    /* ── Main Orb ── */
    #radial-orb {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 0 28px var(--accent-glow), 0 8px 32px rgba(0,0,0,.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
        transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease;
        overflow: hidden;
    }

    #radial-orb:hover {
        transform: scale(1.1);
        box-shadow: 0 0 44px var(--accent-glow), 0 12px 40px rgba(0,0,0,.4);
    }

    #radial-dock.open #radial-orb {
        transform: rotate(45deg) scale(1.05);
        box-shadow: 0 0 52px var(--accent-glow), 0 16px 48px rgba(0,0,0,.45);
    }

    /* Breathing glow pulse when closed */
    .orb-pulse {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        opacity: 0;
        animation: orbPulse 2.8s ease-in-out infinite;
    }

    #radial-dock.open .orb-pulse { animation: none; opacity: 0; }

    @keyframes orbPulse {
        0%, 100% { transform: scale(1);   opacity: 0; }
        50%       { transform: scale(1.5); opacity: .22; }
    }

    /* Orb icon switching */
    .orb-face { position: relative; width: 28px; height: 28px; }

    .orb-icon-grid,
    .orb-icon-close {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transition: opacity .25s ease, transform .3s ease;
    }

    .orb-icon-close { opacity: 0; transform: rotate(-45deg) scale(.7); }
    .orb-icon-grid  { opacity: 1; transform: rotate(0) scale(1); }

    #radial-dock.open .orb-icon-grid  { opacity: 0; transform: rotate(45deg) scale(.7); }
    #radial-dock.open .orb-icon-close { opacity: 1; transform: rotate(0) scale(1); }

    /* ── Radial Items ── */
    .ri {
        position: absolute;
        bottom: 6px;
        left: 6px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 var(--shine);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2px;
        z-index: 1;
        transform: scale(0) translate(0, 0);
        opacity: 0;
        transition: transform .45s cubic-bezier(.34,1.56,.64,1),
                    opacity .3s ease,
                    box-shadow .2s ease,
                    border-color .2s ease;
        pointer-events: none;
    }

    /* Items fan in a 90° arc (0° = up → 90° = right) — orb is on LEFT */
    #radial-dock.open .ri { pointer-events: auto; }

    /* radius ≈ 130px; 4 items at 0°, 30°, 60°, 90° clockwise from straight up */
    #radial-dock.open .ri:nth-child(1) { transform: scale(1) translate(  4px, -130px); opacity: 1; transition-delay:   0ms; }
    #radial-dock.open .ri:nth-child(2) { transform: scale(1) translate( 68px, -112px); opacity: 1; transition-delay:  55ms; }
    #radial-dock.open .ri:nth-child(3) { transform: scale(1) translate(112px,  -68px); opacity: 1; transition-delay: 110ms; }
    #radial-dock.open .ri:nth-child(4) { transform: scale(1) translate(130px,   -4px); opacity: 1; transition-delay: 165ms; }

    .ri:hover {
        box-shadow: 0 0 20px var(--accent-glow), 0 10px 36px rgba(0,0,0,.4);
        border-color: var(--accent);
    }

    .ri.active {
        border-color: var(--accent);
        background: linear-gradient(135deg, rgba(var(--r),var(--g),var(--b),.25), rgba(0,212,255,.12));
        box-shadow: 0 0 24px var(--accent-glow), 0 8px 28px rgba(0,0,0,.35);
    }

    .ri-ring {
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 2px solid transparent;
        background: linear-gradient(var(--surface), var(--surface)) padding-box,
                    linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
        opacity: 0;
        z-index: -1;
        transition: opacity .2s ease;
    }

    .ri:hover .ri-ring,
    .ri.active .ri-ring { opacity: 1; }

    .ri-svg { width: 22px; height: 22px; }

    .ri-label {
        font-size: 7px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        white-space: nowrap;
        transition: color .2s;
    }

    .ri:hover .ri-label,
    .ri.active .ri-label { color: var(--accent); }

    /* Tooltip-style label that appears to the left of each item */
    .ri-tooltip {
        position: absolute;
        right: 58px;
        background: var(--surface);
        border: 1px solid var(--glass-stroke);
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translateX(8px);
        transition: opacity .2s, transform .2s;
        box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }

    #radial-dock.open .ri:hover .ri-tooltip {
        opacity: 1;
        transform: translateX(0);
    }


    /* ── Floating Panels ── */
    .float-panel {
        position: fixed;
        display: flex;
        flex-direction: column;
        border-radius: 20px;
        /* Theme-aware: color-mix adapts to any --surface value */
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        border: 1px solid rgba(var(--r),var(--g),var(--b),.25);
        box-shadow: 0 24px 80px rgba(0,0,0,.45),
                    0 0 0 1px rgba(var(--r),var(--g),var(--b),.10),
                    inset 0 1px 0 rgba(255,255,255,.08);
        z-index: 900;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(0.92) translateY(14px);
        transition: opacity .35s ease,
                    visibility .35s ease,
                    transform .45s cubic-bezier(.34,1.56,.64,1);
    }

    .float-panel::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        opacity: .8;
    }

    .float-panel.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: scale(1) translateY(0);
    }

    /* Per-panel positions — each unique so none overlap */
    #panel-calculator {
        width: 300px;
        bottom: 20px;
        left: 560px;  /* gap between analytics (ends ~546) and assistant (starts ~830) */
    }

    #panel-scratch {
        width: 370px;
        height: 560px;
        top: 80px;
        left: calc(50% - 185px); /* horizontally centered */
    }

    #panel-analytics {
        width: 440px;
        top: 64px;
        left: 106px;   /* left side, under orb */
        bottom: 24px;
    }

    #panel-assistant {
        width: 430px;
        top: 64px;
        right: 20px;   /* far right (shares with scratch but z-index determines top) */
        bottom: 24px;
    }

    /* Panel content area: fills remaining height and scrolls */
    .float-panel > *:not(.fp-header):not(.chat-container) {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        min-height: 0;
    }

    /* Chat container fills panel without extra padding wrapper */
    .float-panel > .chat-container {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ── Float Panel Header ── */
    .fp-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px 12px;
        border-bottom: 1px solid rgba(var(--r),var(--g),var(--b),.18);
        background: linear-gradient(135deg,
            rgba(var(--r),var(--g),var(--b),.10),
            rgba(var(--r),var(--g),var(--b),.04));
        flex-shrink: 0;
    }

    .fp-title {
        flex: 1;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .fp-close {
        background: none;
        border: 1px solid var(--glass-stroke);
        color: var(--text-muted);
        width: 26px;
        height: 26px;
        border-radius: 8px;
        font-size: 16px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all .2s ease;
        flex-shrink: 0;
    }

    .fp-close:hover {
        border-color: var(--error);
        color: var(--error);
        background: rgba(239,68,68,.1);
        transform: scale(1.1);
    }

    /* ── Calculator ── */
    .calculator {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: clamp(6px, .8vw, 10px);
    }

    .calc-display {
        grid-column: span 4;
        background: var(--glass);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: clamp(12px, 1.2vw, 16px);
        font-size: clamp(1.125rem, 2vw, 1.5rem);
        font-weight: 700;
        text-align: right;
        color: var(--text);
        min-height: clamp(48px, 5vw, 60px);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        font-family: 'Monaco', monospace;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, .12);
    }

    .calc-btn {
        background: var(--glass);
        backdrop-filter: blur(8px);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: clamp(12px, 1.2vw, 16px);
        font-size: clamp(.875rem, 1.2vw, 1rem);
        font-weight: 700;
        color: var(--text);
        transition: .2s;
        box-shadow: inset 0 1px 0 var(--shine);
    }

    .calc-btn:hover {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        border-color: transparent;
        transform: scale(1.04);
    }

    .calc-btn.operator {
        background: rgba(124, 92, 252, .12);
        color: var(--accent);
    }

    .calc-btn.operator:hover {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
    }

    .calc-btn.equals {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        border-color: transparent;
        box-shadow: 0 4px 16px var(--accent-glow);
    }

    .calc-btn.equals:hover {
        opacity: .9;
    }

    .calc-btn.zero {
        grid-column: span 2;
    }

    /* ── Scratch pad ── */
    #scratch-area {
        width: 100%;
        min-height: 280px;
        background: var(--glass);
        backdrop-filter: blur(8px);
        border: 1px solid var(--glass-stroke);
        border-radius: 14px;
        padding: 16px;
        color: var(--text);
        font-family: 'Monaco', 'Consolas', monospace;
        font-size: 13px;
        line-height: 1.7;
        resize: vertical;
        outline: none;
        background-image:
            linear-gradient(var(--glass-stroke) 1px, transparent 1px),
            linear-gradient(90deg, var(--glass-stroke) 1px, transparent 1px);
        background-size: 24px 24px;
    }

    /* =====================================================
       ANALYTICS DASHBOARD
       ===================================================== */

    .dashboard-wrap {
        padding: 4px;
    }

    .dashboard-targets {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        justify-content: center;
    }

    .dashboard-target {
        background: var(--glass);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        padding: 12px 20px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all .3s;
        box-shadow: inset 0 1px 0 var(--shine);
    }

    .dashboard-target::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        opacity: .8;
    }

    .dashboard-target label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
        display: block;
        margin-bottom: 4px;
    }

    .dashboard-target span {
        font-size: 18px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: block;
    }

    .dashboard-section {
        margin-bottom: 18px;
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 18px;
        position: relative;
        overflow: hidden;
        box-shadow: inset 0 1px 0 var(--shine), 0 4px 20px rgba(0, 0, 0, .06);
        transition: all .3s;
    }

    .dashboard-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
    }

    .dashboard-section h4 {
        font-size: 10px;
        font-weight: 800;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .dashboard-section h4::before {
        content: '';
        width: 3px;
        height: 12px;
        background: linear-gradient(180deg, var(--accent), var(--accent2));
        border-radius: 2px;
        flex-shrink: 0;
        box-shadow: 0 0 8px var(--accent-glow);
    }

    .dashboard-kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .kpi {
        padding: 14px;
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        border-radius: 14px;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all .3s;
    }

    .kpi:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 8px 24px var(--accent-glow);
    }

    .kpi .label-new {
        font-size: 9px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: block;
        margin-bottom: 8px;
    }

    .kpi .value {
        font-size: 26px;
        font-weight: 800;
        color: var(--text);
        line-height: 1;
        margin-bottom: 8px;
        transition: all .4s;
    }

    .kpi .value.exceeded-target {
        background: linear-gradient(135deg, #10B981, #34D399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: pulse-glow-green 2s ease-in-out infinite;
    }

    .kpi .value.reached-target {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .kpi .value.under-target {
        color: var(--warning);
    }

    @keyframes pulse-glow-green {

        0%,
        100% {
            filter: drop-shadow(0 0 6px rgba(16, 185, 129, .4));
        }

        50% {
            filter: drop-shadow(0 0 16px rgba(16, 185, 129, .8));
        }
    }

    .progress-bar {
        width: 100%;
        height: 5px;
        background: var(--glass-stroke);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }

    .fill-tph,
    .fill-aht {
        display: block;
        height: 100%;
        border-radius: 10px;
        transition: width .7s cubic-bezier(.4, 0, .2, 1);
    }

    .fill-tph {
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        box-shadow: 0 0 10px var(--accent-glow);
    }

    .fill-tph.on-target {
        background: linear-gradient(90deg, #10B981, #34D399);
        box-shadow: 0 0 10px rgba(16, 185, 129, .4);
    }

    .fill-aht {
        background: linear-gradient(90deg, #8B5CF6, #EC4899);
        box-shadow: 0 0 10px rgba(139, 92, 246, .4);
    }

    .fill-aht.on-target {
        background: linear-gradient(90deg, #10B981, #34D399);
        box-shadow: 0 0 10px rgba(16, 185, 129, .4);
    }

    .fill-aht.over {
        background: linear-gradient(90deg, var(--error), #FF6B6B);
    }

    /* Feedback */
    .dashboard-feedback {
        background: var(--glass);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-stroke);
        border-left: 3px solid var(--accent);
        border-radius: 14px;
        padding: 14px 18px;
        margin-bottom: 18px;
        animation: slideIn .4s cubic-bezier(.4, 0, .2, 1);
    }

    .dashboard-feedback.exceeded {
        border-left-color: var(--success);
        background: linear-gradient(135deg, var(--glass), rgba(16, 185, 129, .06));
    }

    .dashboard-feedback.reached {
        border-left-color: var(--accent);
    }

    .dashboard-feedback.under {
        border-left-color: var(--warning);
        background: linear-gradient(135deg, var(--glass), rgba(245, 158, 11, .06));
    }

    .dashboard-feedback p {
        font-size: 12px;
        line-height: 1.6;
        color: var(--text);
        font-weight: 500;
        margin: 0;
    }

    .dashboard-feedback strong {
        font-weight: 700;
        color: var(--accent);
    }

    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(-8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Streak / Gamification */
    .streak-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        margin-left: 6px;
        background: rgba(124, 92, 252, .2);
        color: var(--accent);
        opacity: 0;
        transform: scale(.8);
        transition: .3s;
    }

    .streak-badge.active {
        opacity: 1;
        transform: scale(1);
    }

    /* Fire effect */
    .fire-glow {
        animation: fire-pulse 1.4s infinite alternate;
        border-color: rgba(244, 63, 94, .8) !important;
        box-shadow: 0 0 20px rgba(244, 63, 94, .4);
    }

    @keyframes fire-pulse {
        0% {
            box-shadow: 0 0 12px rgba(244, 63, 94, .3);
        }

        100% {
            box-shadow: 0 0 32px rgba(244, 63, 94, .8);
            transform: scale(1.02);
        }
    }

    body.theme-flow {
        --accent: #10B981;
        --accent-glow: rgba(16, 185, 129, .3);
        --accent2: #34D399;
    }

    body.theme-fire {
        --accent: #F43F5E;
        --accent-glow: rgba(244, 63, 94, .3);
        --accent2: #FB923C;
    }

    /* Prediction */
    .prediction-card {
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* Fastest ticket — gap matches .dashboard-section spacing */
    .dashboard-fastest {
        background: var(--glass);
        backdrop-filter: blur(16px);
        border: 1px solid var(--glass-stroke);
        border-radius: 14px;
        padding: 14px;
        margin-top: 14px;
        margin-bottom: 18px;  /* matches .dashboard-section gap so heatmap has breathing room */
        position: relative;
        overflow: hidden;
    }

    .dashboard-fastest::before {
        content: '⚡';
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 22px;
        opacity: .15;
    }

    .dashboard-fastest label {
        font-size: 9px;
        font-weight: 800;
        color: var(--text-muted);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: block;
        margin-bottom: 4px;
    }

    .dashboard-fastest .val {
        font-size: 22px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--success), #34D399);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 3px;
    }

    .dashboard-fastest .hint {
        font-size: 10px;
        color: var(--text-muted);
    }

    /* Hourly Heatmap */
    .heatmap-grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4px;
        margin-top: 4px;
    }

    .heatmap-cell {
        aspect-ratio: 1;
        border-radius: 6px;
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
        transition: all .4s;
        position: relative;
        flex-direction: column;
        gap: 1px;
    }

    .heatmap-cell .hour-label {
        font-size: 8px;
        opacity: .6;
    }

    .heatmap-cell.h-low {
        background: rgba(16, 185, 129, .15);
        border-color: rgba(16, 185, 129, .3);
        color: #10B981;
    }

    .heatmap-cell.h-mid {
        background: rgba(245, 158, 11, .20);
        border-color: rgba(245, 158, 11, .4);
        color: #F59E0B;
    }

    .heatmap-cell.h-high {
        background: rgba(239, 68, 68, .20);
        border-color: rgba(239, 68, 68, .4);
        color: #EF4444;
    }

    .heatmap-cell.h-current {
        box-shadow: 0 0 0 2px var(--accent2);
    }

    /* Efficiency Score Dial */
    .efficiency-dial {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 0;
    }

    .dial-ring {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 50%;
        position: relative;
        background: conic-gradient(var(--accent) 0deg, var(--accent2) 0deg, var(--glass-stroke) 0deg);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .dial-inner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 800;
        color: var(--text);
        position: relative;
        z-index: 1;
    }

    .dial-info {
        flex: 1;
    }

    .dial-info .dial-label {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 4px;
    }

    .dial-info .dial-desc {
        font-size: 11px;
        color: var(--text);
        line-height: 1.4;
    }

    /* Sparkline */
    .sparkline-wrap {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 36px;
        margin-top: 10px;
    }

    .spark-bar {
        flex: 1;
        border-radius: 3px 3px 0 0;
        min-width: 4px;
        background: linear-gradient(180deg, var(--accent), var(--accent2));
        opacity: .7;
        /* transition removed: bars are fully re-created on each refresh; transition from 0 looks like loading */
        position: relative;
    }

    .spark-bar:hover {
        opacity: 1;
        transform: scaleY(1.05);
    }

    .spark-bar.today {
        opacity: 1;
        box-shadow: 0 -4px 12px var(--accent-glow);
    }

    .sparkline-labels {
        display: flex;
        gap: 3px;
        margin-top: 4px;
    }

    .spark-label {
        flex: 1;
        font-size: 8px;
        color: var(--text-muted);
        text-align: center;
    }

    /* Velocity Arrow */
    .velocity-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
    }

    .velocity-badge.up {
        background: rgba(16, 185, 129, .15);
        color: #10B981;
    }

    .velocity-badge.down {
        background: rgba(239, 68, 68, .15);
        color: #EF4444;
    }

    .velocity-badge.flat {
        background: rgba(124, 92, 252, .15);
        color: var(--accent);
    }

    /* Best/Worst day */
    .best-worst-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
    }

    .bw-card {
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        border-radius: 12px;
        padding: 10px 12px;
    }

    .bw-card .bw-label {
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 4px;
    }

    .bw-card .bw-val {
        font-size: 18px;
        font-weight: 800;
    }

    .bw-card.bw-best .bw-val {
        color: #10B981;
    }

    .bw-card.bw-worst .bw-val {
        color: var(--warning);
    }

    .bw-card .bw-sub {
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 2px;
    }

    /* Overtime badge */
    .overtime-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 10px;
        background: rgba(245, 158, 11, .15);
        border: 1px solid rgba(245, 158, 11, .3);
        color: #F59E0B;
        font-size: 10px;
        font-weight: 800;
        animation: overtime-blink 2s infinite;
    }

    @keyframes overtime-blink {

        0%,
        100% {
            opacity: 1
        }

        50% {
            opacity: .6
        }
    }

    /* Live Pace Bar */
    .pace-bar-wrap {
        background: var(--glass2);
        border: 1px solid var(--glass-stroke);
        border-radius: 12px;
        padding: 12px;
        margin-top: 10px;
    }

    .pace-bar-labels {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
    }

    .pace-bar-labels span {
        font-size: 10px;
        font-weight: 700;
        color: var(--text-muted);
    }

    .pace-bar-labels strong {
        color: var(--text);
    }

    .pace-track {
        height: 8px;
        background: var(--glass-stroke);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
    }

    .pace-fill {
        height: 100%;
        border-radius: 10px;
        /* transition removed: element is re-created on every refresh — transition from 0 looked like a loading bar */
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        box-shadow: 0 0 12px var(--accent-glow);
    }

    /* =====================================================
       SCRATCHPAD (KEEP STYLE)
       ===================================================== */
    .scratch-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow-y: auto;
        padding: 16px;
        gap: 24px;
        padding-bottom: 80px;
    }

    /* Create Area */
    .scratch-create-area {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        margin: 0 auto;
        width: 100%;
        transition: box-shadow 0.3s, border-color 0.3s;
    }

    .scratch-create-area:focus-within {
        border-color: var(--accent);
        box-shadow: 0 12px 48px var(--accent-glow);
    }

    .scratch-input {
        background: transparent;
        border: none;
        color: var(--text);
        font-family: inherit;
        width: 100%;
        outline: none;
        resize: none;
    }

    .scratch-input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }

    .title-input {
        font-size: 16px;
        font-weight: 700;
    }

    .body-input {
        font-size: 14px;
        min-height: 48px;
        line-height: 1.5;
    }

    /* Create Actions */
    .scratch-create-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 12px;
    }

    .scratch-colors {
        display: flex;
        gap: 8px;
    }

    .color-btn {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .color-btn:hover {
        transform: scale(1.2);
    }

    .color-btn.active {
        border-color: #fff;
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* Color Palette */
    .color-btn[data-color="default"],
    .note-card[data-color="default"] {
        background: var(--glass);
    }

    .color-btn[data-color="red"],
    .note-card[data-color="red"] {
        background: rgba(239, 68, 68, 0.15);
        border-color: rgba(239, 68, 68, 0.3);
    }

    .color-btn[data-color="yellow"],
    .note-card[data-color="yellow"] {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.3);
    }

    .color-btn[data-color="green"],
    .note-card[data-color="green"] {
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.3);
    }

    .color-btn[data-color="blue"],
    .note-card[data-color="blue"] {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
    }

    .btn-save-note {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: var(--btn-text, #fff);
        border: none;
        padding: 6px 16px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        opacity: 0.9;
        transition: 0.2s;
    }

    .btn-save-note:hover {
        opacity: 1;
        box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Masonry Grid */
    .notes-section-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-bottom: 12px;
        margin-left: 8px;
    }

    .masonry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        align-items: start;
    }

    /* Note Card */
    .note-card {
        border-radius: 16px;
        padding: 16px;
        border: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        gap: 10px;
        position: relative;
        transition: transform 0.2s, box-shadow 0.2s;
        backdrop-filter: blur(8px);
    }

    .note-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .note-content-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .note-title {
        font-weight: 700;
        font-size: 15px;
        color: var(--text);
        word-wrap: break-word;
    }

    .note-body {
        font-size: 13px;
        color: var(--text);
        opacity: 0.85;
        white-space: pre-wrap;
        word-wrap: break-word;
        line-height: 1.5;
    }

    /* Note Hover Actions (Pin / Delete) */
    .note-actions {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .note-card:hover .note-actions {
        opacity: 1;
    }

    .note-action-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
    }

    .note-action-btn:hover {
        background: var(--surface);
        border-color: var(--accent);
        transform: scale(1.1);
    }

    .note-action-btn.pinned {
        background: var(--accent);
        border-color: var(--accent2);
        opacity: 1;
    }

    .note-card:hover .note-action-btn.pinned {
        opacity: 1;
    }

    .note-date {
        font-size: 10px;
        color: var(--text-muted);
        align-self: flex-end;
        margin-top: 8px;
    }

    /* ── Note Edit Mode ─────────────────────────────── */
    .note-card.note-editing {
        outline: 2px solid var(--accent);
        box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .note-edit-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 4px;
        width: 100%;
    }

    .note-edit-title {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid var(--glass-stroke);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 700;
        padding: 6px 10px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        transition: border-color .2s;
    }

    .note-edit-title:focus {
        border-color: var(--accent);
    }

    .note-edit-body {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-stroke);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 12px;
        padding: 6px 10px;
        outline: none;
        width: 100%;
        box-sizing: border-box;
        resize: none;
        min-height: 72px;
        transition: border-color .2s;
        font-family: inherit;
        line-height: 1.5;
    }

    .note-edit-body:focus {
        border-color: var(--accent);
    }

    /* Color swatch row — same 5 colors as the create area */
    .note-color-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 4px;
    }

    .edit-color-btn {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: transform .15s, border-color .15s;
        flex-shrink: 0;
    }

    .edit-color-btn:hover {
        transform: scale(1.3);
    }

    .edit-color-btn.active {
        border-color: #fff;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, .45);
    }

    /* Swatch colors match existing note card/color-btn tokens */
    .edit-color-btn[data-color="default"] {
        background: rgba(255, 255, 255, .15);
    }

    .edit-color-btn[data-color="red"] {
        background: #ef5350;
    }

    .edit-color-btn[data-color="yellow"] {
        background: #f9c84a;
    }

    .edit-color-btn[data-color="green"] {
        background: #4caf50;
    }

    .edit-color-btn[data-color="blue"] {
        background: #42a5f5;
    }

    /* Save / Cancel button row */
    .note-edit-btns {
        display: flex;
        gap: 8px;
        margin-top: 6px;
    }

    .note-save-btn,
    .note-cancel-btn {
        font-size: 11px;
        font-weight: 700;
        padding: 5px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: opacity .15s, transform .1s;
    }

    .note-save-btn {
        background: var(--accent);
        color: var(--btn-text, #fff);
    }

    .note-cancel-btn {
        background: rgba(255, 255, 255, .1);
        color: var(--text-muted);
    }

    .note-save-btn:hover,
    .note-cancel-btn:hover {
        opacity: .85;
        transform: scale(1.03);
    }

    /* Active edit button highlight */
    .note-action-btn.active-edit {
        color: var(--accent);
    }

    /* Empty State */
    .scratch-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 60px 20px;
        color: var(--text-muted);
        text-align: center;
        font-size: 15px;
        font-weight: 600;
    }

    .empty-icon {
        font-size: 48px;
        opacity: 0.4;
        filter: grayscale(1);
    }

    /* =====================================================
       ANIMATIONS (shared)
       ===================================================== */

    .pulse {
        animation: pulse-anim 1.1s ease-out;
    }

    .nudge {
        animation: nudge-shiver .4s ease-in-out;
    }

    @keyframes pulse-anim {
        0% {
            box-shadow: 0 0 0 0 var(--accent-glow);
        }

        70% {
            box-shadow: 0 0 0 14px transparent;
        }

        100% {
            box-shadow: 0 0 0 0 transparent;
        }
    }

    @keyframes nudge-shiver {

        0%,
        100% {
            transform: translateX(0);
        }

        20% {
            transform: translateX(-6px);
        }

        40% {
            transform: translateX(6px);
        }

        60% {
            transform: translateX(-4px);
        }

        80% {
            transform: translateX(4px);
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(16px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =====================================================
       CHAT ASSISTANT
       ===================================================== */
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        border-radius: 12px;
        background: var(--glass2);
        border: 1px solid var(--glass-border);
        overflow: hidden;
    }

    .chat-header {
        display: flex;
        align-items: center;
        padding: 16px;
        background: var(--surface2);
        border-bottom: 1px solid var(--glass-border);
        gap: 14px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        position: relative;
        z-index: 2;
    }

    .chat-avatar {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(255, 87, 34, 0.25), rgba(255, 193, 7, 0.25));
        border: 1px solid rgba(255, 87, 34, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 14px;
        color: #fff;
        position: relative;
        overflow: hidden;
        text-shadow: 0 0 10px rgba(255, 193, 7, 0.8);
    }

    .chat-avatar .avatar-glow {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255, 87, 34, 0.45) 0%, transparent 60%);
        animation: rotateGlow 4s linear infinite;
        opacity: 0.6;
    }

    .chat-avatar .phoenix-logo {
        position: relative;
        z-index: 1;
        width: 24px;
        height: 24px;
        stroke: #fff;
        filter: drop-shadow(0 0 4px rgba(255, 193, 7, 0.8));
    }

    @keyframes rotateGlow {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    .chat-title {
        display: flex;
        flex-direction: column;
    }

    .chat-title strong {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.5px;
    }

    .chat-title span {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }

    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .chat-message {
        display: flex;
        width: 100%;
    }

    .chat-message.bot {
        justify-content: flex-start;
    }

    .chat-message.user {
        justify-content: flex-end;
    }

    .chat-bubble {
        max-width: 85%;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--text);
        word-wrap: break-word;
    }

    .chat-message.bot .chat-bubble {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-bottom-left-radius: 4px;
    }

    .chat-message.user .chat-bubble {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        /* Use --btn-text so light-accent themes (Solar Flare etc.) remain readable */
