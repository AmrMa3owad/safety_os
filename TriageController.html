<script>
/*================================================================
 * SafetyOS | TriageController — AI triage panel v1.0
 * ----------------------------------------------------------------
 * SRP: Manages the AI triage UI. Owns the Layer 1 local keyword
 *      scorer and the Layer 2 Gemini AI call.
 *
 * Key design: The triage prompt owns a strict JSON schema so
 *   the AI response is always parseable. This fixes the
 *   "AI Schema Chaos" bug where hallucinated key names caused
 *   silent parse failures.
 *
 * Depends on: CoreBus, ScenarioService
 *================================================================*/
(function (global) {
    'use strict';

    var EB    = global.App.EventBus;
    var Store = global.App.Store;
    var RPC   = global.App.RpcClient;
    var Cache = global.App.LocalCache;

    // ── Intent keywords with weights ──────────────────────────────────────────
    var _KW = {
        hospital: 16, ambulance: 16, 'emergency room': 16, hospitalized: 16, 'life-threatening': 14,
        allerg: 13, allergen: 13, anaphylax: 14, 'epi-pen': 13, swelling: 10, hives: 10, rash: 9,
        intolerance: 9, dairy: 7, gluten: 7, peanut: 11, nut: 9,
        poison: 11, 'food made me': 10, 'made me sick': 11, vomit: 9, diarrhea: 9, stomach: 8,
        'foreign object': 12, glass: 12, metal: 12, plastic: 10, wire: 11, nail: 10,
        pebble: 9, 'found in': 7, bone: 7, undercook: 11, 'raw meat': 12, 'pink inside': 10, bleeding: 9,
        tamper: 10, 'broken seal': 10, 'already open': 9, tampered: 10,
        burn: 9, scald: 9, 'too hot': 8, boiling: 7,
        religious: 8, halal: 9, kosher: 9, vegan: 7, vegetarian: 7,
        fraud: 10, 'too many refunds': 10, 'same issue': 8,
        'missing item': 7, 'not received': 7, "didn't receive": 7, 'never arrived': 7,
        'wrong item': 7, 'incorrect order': 7, 'not what i ordered': 7,
        spicy: 5, taste: 3, cold: 3, stale: 5, spoiled: 7, expired: 7
    };

    // ══════════════════════════════════════════════════════════════
    // Layer 1 — instant local scoring
    // ══════════════════════════════════════════════════════════════

    function _triageLocal(msg) {
        var lower = msg.toLowerCase();
        var data = Store.get('kb.storage') || Cache.getJson('scenCache', {}) || {};
        var scores = [];

        Object.keys(data).forEach(function (cat) {
            (data[cat] || []).forEach(function (s, idx) {
                var nameL = (s.scenario || '').toLowerCase();
                var score = 0;
                Object.keys(_KW).forEach(function (k) {
                    var w = _KW[k];
                    if (lower.indexOf(k) !== -1) score += w;
                    if (nameL.indexOf(k) !== -1) score += Math.ceil(w * 0.4);
                });
                if (score > 4) {
                    scores.push({
                        scenario:   s.scenario,
                        category:   cat,
                        sr:         s.reply || s.replyHtml || '',
                        confidence: Math.min(99, score * 2) + '%',
                        score:      score,
                        idx:        idx
                    });
                }
            });
        });

        scores.sort(function (a, b) { return b.score - a.score; });
        return scores.slice(0, 3);
    }

    // ══════════════════════════════════════════════════════════════
    // Layer 2 — Gemini AI (locked schema prevents parse failures)
    // ══════════════════════════════════════════════════════════════

    function _buildScenarioContext() {
        var data = Store.get('kb.storage') || Cache.getJson('scenCache', {}) || {};
        var lines = [];
        Object.keys(data).forEach(function (cat) {
            (data[cat] || []).slice(0, 20).forEach(function (s) {
                lines.push(cat + ' > ' + s.scenario);
            });
        });
        return lines.join('\n');
    }

    // ══════════════════════════════════════════════════════════════
    // Rendering
    // ══════════════════════════════════════════════════════════════

    function _renderResults(results, source) {
        var el = document.getElementById('triage-results');
        if (!el) return;

        if (!results || !results.length) {
            el.innerHTML = '<p class="tr-none">No strong matches found \u2014 try more specific words (e.g. "hospitalized", "allergen", "foreign object").</p>';
            return;
        }

        var label = source === 'ai' ? '🤖 AI Analysis' : '⚡ Quick Match';
        var html  = '<div class="tr-source-label">' + label + '</div>';

        results.forEach(function (r, i) {
            var srRaw  = (r.sr || '').replace(/<[^>]+>/g, '').trim();
            var srPrev = srRaw.length > 90 ? srRaw.substring(0, 90) + '\u2026' : srRaw;
            var safeScen = escapeHtml(r.scenario || '');
            var safeCat  = escapeHtml(r.category  || '');
            var onclickArgs = '"' + (r.scenario || '').replace(/"/g, '\\"') + '","' + (r.category || '').replace(/"/g, '\\"') + '"';
            html +=
                '<div class="tr-card" onclick="applyTriageSuggestion(' + onclickArgs + ')">' +
                    '<div class="tr-card-top">' +
                        '<span class="tr-rank">#' + (i + 1) + '</span>' +
                        '<span class="tr-name">' + safeScen + '</span>' +
                        (r.confidence ? '<span class="tr-conf">' + r.confidence + '</span>' : '') +
                    '</div>' +
                    '<div class="tr-cat">' + safeCat + '</div>' +
                    (srPrev ? '<div class="tr-sr">' + escapeHtml(srPrev) + '</div>' : '') +
                    '<div class="tr-hint">\u21a9 Tap to load</div>' +
                '</div>';
        });

        el.innerHTML = html;
    }

    // ══════════════════════════════════════════════════════════════
    // Public API
    // ══════════════════════════════════════════════════════════════

    function runTriage() {
        var inputEl = document.getElementById('triage-input');
        var msg = (inputEl ? inputEl.value : '').trim();
        if (!msg) { showToast('Paste the eater\'s message first', 'error'); return; }

        var resultsEl = document.getElementById('triage-results');
        if (resultsEl) {
            resultsEl.innerHTML = '<div class="tr-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span> Analyzing\u2026</div>';
        }

        // Layer 1 — instant local scoring (synchronous)
        var localHits = _triageLocal(msg);
        _renderResults(localHits, 'quick');

        // Layer 2 — Gemini AI (non-blocking, updates results in background)
        var scenarioContext = _buildScenarioContext();
        RPC.call('triageMessage', { message: msg, scenarioContext: scenarioContext })
            .then(function (res) {
                if (res && Array.isArray(res.suggestions) && res.suggestions.length) {
                    _renderResults(res.suggestions, 'ai');
                }
            })
            .catch(function () { /* silent — Layer 1 results are already visible */ });
    }

    function applyTriageSuggestion(scenarioName, category) {
        if (category) App.ScenarioService.selectCategory(category, false);
        if (scenarioName) App.ScenarioService.selectScenarioByName(scenarioName);
        showToast('Loaded: ' + scenarioName, 'success');
        setTimeout(function () { if (typeof closePanel === 'function') closePanel('triage'); }, 300);
    }

    function clearTriage() {
        var inp = document.getElementById('triage-input');
        if (inp) inp.value = '';
        var res = document.getElementById('triage-results');
        if (res) res.innerHTML = '';
    }

    // ── Publish ────────────────────────────────────────────────────────────────
    global.App = global.App || {};
    global.App.TriageController = { runTriage, applyTriageSuggestion, clearTriage };

    // Legacy shims
    global.runTriage             = runTriage;
    global.applyTriageSuggestion = applyTriageSuggestion;
    global.clearTriage           = clearTriage;

})(window);
</script>
